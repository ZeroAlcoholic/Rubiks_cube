                const rect = overlay.getBoundingClientRect();
                return {
                    width: overlay.width || Math.max(1, Math.round(rect.width)),
                    height: overlay.height || Math.max(1, Math.round(rect.height))
                };
            }

            getVideoFrameContext() {
                const video = document.getElementById('scanner-video');
                if (!video.videoWidth || !video.videoHeight) throw new Error('鏡頭畫面尚未就緒。');
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const display = this.getScannerDisplaySize();
                return { video, canvas, ctx, display, mapPoint: this.getVideoCoverMapper(video, display.width, display.height) };
            }

            readClassifiedSticker(ctx, point) {
                const rgb = this.readStickerRgb(ctx, point);
                return HSVClassifier.classify(rgb.r, rgb.g, rgb.b);
            }

            readStickerRgb(ctx, point) {
                // Universal pixel filter (works for ALL cube body styles):
                //   - Black plastic frame  → dark + grayscale (low max + low chroma range)
                //   - White plastic frame  → indistinguishable from white sticker pixels;
                //                            we DON'T filter (median over the cell handles it)
                //   - Stickerless cubes     → no real frame; only color-color boundaries
                //                            (handled by spatial median, not pixel filter)
                //   - Burnt-out specular   → near-saturated AND grayscale
                //
                // Crucially: a dim COLORED sticker pixel (e.g. dark blue (10,20,80)) is NOT
                // filtered — it has chroma even when dark, so it stays in the median.
                const R = 6;
                const cx = Math.max(R, Math.min(ctx.canvas.width - R - 1, Math.round(point.x)));
                const cy = Math.max(R, Math.min(ctx.canvas.height - R - 1, Math.round(point.y)));
                const pixels = ctx.getImageData(cx - R, cy - R, R * 2 + 1, R * 2 + 1).data;
                const rs = [], gs = [], bs = [];
                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
                    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
                    const range = mx - mn;
                    // Burnt-out specular: very bright + no chroma
                    if (mx >= 250 && range < 10) continue;
                    // Black plastic frame: very dark + no chroma (not a colored sticker in shadow)
                    if (mx < 40 && range < 15) continue;
                    rs.push(r); gs.push(g); bs.push(b);
                }
                // Fallback: too many filtered out (e.g. white sticker fully white-frame surrounded,
                // or aggressive filter conditions) — use all pixels
                if (rs.length < 24) {
                    rs.length = gs.length = bs.length = 0;
                    for (let i = 0; i < pixels.length; i += 4) {
                        rs.push(pixels[i]); gs.push(pixels[i + 1]); bs.push(pixels[i + 2]);
                    }
                }
                const median = arr => { arr.sort((a, b) => a - b); return arr[Math.floor(arr.length / 2)]; };
                return { r: median(rs), g: median(gs), b: median(bs) };
            }

            // ── Stage 3 helpers: affine fit + apply ──────────────────────────────
            // Captures rotation, scale, shear, and (with iteration) approximates perspective.
            // Used after per-sticker refinement to smooth noise and recover the global
            // grid transformation — handles parallelogram skew and mild trapezoid distortion.
            _invert3x3(m) {
                const a=m[0], b=m[1], c=m[2], d=m[3], e=m[4], f=m[5], g=m[6], h=m[7], i=m[8];
                const det = a*(e*i - f*h) - b*(d*i - f*g) + c*(d*h - e*g);
                if (Math.abs(det) < 1e-9) return null;
                const inv = 1 / det;
                return [
                    (e*i - f*h)*inv, (c*h - b*i)*inv, (b*f - c*e)*inv,
                    (f*g - d*i)*inv, (a*i - c*g)*inv, (c*d - a*f)*inv,
                    (d*h - e*g)*inv, (b*g - a*h)*inv, (a*e - b*d)*inv,
                ];
            }
            _fitAffine2D(srcPts, dstPts) {
                // Solve [a b c; d e f] minimizing |A*src - dst|² via normal equations.
                // Returns [a,b,c,d,e,f] or null if degenerate.
                const n = srcPts.length;
                if (n < 3 || dstPts.length !== n) return null;
                let sxx=0, sxy=0, sx=0, syy=0, sy=0;
                let s_dxx=0, s_dxy=0, s_dx=0, s_dyx=0, s_dyy=0, s_dy=0;
                for (let i = 0; i < n; i++) {
                    const x=srcPts[i].x, y=srcPts[i].y;
                    const xp=dstPts[i].x, yp=dstPts[i].y;
                    sxx+=x*x; sxy+=x*y; sx+=x;
                    syy+=y*y; sy+=y;
                    s_dxx+=xp*x; s_dxy+=xp*y; s_dx+=xp;
                    s_dyx+=yp*x; s_dyy+=yp*y; s_dy+=yp;
                }
                const PtP = [sxx, sxy, sx, sxy, syy, sy, sx, sy, n];
                const inv = this._invert3x3(PtP);
                if (!inv) return null;
                const a = inv[0]*s_dxx + inv[1]*s_dxy + inv[2]*s_dx;
                const b = inv[3]*s_dxx + inv[4]*s_dxy + inv[5]*s_dx;
                const c = inv[6]*s_dxx + inv[7]*s_dxy + inv[8]*s_dx;
                const d = inv[0]*s_dyx + inv[1]*s_dyy + inv[2]*s_dy;
                const e = inv[3]*s_dyx + inv[4]*s_dyy + inv[5]*s_dy;
                const f = inv[6]*s_dyx + inv[7]*s_dyy + inv[8]*s_dy;
                return [a, b, c, d, e, f];
            }
            _applyAffine(p, A) {
                return { x: A[0]*p.x + A[1]*p.y + A[2], y: A[3]*p.x + A[4]*p.y + A[5] };
            }

            // ── Stage 1: Global translation search ──────────────────────────────
            // Finds the (dx, dy) shift that, when applied to ALL predicted points,
            // makes them collectively land on the actual cube grid.
            // Handles WHOLE-OVERLAY misalignment up to ±20 px (e.g., user holds phone
            // slightly off-center). Per-sticker refinement (Stage 2) handles the residual.
            //
            // The objective: minimize total variance over all shifted points
            // (low total variance = points are mostly on uniform sticker interiors).
            // Penalties for frame/specular regions (same logic as Stage 2).
            //
            // Coarse search: ±20 px in 4 px steps (11×11 = 121 candidates).
            // Per-point sample: 5×5 window (25 px). Total ~80k pixel reads.
            // Cost: ~30–60 ms (capture-time only, not in RAF loop).
            _findGlobalTranslation(ctx, predictedPoints) {
                if (!predictedPoints.length) return { dx: 0, dy: 0 };
                const W = ctx.canvas.width, H = ctx.canvas.height;
                const SEARCH = 20, STEP = 4, WIN = 2;
                const BUFFER = SEARCH + WIN + 2;

                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (const p of predictedPoints) {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                }
                const x0 = Math.max(0, Math.floor(minX) - BUFFER);
                const y0 = Math.max(0, Math.floor(minY) - BUFFER);
                const x1 = Math.min(W - 1, Math.ceil(maxX) + BUFFER);
                const y1 = Math.min(H - 1, Math.ceil(maxY) + BUFFER);
                const rW = x1 - x0 + 1, rH = y1 - y0 + 1;
                if (rW <= 0 || rH <= 0) return { dx: 0, dy: 0 };
                let data;
                try { data = ctx.getImageData(x0, y0, rW, rH).data; }
                catch { return { dx: 0, dy: 0 }; }

                const winN = (2 * WIN + 1) * (2 * WIN + 1);
                const baseLocal = predictedPoints.map(p => ({
                    x: Math.round(p.x - x0),
                    y: Math.round(p.y - y0),
                }));

                let bestDx = 0, bestDy = 0, bestScore = Infinity;
                for (let dy = -SEARCH; dy <= SEARCH; dy += STEP) {
                    for (let dx = -SEARCH; dx <= SEARCH; dx += STEP) {
                        let totalScore = 0;
                        for (const bp of baseLocal) {
                            const cx = bp.x + dx, cy = bp.y + dy;
                            if (cx - WIN < 0 || cy - WIN < 0 || cx + WIN >= rW || cy + WIN >= rH) {
                                totalScore += 1e6;
                                continue;
                            }
                            let sR=0, sG=0, sB=0, sRR=0, sGG=0, sBB=0;
                            for (let yy = -WIN; yy <= WIN; yy++) {
                                let idx = ((cy + yy) * rW + (cx - WIN)) * 4;
                                for (let xx = -WIN; xx <= WIN; xx++) {
                                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                                    sR += r; sG += g; sB += b;
                                    sRR += r*r; sGG += g*g; sBB += b*b;
                                    idx += 4;
                                }
                            }
                            const mR = sR/winN, mG = sG/winN, mB = sB/winN;
                            const variance = (sRR/winN - mR*mR) + (sGG/winN - mG*mG) + (sBB/winN - mB*mB);
                            const mx = Math.max(mR, mG, mB), mn = Math.min(mR, mG, mB);
                            const range = mx - mn;
                            const blackPenalty = (mx < 60 && range < 25) ? 5000 : 0;
                            const specPenalty = (mx >= 250 && range < 8) ? 3000 : 0;
                            totalScore += variance + blackPenalty + specPenalty;
                        }
                        // Mild regularization: prefer smaller global shifts
                        totalScore += (dx*dx + dy*dy) * 8;
                        if (totalScore < bestScore) {
                            bestScore = totalScore;
                            bestDx = dx; bestDy = dy;
                        }
                    }
                }
                return { dx: bestDx, dy: bestDy };
            }

            // ── Auto-snap sample points to actual sticker centers ────────────────
            // Universal variance-based local refinement.
            //
            // Universal principle (works for ALL cube types):
            //   sticker interior = uniform color (low variance)
            //   sticker boundary = color discontinuity (high variance)
            // Frames are physically too thin (<5px in image) to fit a 7×7 window
            // entirely, so any window near a frame includes mixed colors → high variance
            // → variance minimization naturally prefers sticker interiors.
            //
            // This means the algorithm works without assumption about frame style:
            //   - Black-bodied stickered (e.g., MoYu/MFJS — see resources/PXL_*.jpg)
            //   - White-bodied stickered (cube has white plastic between stickers)
            //   - Stickerless (color-touching-color, no real frame)
            //   - Translucent / colored-body / custom paint
            //
            // Targeted penalties (only fire when the signature is unambiguous):
            //   - "true black frame" only: very low saturation AND very low max channel,
            //     so dim-but-colored stickers in shadow are NOT mistaken for frame.
            //   - "burnt-out specular" only: max ≥ 250 AND saturation ≈ 0,
            //     so normal bright/white stickers are NOT incorrectly avoided.
            //
            // Performance: one getImageData call per panel; ~5–15 ms per panel total.
            _refinePanelSamplePoints(ctx, predictedPoints) {
                if (!predictedPoints.length) return [];
                const W = ctx.canvas.width, H = ctx.canvas.height;
                const SEARCH = 8;   // search ±8 px (well under half a sticker cell)
                const WIN = 3;      // 7×7 sample window for variance
                const BUFFER = SEARCH + WIN;

                // Read one bounding region (saves 9× getImageData calls)
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                for (const p of predictedPoints) {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                }
                const x0 = Math.max(0, Math.floor(minX) - BUFFER);
                const y0 = Math.max(0, Math.floor(minY) - BUFFER);
                const x1 = Math.min(W - 1, Math.ceil(maxX) + BUFFER);
                const y1 = Math.min(H - 1, Math.ceil(maxY) + BUFFER);
                const rW = x1 - x0 + 1, rH = y1 - y0 + 1;
                if (rW <= 0 || rH <= 0) return predictedPoints;
                let data;
                try { data = ctx.getImageData(x0, y0, rW, rH).data; }
                catch { return predictedPoints; } // CORS / context-loss fallback

                const winSize = 2 * WIN + 1;
                const winN = winSize * winSize;
                let totalDisp = 0;

                const refined = predictedPoints.map(p => {
                    const px = Math.round(p.x - x0);
                    const py = Math.round(p.y - y0);
                    let bestDx = 0, bestDy = 0, bestScore = Infinity;
                    for (let dy = -SEARCH; dy <= SEARCH; dy++) {
                        for (let dx = -SEARCH; dx <= SEARCH; dx++) {
                            const cx = px + dx, cy = py + dy;
                            if (cx - WIN < 0 || cy - WIN < 0 || cx + WIN >= rW || cy + WIN >= rH) continue;
                            let sR=0, sG=0, sB=0, sRR=0, sGG=0, sBB=0;
                            for (let yy = -WIN; yy <= WIN; yy++) {
                                let idx = ((cy + yy) * rW + (cx - WIN)) * 4;
                                for (let xx = -WIN; xx <= WIN; xx++) {
                                    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                                    sR += r; sG += g; sB += b;
                                    sRR += r*r; sGG += g*g; sBB += b*b;
                                    idx += 4;
                                }
                            }
                            const mR = sR/winN, mG = sG/winN, mB = sB/winN;
                            const variance = (sRR/winN - mR*mR) + (sGG/winN - mG*mG) + (sBB/winN - mB*mB);
                            // ── Targeted penalties (only when signature is unambiguous) ──
                            const mx = Math.max(mR, mG, mB);
                            const mn = Math.min(mR, mG, mB);
                            const range = mx - mn; // chroma range — proxy for saturation
                            // True black frame: very dark + very grayscale.
                            // Dim colored stickers (range > 25) are NOT penalized.
                            const blackFramePenalty = (mx < 60 && range < 25) ? (60 - mx) * 80 : 0;
                            // Burnt-out specular: max channel saturated AND no chroma.
                            // Normal white stickers (mx ~240) are NOT penalized.
                            const specularPenalty = (mx >= 250 && range < 8) ? 8000 : 0;
                            // Mild distance regularization
                            const distPenalty = (dx*dx + dy*dy) * 0.4;
                            const score = variance + blackFramePenalty + specularPenalty + distPenalty;
                            if (score < bestScore) {
                                bestScore = score;
                                bestDx = dx; bestDy = dy;
                            }
                        }
                    }
                    totalDisp += Math.hypot(bestDx, bestDy);
                    return { x: x0 + px + bestDx, y: y0 + py + bestDy };
                });
                this._lastRefineAvgDisp = totalDisp / predictedPoints.length;
                return refined;
            }

            sampleScannerPanelRaw(ctx, corners, mapPoint = point => point) {
                const predicted = [];
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const overlayPoint = this.bilinearPoint(corners, (col + 0.5) / 3, (row + 0.5) / 3);
                        predicted.push(mapPoint(overlayPoint));
                    }
                }
                // Stage 2 only here; Stage 1 (global) and Stage 3 (affine) are applied
                // at the SHOT level (across all 27 points) for better statistics.
                const refined = this._refinePanelSamplePoints(ctx, predicted);
                if (this._refineAvgDisps) this._refineAvgDisps.push(this._lastRefineAvgDisp || 0);
                return refined.map(p => this.readStickerRgb(ctx, p));
            }

            sampleScannerFace() {
                const { ctx, display, mapPoint } = this.getVideoFrameContext();
                const size = Math.min(display.width, display.height) * 0.62;
                const x0 = (display.width - size) / 2;
                const y0 = (display.height - size) / 2;
                const stickers = [];

                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const overlayPoint = {
                            x: x0 + (col + 0.5) * size / 3,
                            y: y0 + (row + 0.5) * size / 3
                        };
                        stickers.push(this.readClassifiedSticker(ctx, mapPoint(overlayPoint)));
                    }
                }
                return stickers;
            }

            sampleScannerFaceRaw() {
                const { ctx, display, mapPoint } = this.getVideoFrameContext();
                const size = Math.min(display.width, display.height) * 0.62;
                const x0 = (display.width - size) / 2;
                const y0 = (display.height - size) / 2;
                const initial = [];
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        initial.push(mapPoint({
                            x: x0 + (col + 0.5) * size / 3,
                            y: y0 + (row + 0.5) * size / 3,
                        }));
                    }
                }
                // Stage 1: Global translation
                const shift = this._findGlobalTranslation(ctx, initial);
                const shiftedInitial = initial.map(p => ({ x: p.x + shift.dx, y: p.y + shift.dy }));
                const globalDisp = Math.hypot(shift.dx, shift.dy);
                // Stage 2: per-sticker refinement
                const refined1 = this._refinePanelSamplePoints(ctx, shiftedInitial);
                const fineDisp1 = this._lastRefineAvgDisp || 0;
                // Stage 3: affine fit + re-refine (handles rotation/skew of single face)
                let finalPoints = refined1;
                let stage3Disp = 0;
                const A = this._fitAffine2D(initial, refined1);
                if (A) {
                    const scaleX = Math.hypot(A[0], A[3]);
                    const scaleY = Math.hypot(A[1], A[4]);
                    const det = A[0]*A[4] - A[1]*A[3];
                    const ok = scaleX > 0.5 && scaleX < 2.0 && scaleY > 0.5 && scaleY < 2.0 && det > 0;
                    if (ok) {
                        const reprojected = initial.map(p => this._applyAffine(p, A));
                        const refined2 = this._refinePanelSamplePoints(ctx, reprojected);
                        const residual2 = this._lastRefineAvgDisp || 0;
                        if (residual2 < fineDisp1 * 1.2) {
                            finalPoints = refined2;
                            stage3Disp = residual2;
                        }
                    }
                }
                this._lastGlobalShift = shift;
                if (this._refineAvgDisps) {
                    this._refineAvgDisps.push(globalDisp + (stage3Disp || fineDisp1));
                }
                return finalPoints.map(p => this.readStickerRgb(ctx, p));
            }

            sampleScannerPanel(ctx, corners, mapPoint = point => point) {
                const stickers = [];
                for (let row = 0; row < 3; row++) {
                    for (let col = 0; col < 3; col++) {
                        const overlayPoint = this.bilinearPoint(corners, (col + 0.5) / 3, (row + 0.5) / 3);
                        stickers.push(this.readClassifiedSticker(ctx, mapPoint(overlayPoint)));
                    }
                }
                return stickers;
            }

            sampleScannerShot() {
                const { ctx, display, mapPoint } = this.getVideoFrameContext();
                const panels = this.getTwoShotPanels(display.width, display.height);
                const shot = TWO_SHOT_SCANS[this.scanIndex];
                if (!shot) throw new Error('沒有可擷取的斜角掃描步驟。');
                const result = {};
                Object.entries(shot.panels).forEach(([key, face]) => {
                    result[face] = this.sampleScannerPanel(ctx, panels[key].corners, mapPoint);
                });
                return result;
            }

            sampleScannerShotRaw() {
                const { ctx, display, mapPoint } = this.getVideoFrameContext();
                const panels = this.getTwoShotPanels(display.width, display.height);
                const shot = TWO_SHOT_SCANS[this.scanIndex];
                if (!shot) throw new Error('沒有可擷取的斜角掃描步驟。');

                // ── 3-stage alignment pipeline ──────────────────────────────────
                // Stage 1: global translation        (handles whole-overlay shift)
                // Stage 2: per-sticker refinement    (handles per-cell offsets)
                // Stage 3: affine fit + refine again (handles rotation/scale/shear/parallelogram)
                //
                // Run on all 27 predicted points together for best statistics.

                const panelKeys = Object.keys(shot.panels);
                const buildAllPredicted = (mp) => {
                    const out = [];
                    panelKeys.forEach(key => {
                        const corners = panels[key].corners;
                        for (let row = 0; row < 3; row++) {
                            for (let col = 0; col < 3; col++) {
                                out.push(mp(this.bilinearPoint(corners, (col + 0.5) / 3, (row + 0.5) / 3)));
                            }
                        }
                    });
                    return out;
                };

                // Stage 1: Global translation
                const initial = buildAllPredicted(mapPoint);
                const shift = this._findGlobalTranslation(ctx, initial);
                const shiftedInitial = initial.map(p => ({ x: p.x + shift.dx, y: p.y + shift.dy }));
                const globalDisp = Math.hypot(shift.dx, shift.dy);

                // Stage 2: First per-sticker refinement
                const refined1 = this._refinePanelSamplePoints(ctx, shiftedInitial);
                const fineDisp1 = this._lastRefineAvgDisp || 0;

                // Stage 3: Fit affine from initial → refined1, apply to original predicted, re-refine.
                // Outliers in refined1 (noisy stickers) get smoothed out by the global fit,
                // while consistent rotation/scale/shear is captured.
                let finalPoints = refined1;
                let stage3Disp = 0;
                const A = this._fitAffine2D(initial, refined1);
                if (A) {
                    // Sanity check: affine should be near identity-ish (no degenerate scale/flip)
                    const scaleX = Math.hypot(A[0], A[3]);
                    const scaleY = Math.hypot(A[1], A[4]);
                    const det = A[0]*A[4] - A[1]*A[3];
                    const ok = scaleX > 0.5 && scaleX < 2.0 && scaleY > 0.5 && scaleY < 2.0 && det > 0;
                    if (ok) {
                        const reprojected = initial.map(p => this._applyAffine(p, A));
                        const refined2 = this._refinePanelSamplePoints(ctx, reprojected);
                        // Use refined2 if its post-fit residual is smaller than refined1's residual
                        const residual2 = this._lastRefineAvgDisp || 0;
                        if (residual2 < fineDisp1 * 1.2) {
                            finalPoints = refined2;
                            stage3Disp = residual2;
                        }
                    }
                }

                this._lastGlobalShift = shift;
                if (this._refineAvgDisps) {
                    this._refineAvgDisps.push(globalDisp + (stage3Disp || fineDisp1));
                }

                // Now read RGB at refined points, grouped by panel
                const result = [];
                panelKeys.forEach((key, panelIdx) => {
                    const stickers = [];
                    for (let i = 0; i < 9; i++) {
                        stickers.push(this.readStickerRgb(ctx, finalPoints[panelIdx * 9 + i]));
                    }
                    result.push({ slot: key, expectedFace: shot.panels[key], stickers });
                });
                return result;
            }

            srgbToLinear(value) {
                const v = value / 255;
                return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            }

            rgbToLab(rgb) {
                const r = this.srgbToLinear(rgb.r);
                const g = this.srgbToLinear(rgb.g);
                const b = this.srgbToLinear(rgb.b);
                const x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047;
                const y = (r * 0.2126 + g * 0.7152 + b * 0.0722) / 1.00000;
                const z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
                const f = value => value > 0.008856 ? Math.cbrt(value) : (7.787 * value) + (16 / 116);
                const fx = f(x), fy = f(y), fz = f(z);
                return { l: (116 * fy) - 16, a: 500 * (fx - fy), b: 200 * (fy - fz) };
            }

            labDistanceSq(a, b) {
                const dl = a.l - b.l;
                const da = a.a - b.a;
                const db = a.b - b.b;
                return dl * dl + da * da + db * db;
            }

            // For uncalibrated multi-refs: down-weight L* (lightness) which varies with
            // lighting intensity, keeping a* and b* (chromaticity) at full weight.
            // Key insight from DWLP paper / kociemba.org: L* is the lighting-sensitive
            // component; a* and b* are far more stable across lighting conditions.
            // Calibrated single-ref (real center sticker) uses full L*a*b* weight.
            _labDist(lab, ref, downweightL) {
                const dl = (lab.l - ref.l) * (downweightL ? 0.35 : 1.0);
                const da = lab.a - ref.a;
                const db = lab.b - ref.b;
                return dl * dl + da * da + db * db;
            }

            classifyRgbWithCalibration(rgb, paletteLab) {
                const lab = this.rgbToLab(rgb);
                let bestFace = null;
                let bestDistance = Infinity;
                Object.entries(paletteLab).forEach(([face, refs]) => {
                    const refsArr = Array.isArray(refs) ? refs : [refs];
                    const isUncalibrated = refsArr.length > 1;
                    const minDist = Math.min(...refsArr.map(ref => this._labDist(lab, ref, isUncalibrated)));
                    if (minDist < bestDistance) {
                        bestFace = face;
                        bestDistance = minDist;
                    }
                });
                return bestFace;
            }

            classifyRgbWithConfidence(rgb, paletteLab) {
                const lab = this.rgbToLab(rgb);
                const ranked = Object.entries(paletteLab).map(([face, refs]) => {
                    const refsArr = Array.isArray(refs) ? refs : [refs];
                    const isUncalibrated = refsArr.length > 1;
                    const dist = Math.min(...refsArr.map(ref => this._labDist(lab, ref, isUncalibrated)));
                    return { face, dist };
                }).sort((a, b) => a.dist - b.dist);
                const best = ranked[0], second = ranked[1];
                const confidence = best.dist > 0 ? second.dist / best.dist : 99;
                return { face: best.face, confidence };
            }

            hexToRgb(hex) {
                const value = parseInt(hex.replace('#', ''), 16);
                return { r: (value >> 16) & 255, g: (value >> 8) & 255, b: value & 255 };
            }

            inferPanelFacesByCenters(rawPanels) {
                if (!Array.isArray(rawPanels) || rawPanels.length !== 6) {
                    throw new Error(`需要 6 個已拍面，現在只有 ${rawPanels ? rawPanels.length : 0} 個。`);
                }
                rawPanels.forEach((panel, index) => {
                    if (!panel.stickers || panel.stickers.length !== 9) throw new Error(`第 ${index + 1} 個面板沒有 9 個取樣點。`);
                });

                const panelLabs = rawPanels.map(panel => this.rgbToLab(panel.stickers[4]));
                // Use same realistic multi-ref defaults as buildProgressivePalette
                const CANONICAL_RGB = {
                    U: { r: 200, g: 218, b: 15 }, R: { r: 228, g: 88,  b: 18 },
                    F: { r: 25,  g: 65,  b: 192 }, D: { r: 208, g: 215, b: 205 },
                    L: { r: 198, g: 28,  b: 20 },  B: { r: 18,  g: 162, b: 40 },
                };
                const canonicalLabs = {};
                STATE_FACE_ORDER.forEach(face => {
                    canonicalLabs[face] = this.rgbToLab(CANONICAL_RGB[face]);
                });

                let best = { cost: Infinity, faces: null };
                const search = (idx, unusedFaces, chosen, cost) => {
                    if (cost >= best.cost) return;
                    if (idx >= rawPanels.length) {
                        best = { cost, faces: chosen.slice() };
                        return;
                    }
                    unusedFaces.forEach(face => {
                        const nextUnused = unusedFaces.filter(item => item !== face);
                        const nextCost = cost + this.labDistanceSq(panelLabs[idx], canonicalLabs[face]);
                        chosen.push(face);
                        search(idx + 1, nextUnused, chosen, nextCost);
                        chosen.pop();
                    });
                };
                search(0, STATE_FACE_ORDER.slice(), [], 0);
                if (!best.faces) throw new Error('無法由中心格判斷六面。');
                return rawPanels.map((panel, index) => ({ ...panel, face: best.faces[index] }));
            }

            buildStateFromCapturedPanels(rawPanels) {
                const panels = this.inferPanelFacesByCenters(rawPanels);
                const rawFaces = {};
                panels.forEach(panel => {
                    rawFaces[panel.face] = panel.stickers;
                });
                const paletteLab = {};
                STATE_FACE_ORDER.forEach(face => {
                    paletteLab[face] = this.rgbToLab(rawFaces[face][4]);
                });
                return STATE_FACE_ORDER.map(face => {
                    return rawFaces[face].map(rgb => this.classifyRgbWithCalibration(rgb, paletteLab)).join('');
                }).join('');
            }

            buildStateFromRawScan(rawFaces) {
                const panels = STATE_FACE_ORDER.map(face => ({ expectedFace: face, stickers: rawFaces[face] }));
                return this.buildStateFromCapturedPanels(panels);
            }

            captureScannerFrame() {
                if (this.scannerMode === 'two-shot') {
                    this.captureScannerShot();
                } else {
                    this.captureScannerFace();
                }
            }

            async captureScannerShot() {
                const captureBtn = document.getElementById('scanner-capture-btn');
                if (captureBtn) captureBtn.disabled = true;
                try {
                    // Track per-panel refinement displacement (alignment quality)
                    this._refineAvgDisps = [];
                    const rawPanels = this.sampleScannerShotRaw();
                    await this.flashCapture();
                    const isLast = (this.scanIndex + 1) >= TWO_SHOT_SCANS.length;
                    await new Promise(r => setTimeout(r, 150));
                    this.showShotReview(rawPanels, this.scanIndex, isLast);
                } catch (error) {
                    document.getElementById('scanner-status').innerText = `擷取失敗：${error.message}`;
                    if (captureBtn) captureBtn.disabled = false;
                }
            }

            showShotReview(rawPanels, shotIdx, isLastShot) {
                // Stop live animation loop and freeze video on last captured frame
                if (this.scannerAnimation) { cancelAnimationFrame(this.scannerAnimation); this.scannerAnimation = null; }
                const video = document.getElementById('scanner-video');
                if (video) video.pause();

                // Commit raw panels so progressive palette includes this shot's centers
                rawPanels.forEach(p => this.scanRawPanels.push(p));

                // Classify each sticker with the same nearest-neighbour Lab classifier used by
                // the live preview (classifyRgbWithConfidence + progressive palette).
                // k-means was removed: with only 3 real colors per shot, k=6 always split each
                // color into sub-clusters that got matched to wrong face labels.
                const palette = this.buildProgressivePalette();
                this.shotReviewRejectedAnchors = [];  // kept for snapshot compatibility

                this.shotReviewCurrentPanels = rawPanels.map(panel => {
                    const colors = [], confidence = [];
                    panel.stickers.forEach((rgb, i) => {
                        let face, conf;
                        if (i === 4) {
                            // Center sticker: identity determined by which face faces the camera,
                            // not by color — avoids misclassifying under unusual lighting.
                            face = panel.expectedFace || panel.slot;
                            conf = 99;
                        } else {
                            const r = this.classifyRgbWithConfidence(rgb, palette);
                            face = r.face || panel.expectedFace;
                            conf = r.confidence;
                            // Specular highlight: color info is physically lost
                            if (rgb.r >= 248 || rgb.g >= 248 || rgb.b >= 248) conf = Math.min(conf, 1.4);
                            // Deep shadow: very dark sticker may confuse colors
                            if (Math.max(rgb.r, rgb.g, rgb.b) < 55) conf = Math.min(conf, 1.4);
                        }
                        colors.push(face);
                        confidence.push(conf);
                    });
                    return {
                        key: panel.slot, expectedFace: panel.expectedFace,
                        classifiedColors: colors, originalFaces: [...colors],
                        originalRgbs: panel.stickers, confidence,
                        userEdits: new Array(9).fill(false),
                    };
                });
                // Auto-detect orientation (same rotation for all panels in a shot).
                // Only rotates whole-face arrays — never changes individual sticker colors.
                const shotRot = this._detectTwoShotRotation(this.shotReviewCurrentPanels);
                if (shotRot > 0) this._applyTwoShotRotation(shotRot);

                this.shotReviewCurrentIdx = shotIdx;
                this.shotReviewIsLast = isLastShot;
                this.shotReviewSelectedColor = 'U';
                this.shotReviewActive = true;

                // Hide scanner shooting UI
                const scannerPanel = document.getElementById('scanner-panel');
                scannerPanel.querySelectorAll('.scanner-modes, .panel-actions, #scan-instruction-box, #stability-bar, #scan-face-chips, #scanner-motion-guide').forEach(el => {
                    el.style.display = 'none';
                });

                // Show palette
                const palEl = document.getElementById('shot-review-palette');
                if (palEl) {
                    const NAMES = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                    palEl.innerHTML = STATE_FACE_ORDER.map(face => {
                        const sel = face === this.shotReviewSelectedColor ? ' active' : '';
                        return `<div class="shot-review-swatch${sel}" style="background:${FACE_COLORS[face]}"
                            title="${face} ${NAMES[face]}" onclick="game.selectShotReviewColor('${face}')">${NAMES[face]}</div>`;
                    }).join('');
                    palEl.classList.add('active');
                }
                const hintEl = document.getElementById('shot-review-hint');
                if (hintEl) hintEl.classList.add('active');

                // Show action buttons (with back button when applicable)
                const actEl = document.getElementById('shot-review-actions');
                if (actEl) {
                    const nextLabel = isLastShot ? '確認解題 →' : '下一張 →';
                    const nextClick = isLastShot ? 'game.confirmShotReview()' : 'game.nextShotReview()';
                    const showBack = shotIdx > 0 && (this.shotReviewHistory && this.shotReviewHistory.length > 0);
                    const backBtn = showBack
                        ? '<button class="btn" onclick="game.goBackOneShot()">← 上一張</button>'
                        : '';
                    actEl.innerHTML = `${backBtn}<button class="btn" onclick="game.retakeShotReview()">↩ 重拍</button>
                        <button class="btn" onclick="game.rotateShotReview()" title="旋轉 90°（若拍攝角度偏了）">↻ 旋轉</button>
                        <button class="btn solve-btn" onclick="${nextClick}">${nextLabel}</button>`;
                    actEl.classList.add('active');
                }

                // Canvas click/touch listener — remove stale handler before registering
                const canvas = document.getElementById('scanner-overlay');
                if (this._shotReviewClickHandler) {
                    canvas.removeEventListener('click', this._shotReviewClickHandler);
                    canvas.removeEventListener('touchend', this._shotReviewClickHandler);
                }
                this._shotReviewClickHandler = evt => this.handleShotReviewCanvasClick(evt);
                canvas.addEventListener('click', this._shotReviewClickHandler);
                canvas.addEventListener('touchend', this._shotReviewClickHandler);
                canvas.style.cursor = 'pointer';

                this.renderShotReview();
            }

            renderShotReview() {
                const canvas = document.getElementById('scanner-overlay');
                if (!canvas || !this.shotReviewCurrentPanels) return;
                const rect = canvas.getBoundingClientRect();
                const needW = Math.max(1, Math.round(rect.width));
                const needH = Math.max(1, Math.round(rect.height));
                if (canvas.width !== needW || canvas.height !== needH) {
                    canvas.width = needW;
                    canvas.height = needH;
                }
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const panels = this.getTwoShotPanels(canvas.width, canvas.height);

                // Count stickers per color for the status row
                const colorCount = {};
                STATE_FACE_ORDER.forEach(f => { colorCount[f] = 0; });

                this.shotReviewCurrentPanels.forEach(panel => {
                    const corners = panels[panel.key].corners;
                    for (let i = 0; i < 9; i++) {
                        const row = Math.floor(i / 3), col = i % 3;
                        const tl = this.bilinearPoint(corners, col / 3, row / 3);
                        const tr = this.bilinearPoint(corners, (col + 1) / 3, row / 3);
                        const bl = this.bilinearPoint(corners, col / 3, (row + 1) / 3);
                        const br = this.bilinearPoint(corners, (col + 1) / 3, (row + 1) / 3);
                        const isCenter = (i === 4);
                        const faceVal = panel.classifiedColors[i];
                        const conf = panel.confidence ? panel.confidence[i] : 99;
                        const isUncertain = conf < 2.0;
                        const color = FACE_COLORS[faceVal] || '#888888';
                        colorCount[faceVal] = (colorCount[faceVal] || 0) + 1;

                        // Semi-transparent fill (80%/60%) so the frozen camera frame shows through
                        ctx.fillStyle = color + (isCenter ? 'cc' : '99');
                        ctx.beginPath();
                        ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
                        ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
                        ctx.closePath();
                        ctx.fill();

                        // Uncertain stickers: orange dashed border warning
                        if (isUncertain) {
                            ctx.save();
                            ctx.setLineDash([3, 3]);
                            ctx.strokeStyle = '#f97316';
                            ctx.lineWidth = 2.5;
                            ctx.beginPath();
                            ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
                            ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
                            ctx.closePath();
                            ctx.stroke();
                            ctx.restore();
                        }
                        if (isCenter) {
                            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
                            ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
                            ctx.closePath();
                            ctx.stroke();
                        }
                    }
                    // Grid lines
                    this.drawScannerPanelGrid(ctx, corners);
                    // Face label badge at panel center
                    const ctr = this.bilinearPoint(corners, 0.5, 0.5);
                    ctx.fillStyle = 'rgba(2,10,7,0.72)';
                    ctx.beginPath();
                    ctx.arc(ctr.x, ctr.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#dcfce7';
                    ctx.font = '700 14px system-ui, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(panel.expectedFace, ctr.x, ctr.y);
                });

                // Update hint bar: combined cross-shot color counts with ✓/⚠ + uncertainty warning
                const hintEl = document.getElementById('shot-review-hint');
                if (hintEl) {
                    // Total counts include both this shot's stickers + previously confirmed shots
                    const totalCount = {};
                    STATE_FACE_ORDER.forEach(f => { totalCount[f] = 0; });
                    [...(this.shotReviewAllEdited || []), ...this.shotReviewCurrentPanels].forEach(p => {
                        p.classifiedColors.forEach(c => { if (totalCount[c] !== undefined) totalCount[c]++; });
                    });
                    const NAMES = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                    const countStr = STATE_FACE_ORDER.map(f => {
                        const n = totalCount[f];
                        const tag = n === 9 ? '✓' : n > 9 ? '⚠' : '';
                        const col = n === 9 ? '#86efac' : n > 9 ? '#fca5a5' : 'rgba(255,255,255,0.55)';
                        return `<span style="color:${col}">${NAMES[f]}${n}${tag}</span>`;
                    }).join(' ');
                    // Count uncertain stickers across all panels (current shot only)
                    let uncertainCount = 0;
                    this.shotReviewCurrentPanels.forEach(p => {
                        if (p.confidence) p.confidence.forEach((c, i) => { if (i !== 4 && c < 2.0) uncertainCount++; });
                    });
                    const warnPart = uncertainCount > 0
                        ? ` | <span style="color:#fdba74">⚠ ${uncertainCount} 格待確認</span>`
                        : ' | <span style="opacity:0.55">點格子修色</span>';
                    // Alignment quality hint based on auto-refinement displacement
                    let alignPart = '';
                    if (Array.isArray(this._refineAvgDisps) && this._refineAvgDisps.length) {
                        const avg = this._refineAvgDisps.reduce((s, v) => s + v, 0) / this._refineAvgDisps.length;
                        if (avg > 4.5) alignPart = ` | <span style="color:#fca5a5">✗ 對位偏差大（${avg.toFixed(1)}px），建議重拍</span>`;
                        else if (avg > 2.0) alignPart = ` | <span style="color:#fbbf24">○ 已自動微調 ${avg.toFixed(1)}px</span>`;
                        else alignPart = ` | <span style="color:#86efac">✓ 對位精準</span>`;
                    }
                    let orientPart = '';
                    if (Array.isArray(this.shotReviewRejectedAnchors) && this.shotReviewRejectedAnchors.length) {
                        const SLOT_ZH = { top: '頂', left: '左', right: '右' };
                        const FACE_ZH = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                        const parts = this.shotReviewRejectedAnchors.map(({ face, slot }) =>
                            `${SLOT_ZH[slot] || slot}面（期望${FACE_ZH[face] || face}色）`).join('、');
                        orientPart = ` | <span style="color:#fbbf24">⚠ ${parts}色調偏差，請手動確認</span>`;
                    }
                    hintEl.innerHTML = `<span style="font-size:0.72rem">${countStr}</span>${warnPart}${alignPart}${orientPart}`;
                }
            }

            handleShotReviewCanvasClick(evt) {
                evt.preventDefault();
                const canvas = document.getElementById('scanner-overlay');
                if (!canvas || !this.shotReviewCurrentPanels) return;
                const rect = canvas.getBoundingClientRect();
                let cx, cy;
                if (evt.changedTouches && evt.changedTouches.length > 0) {
                    cx = (evt.changedTouches[0].clientX - rect.left) * (canvas.width / rect.width);
                    cy = (evt.changedTouches[0].clientY - rect.top) * (canvas.height / rect.height);
                } else {
                    cx = (evt.clientX - rect.left) * (canvas.width / rect.width);
                    cy = (evt.clientY - rect.top) * (canvas.height / rect.height);
                }
                const panels = this.getTwoShotPanels(canvas.width, canvas.height);
                let hit = false;
                this.shotReviewCurrentPanels.forEach(panel => {
                    if (hit) return;
                    const corners = panels[panel.key].corners;
                    for (let i = 0; i < 9; i++) {
                        const row = Math.floor(i / 3), col = i % 3;
                        const tl = this.bilinearPoint(corners, col / 3, row / 3);
                        const tr = this.bilinearPoint(corners, (col + 1) / 3, row / 3);
                        const br = this.bilinearPoint(corners, (col + 1) / 3, (row + 1) / 3);
                        const bl = this.bilinearPoint(corners, col / 3, (row + 1) / 3);
                        if (this.pointInQuad({ x: cx, y: cy }, tl, tr, br, bl)) {
                            if (i === 4) {
                                // Center clicked: change face identity and reclassify non-user-edited stickers
                                panel.classifiedColors[4] = this.shotReviewSelectedColor;
                                panel.expectedFace = this.shotReviewSelectedColor;
                                if (panel.userEdits) panel.userEdits[4] = true;
                                this._reclassifyPanelFromCenter(panel, this.shotReviewSelectedColor);
                            } else {
                                panel.classifiedColors[i] = this.shotReviewSelectedColor;
                                if (panel.userEdits) panel.userEdits[i] = true;
                                if (panel.confidence) panel.confidence[i] = 99;
                            }
                            hit = true;
                            break;
                        }
                    }
                });
                if (hit) this.renderShotReview();
            }

            _reclassifyPanelFromCenter(panel, newCenterColor) {
                if (!panel.originalRgbs) return;
                // Build palette where the new center color is anchored on this panel's actual center RGB.
                // Other faces keep their existing palette anchors (other panels' centers + calibration).
                const palette = this.buildProgressivePalette();
                const calibAnchors = this._getCalibAnchors();
                if (calibAnchors) {
                    STATE_FACE_ORDER.forEach(face => {
                        const cur = palette[face];
                        if (!cur || (Array.isArray(cur) && cur.length === 0)) {
                            if (calibAnchors[face]) palette[face] = [calibAnchors[face]];
                        }
                    });
                }
                palette[newCenterColor] = [this.rgbToLab(panel.originalRgbs[4])];
                // Reclassify non-center, non-user-edited stickers
                for (let i = 0; i < 9; i++) {
                    if (i === 4) continue;
                    if (panel.userEdits && panel.userEdits[i]) continue;
                    const rgb = panel.originalRgbs[i];
                    const r = this.classifyRgbWithConfidence(rgb, palette);
                    if (r.face) {
                        panel.classifiedColors[i] = r.face;
                        if (panel.confidence) panel.confidence[i] = r.confidence;
                    }
                }
            }

            pointInQuad(p, tl, tr, br, bl) {
                const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
                return cross(tl, tr, p) >= 0 && cross(tr, br, p) >= 0 && cross(br, bl, p) >= 0 && cross(bl, tl, p) >= 0;
            }

            selectShotReviewColor(face) {
                this.shotReviewSelectedColor = face;
                document.querySelectorAll('.shot-review-swatch').forEach((el, i) => {
                    el.classList.toggle('active', STATE_FACE_ORDER[i] === face);
                });
            }

            nextShotReview() {
                this._saveCalibEntries(this._collectFromShotPanels(this.shotReviewCurrentPanels));
                // Snapshot for back-navigation: keep enough state to restore this shot's review
                if (!this.shotReviewHistory) this.shotReviewHistory = [];
                this.shotReviewHistory.push({
                    shotIdx: this.scanIndex,
                    panels: this.shotReviewCurrentPanels.map(p => ({
                        ...p,
                        classifiedColors: [...p.classifiedColors],
                        originalFaces: p.originalFaces ? [...p.originalFaces] : null,
                        originalRgbs: p.originalRgbs ? [...p.originalRgbs] : null,
                        confidence: p.confidence ? [...p.confidence] : null,
                        userEdits: p.userEdits ? [...p.userEdits] : null,
                    })),
                    rawPanelsCount: this.shotReviewCurrentPanels.length,
                    rejectedAnchors: [...(this.shotReviewRejectedAnchors || [])],
                });
                this.shotReviewAllEdited.push(...this.shotReviewCurrentPanels);
                this.exitShotReview(false);
                this.scanIndex++;
                this.updateScannerStatus();
                this._showRotationPrompt();
            }

            // Go back to the previous shot's review (two-shot mode).
            // Restores the previous shot's edited state so user can re-correct.
            goBackOneShot() {
                if (!this.shotReviewHistory || this.shotReviewHistory.length === 0) return;
                const snapshot = this.shotReviewHistory.pop();
                // Hide rotation prompt if visible
                const rotPr = document.getElementById('rotation-prompt');
                if (rotPr) rotPr.classList.add('hidden');
                // Stop live scanning, freeze video
                if (this.scannerAnimation) { cancelAnimationFrame(this.scannerAnimation); this.scannerAnimation = null; }
                const video = document.getElementById('scanner-video');
                if (video) video.pause();
                // Drop the previous shot's panels from the accumulator + raw store
                const cnt = snapshot.rawPanelsCount;
                this.shotReviewAllEdited.splice(-cnt);
                this.scanRawPanels.splice(-cnt);
                // Drop calibration entries from this session that came from these panels
                // (best-effort: just clear sessionCalib entries from the most recent push)
                // Skipping for simplicity — recalibration on re-confirm overwrites.
                this.scanIndex = snapshot.shotIdx;
                this.shotReviewCurrentPanels = snapshot.panels;
                this.shotReviewRejectedAnchors = snapshot.rejectedAnchors || [];
                this.shotReviewIsLast = (this.scanIndex + 1) >= TWO_SHOT_SCANS.length;
                this.shotReviewActive = true;
                this.shotReviewSelectedColor = 'U';
                // Re-show review UI for the previous shot
                this._showShotReviewUIFromState();
            }

            // Helper: re-show shot review UI for restored state (used by goBackOneShot)
            _showShotReviewUIFromState() {
                const scannerPanel = document.getElementById('scanner-panel');
                scannerPanel.querySelectorAll('.scanner-modes, .panel-actions, #scan-instruction-box, #stability-bar, #scan-face-chips, #scanner-motion-guide').forEach(el => {
                    el.style.display = 'none';
                });
                const palEl = document.getElementById('shot-review-palette');
                if (palEl) {
                    const NAMES = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                    palEl.innerHTML = STATE_FACE_ORDER.map(face => {
                        const sel = face === this.shotReviewSelectedColor ? ' active' : '';
                        return `<div class="shot-review-swatch${sel}" style="background:${FACE_COLORS[face]}"
                            title="${face} ${NAMES[face]}" onclick="game.selectShotReviewColor('${face}')">${NAMES[face]}</div>`;
                    }).join('');
                    palEl.classList.add('active');
                }
                const hintEl = document.getElementById('shot-review-hint');
                if (hintEl) hintEl.classList.add('active');
                const actEl = document.getElementById('shot-review-actions');
                if (actEl) {
                    const nextLabel = this.shotReviewIsLast ? '確認解題 →' : '下一張 →';
                    const nextClick = this.shotReviewIsLast ? 'game.confirmShotReview()' : 'game.nextShotReview()';
                    const showBack = this.scanIndex > 0 && (this.shotReviewHistory && this.shotReviewHistory.length > 0);
                    const backBtn = showBack
                        ? '<button class="btn" onclick="game.goBackOneShot()">← 上一張</button>'
                        : '';
                    actEl.innerHTML = `${backBtn}<button class="btn" onclick="game.retakeShotReview()">↩ 重拍</button>
                        <button class="btn" onclick="game.rotateShotReview()" title="旋轉 90°（若拍攝角度偏了）">↻ 旋轉</button>
                        <button class="btn solve-btn" onclick="${nextClick}">${nextLabel}</button>`;
                    actEl.classList.add('active');
                }
                const canvas = document.getElementById('scanner-overlay');
                if (canvas && !this._shotReviewClickHandler) {
                    this._shotReviewClickHandler = evt => this.handleShotReviewCanvasClick(evt);
                    canvas.addEventListener('click', this._shotReviewClickHandler);
                    canvas.addEventListener('touchend', this._shotReviewClickHandler);
                    canvas.style.cursor = 'pointer';
                }
                this.renderShotReview();
            }

            _showRotationPrompt() {
                const el = document.getElementById('rotation-prompt');
                if (el) el.classList.remove('hidden');
            }

            confirmRotationReady() {
                const el = document.getElementById('rotation-prompt');
                if (el) el.classList.add('hidden');
                const video = document.getElementById('scanner-video');
                if (video) video.play();
                this.drawScannerOverlayLoop();
                const captureBtn = document.getElementById('scanner-capture-btn');
                if (captureBtn) captureBtn.disabled = false;
                this.updateScannerMotionGuide();
            }

            retakeShotReview() {
                if (!this.shotReviewCurrentPanels) return;
                const rotPr = document.getElementById('rotation-prompt');
                if (rotPr) rotPr.classList.add('hidden');
                // Remove the committed raw panels for this shot
                this.scanRawPanels.splice(-this.shotReviewCurrentPanels.length);
                this.exitShotReview(true);
                const video = document.getElementById('scanner-video');
                if (video) video.play();
                this.drawScannerOverlayLoop();
                const captureBtn = document.getElementById('scanner-capture-btn');
                if (captureBtn) captureBtn.disabled = false;
            }

            async confirmShotReview() {
                if (!this.shotReviewCurrentPanels) return; // double-tap guard
                // Build state from all edited panels (current shot + previous shots)
                const allPanels = [...(this.shotReviewAllEdited || []), ...this.shotReviewCurrentPanels];
                const rawFaces = {};
                allPanels.forEach(p => { rawFaces[p.expectedFace] = p.classifiedColors; });
                // Force every center sticker to its face letter — prevents user-edited centers from failing validation
                STATE_FACE_ORDER.forEach(face => { if (rawFaces[face]) rawFaces[face][4] = face; });
                const state = STATE_FACE_ORDER.map(face => (rawFaces[face] || []).join('')).join('');
                const v = StateValidator3.validate(state);
                if (v.ok) {
                    // Commit & solve
                    this.shotReviewAllEdited.push(...this.shotReviewCurrentPanels);
                    // Save only the current shot's entries — previous shots were already saved in nextShotReview()
                    this._saveCalibEntries(this._collectFromShotPanels(this.shotReviewCurrentPanels));
                    this.exitShotReview(false);
                    this.closeScanner();
                    await this._finishScanAndSolve(state, 'two-shot');
                    return;
                }
                // 兩拍模式驗證失敗：若只有 cubejs 奇偶錯誤，嘗試深度修復（與六面流程一致）
                const onlyParity = v.errors.length > 0 &&
                    v.errors.every(e => e.includes('cubejs') || e.includes('忠實解析'));
                if (onlyParity) {
                    // 把 shotReviewAllEdited+current 寫入 scanConfirmedFaces 才能用 _tryDeepAutoFix
                    const prevConfirmed = this.scanConfirmedFaces;
                    const prevUserEdits = this.scanFaceUserEdits;
                    this.scanConfirmedFaces = {};
                    this.scanFaceUserEdits = {};
                    [...(this.shotReviewAllEdited || []), ...this.shotReviewCurrentPanels].forEach(p => {
                        this.scanConfirmedFaces[p.expectedFace] = [...p.classifiedColors];
                        this.scanFaceUserEdits[p.expectedFace] = [...(p.userEdits || new Array(9).fill(false))];
                    });
                    STATE_FACE_ORDER.forEach(f => {
                        if (this.scanConfirmedFaces[f]) this.scanConfirmedFaces[f][4] = f;
                    });
                    const fixedState = this._tryDeepAutoFix();
                    if (fixedState) {
                        this.shotReviewAllEdited.push(...this.shotReviewCurrentPanels);
                        this.exitShotReview(false);
                        this.closeScanner();
                        await this._finishScanAndSolve(fixedState, 'two-shot-deep-fix');
                        // 還原（其實 closeScanner 也會清；保險起見）
                        this.scanConfirmedFaces = prevConfirmed;
                        this.scanFaceUserEdits = prevUserEdits;
                        return;
                    }
                    this.scanConfirmedFaces = prevConfirmed;
                    this.scanFaceUserEdits = prevUserEdits;
                }
                // Validation failed — keep review open so user can continue editing
                const NAMES = {U:'黃',R:'橙',F:'藍',D:'白',L:'紅',B:'綠'};
                const errMsg = v.errors.map(e => {
                    const m = e.match(/^([URFDLB]) 貼紙數為 (\d+)/);
                    if (m) return `${NAMES[m[1]]||m[1]}色有${m[2]}個（需9）`;
                    if (e.includes('中心格')) return '有顏色面重複';
                    if (e.includes('cubejs')) return '奇偶校驗錯誤（自動修復試過了仍無解，可能相鄰面交界貼紙弄反）';
                    return e;
                }).join('；');
                const hint = document.getElementById('shot-review-hint');
                if (hint) {
                    hint.classList.add('active');
                    hint.innerHTML = `<span style="color:#fca5a5">⚠ ${errMsg}，請修色後再確認</span>`;
                }
            }

            async _solveScannedOrShowError(state) {
                const v = StateValidator3.validate(state);
                if (v.ok) {
                    this.closeScanner();
                    await this._finishScanAndSolve(state, 'two-shot-fallback');
                } else {
                    const hint = document.getElementById('shot-review-hint');
                    if (hint) {
                        hint.classList.add('active');
                        hint.textContent = '⚠ ' + (v.errors[0] || '狀態有誤，請繼續修色');
                        hint.style.color = '#fca5a5';
                    }
                }
            }

            exitShotReview(restoreUI) {
                this.shotReviewActive = false;
                this.shotReviewCurrentPanels = null;
                const canvas = document.getElementById('scanner-overlay');
                if (canvas && this._shotReviewClickHandler) {
                    canvas.removeEventListener('click', this._shotReviewClickHandler);
                    canvas.removeEventListener('touchend', this._shotReviewClickHandler);
                    this._shotReviewClickHandler = null;
                    canvas.style.cursor = '';
                }
                document.getElementById('shot-review-palette').classList.remove('active');
                document.getElementById('shot-review-hint').classList.remove('active');
                document.getElementById('shot-review-actions').classList.remove('active');
                if (restoreUI) {
                    const scannerPanel = document.getElementById('scanner-panel');
                    scannerPanel.querySelectorAll('.scanner-modes, .panel-actions, #scan-instruction-box, #stability-bar, #scan-face-chips, #scanner-motion-guide').forEach(el => {
                        el.style.display = '';
                    });
                }
            }

            async captureScannerFace() {
                const captureBtn = document.getElementById('scanner-capture-btn');
                if (captureBtn) captureBtn.disabled = true;
                try {
                    // 已確認六面則不再擷取
                    if (Object.keys(this.scanConfirmedFaces).length >= 6) return;
                    this._refineAvgDisps = [];
                    const rawStickers = this.sampleScannerFaceRaw();
                    // 自動辨識：從中心格顏色判斷是哪個顏色面
                    const guessedFace = this.guessUnusedFaceFromCenter(rawStickers[4]);
                    const detectedFace = guessedFace || STATE_FACE_ORDER.find(f => !this.scanConfirmedFaces[f]);
                    if (!detectedFace) return;
                    const panel = {
                        slot: detectedFace, expectedFace: detectedFace, detectedFace, stickers: rawStickers,
                        detectedConfidently: !!guessedFace,
                    };
                    await this.flashCapture();
                    this.showFaceEditReview(panel);
                } catch (error) {
                    document.getElementById('scanner-status').innerText = `擷取失敗：${error.message}`;
                    if (captureBtn) captureBtn.disabled = false;
                }
            }

            showFaceEditReview(panel, restoreState = null, restoreEdits = null) {
                this.pendingFacePanel = panel;
                // FREE-ORDER: slot is the auto-detected face (center sticker color).
                const slot = panel.slot || STATE_FACE_ORDER.find(f => !this.scanConfirmedFaces[f]) || 'U';

                let palette = this.buildProgressivePalette();
                const calibAnchors = this._getCalibAnchors();
                if (calibAnchors) {
                    STATE_FACE_ORDER.forEach(face => {
                        const cur = palette[face];
                        if (!cur || (Array.isArray(cur) && cur.length === 0)) {
                            if (calibAnchors[face]) palette[face] = [calibAnchors[face]];
                        }
                    });
                }
                // Center RGB anchors the slot's color (works for non-standard cubes)
                const centerRgb = panel.stickers[4];
                if (centerRgb) {
                    palette = { ...palette, [slot]: [this.rgbToLab(centerRgb)] };
                }
                if (restoreState && restoreState.length === 9) {
                    // Going back: use the user's previously-confirmed state
                    this.faceEditState = [...restoreState];
                    this.faceEditUserEdits = restoreEdits ? [...restoreEdits] : new Array(9).fill(false);
                } else {
                    this.faceEditState = panel.stickers.map(rgb => this.classifyRgbWithCalibration(rgb, palette) || slot);
                    // Force center label to slot, regardless of classification
                    this.faceEditState[4] = slot;
                    this.faceEditUserEdits = new Array(9).fill(false);
                }
                this.faceEditOriginal = [...this.faceEditState];
                this.faceEditUncertain = panel.stickers.map((rgb, i) => {
                    if (i === 4) return false;
                    const isSpecular = rgb.r >= 248 || rgb.g >= 248 || rgb.b >= 248;
                    const isDeepShadow = Math.max(rgb.r, rgb.g, rgb.b) < 55;
                    return isSpecular || isDeepShadow;
                });
                this.faceEditSelectedColor = slot;

                // Stop the live preview loop — canvas hidden, no need to draw
                if (this.scannerAnimation) { cancelAnimationFrame(this.scannerAnimation); this.scannerAnimation = null; }
                ['scanner-view','stability-bar','scan-instruction-box','live-center-hint',
                 'scan-detected-banner','scan-face-chips','scanner-motion-guide'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
                document.getElementById('scanner-panel')
                    .querySelectorAll('.scanner-modes,.panel-actions').forEach(el => el.style.display = 'none');

                const COLOR_ZH = {U:'黃色',R:'橙色',F:'藍色',D:'白色',L:'紅色',B:'綠色'};
                const confirmedCount = Object.keys(this.scanConfirmedFaces).length;
                const titleEl = document.getElementById('face-edit-title');
                if (titleEl) {
                    titleEl.style.color = '';
                    if (panel.detectedConfidently === false) {
                        // Center was a logo sticker or specular — can't auto-detect face
                        titleEl.textContent = `⚠ 請點上方選擇顏色面（${confirmedCount + 1} / 6）`;
                        titleEl.style.color = '#fbbf24';
                    } else {
                        titleEl.textContent = `偵測為：${COLOR_ZH[slot] || slot}面（${confirmedCount + 1} / 6）`;
                    }
                }

                // Show/hide back button based on capture history
                const backBtn = document.getElementById('face-edit-back-btn');
                if (backBtn) backBtn.style.display = (this.scanCaptureOrder && this.scanCaptureOrder.length > 0) ? '' : 'none';
                const balRow = document.getElementById('face-edit-balance-row');
                if (balRow) balRow.style.display = 'none';

                document.getElementById('face-edit-hint').textContent = '點格子修色；若辨識的顏色面不對，點上方圓點更正';
                document.getElementById('face-edit-hint').style.color = 'rgba(255,255,255,0.5)';
                document.getElementById('face-edit-area').classList.add('active');
                this._renderFaceIdentityRow();
                this._renderFaceEditPalette();
                this._renderFaceEditGrid();
            }

            // 渲染面身份選擇列（六色圓點，點擊可更正自動辨識的顏色面）
            _renderFaceIdentityRow() {
                const el = document.getElementById('face-edit-identity-row');
                if (!el) return;
                const COLOR_ZH = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                const currentFace = this.faceEditState ? this.faceEditState[4] : null;
                el.innerHTML = STATE_FACE_ORDER.map(face => {
                    const isActive = face === currentFace;
                    const isDone = !!this.scanConfirmedFaces[face]; // 已確認的面不可再選
                    const cls = ['face-id-dot', isActive ? 'active' : '', isDone ? 'done' : ''].filter(Boolean).join(' ');
                    const onclick = isDone ? '' : `onclick="game._changeFaceIdentity('${face}')"`;
                    const label = COLOR_ZH[face] || face;
                    return `<div class="${cls}" style="background:${FACE_COLORS[face]}" title="${label}色面${isDone ? '（已確認）' : ''}" ${onclick}>${isActive ? '✓' : ''}</div>`;
                }).join('');
            }

            // 使用者點選身份圓點，手動更正偵測到的顏色面
            _changeFaceIdentity(face) {
                if (!this.faceEditState || !this.pendingFacePanel) return;
                if (this.scanConfirmedFaces[face]) return; // 已確認面不可搶佔
                const COLOR_ZH = { U:'黃色',R:'橙色',F:'藍色',D:'白色',L:'紅色',B:'綠色' };
                this.faceEditState[4] = face;
                this.pendingFacePanel.slot = face;
                this.pendingFacePanel.expectedFace = face;
                this.pendingFacePanel.detectedFace = face;
                this.faceEditSelectedColor = face;
                const confirmedCount = Object.keys(this.scanConfirmedFaces).length;
                const title = document.getElementById('face-edit-title');
                if (title) title.textContent = `偵測為：${COLOR_ZH[face] || face}面（${confirmedCount + 1} / 6）`;
                this._renderFaceIdentityRow();
                this._renderFaceEditPalette();
                this._renderFaceEditGrid();
            }

            _renderFaceEditPalette() {
                const el = document.getElementById('face-edit-palette');
                if (!el) return;
                const NAMES = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                el.innerHTML = STATE_FACE_ORDER.map(face => {
                    const a = face === this.faceEditSelectedColor ? ' active' : '';
                    return `<div class="face-edit-swatch${a}" style="background:${FACE_COLORS[face]}"
                        title="${NAMES[face]}色" onclick="game._selectFaceEditColor('${face}')">${NAMES[face]}</div>`;
                }).join('');
            }

            _selectFaceEditColor(face) {
                this.faceEditSelectedColor = face;
                this._renderFaceEditPalette();
            }

            _renderFaceEditGrid() {
                const el = document.getElementById('face-edit-grid');
                if (!el) return;
                el.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const isCenter = i === 4;
                    const cell = document.createElement('div');
                    let cls = 'face-edit-cell' + (isCenter ? ' center' : '');
                    if (this.faceEditUncertain && this.faceEditUncertain[i]) cls += ' uncertain';
                    if (!isCenter && this.faceEditUserEdits && this.faceEditUserEdits[i]) cls += ' user-edited';
                    cell.className = cls;
                    cell.style.background = FACE_COLORS[this.faceEditState[i]] || '#444';
                    if (!isCenter) {
                        const idx = i;
                        cell.onclick = () => {
                            this.faceEditState[idx] = this.faceEditSelectedColor;
                            if (this.faceEditUncertain) this.faceEditUncertain[idx] = false;
                            if (!this.faceEditUserEdits) this.faceEditUserEdits = new Array(9).fill(false);
                            this.faceEditUserEdits[idx] = true;
                            this._renderFaceEditGrid();
                        };
                    }
                    el.appendChild(cell);
                }
                this._updateFaceEditCounts();
            }

            _reclassifyFaceEditFromCenter(newCenterColor) {
                const panel = this.pendingFacePanel;
                if (!panel || !panel.stickers) return;
                let palette = this.buildProgressivePalette();
                const calibAnchors = this._getCalibAnchors();
                if (calibAnchors) {
                    STATE_FACE_ORDER.forEach(face => {
                        const cur = palette[face];
                        if (!cur || (Array.isArray(cur) && cur.length === 0)) {
                            if (calibAnchors[face]) palette[face] = [calibAnchors[face]];
                        }
                    });
                }
                palette[newCenterColor] = [this.rgbToLab(panel.stickers[4])];
                for (let i = 0; i < 9; i++) {
                    if (i === 4) continue;
                    if (this.faceEditUserEdits && this.faceEditUserEdits[i]) continue;
                    const rgb = panel.stickers[i];
                    const result = this.classifyRgbWithCalibration(rgb, palette);
                    if (result) this.faceEditState[i] = result;
                }
            }

            _updateFaceEditCounts() {
                const hint = document.getElementById('face-edit-hint');
                if (!hint) return;
                // Combined counts: this face + all previously confirmed faces
                const totalCount = {};
                STATE_FACE_ORDER.forEach(f => { totalCount[f] = 0; });
                Object.values(this.scanConfirmedFaces || {}).forEach(arr => {
                    (arr || []).forEach(c => { if (totalCount[c] !== undefined) totalCount[c]++; });
                });
                (this.faceEditState || []).forEach(c => { if (totalCount[c] !== undefined) totalCount[c]++; });
                const NAMES = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                const html = STATE_FACE_ORDER.map(f => {
                    const n = totalCount[f];
                    const tag = n === 9 ? '✓' : n > 9 ? '⚠' : '';
                    const col = n === 9 ? '#86efac' : n > 9 ? '#fca5a5' : 'rgba(255,255,255,0.55)';
                    return `<span style="color:${col}">${NAMES[f]}${n}${tag}</span>`;
                }).join(' ');
                let alignHtml = '';
                if (Array.isArray(this._refineAvgDisps) && this._refineAvgDisps.length) {
                    const avg = this._refineAvgDisps[this._refineAvgDisps.length - 1];
                    if (avg > 4.5) alignHtml = ` <span style="color:#fca5a5">✗ 對位偏差 ${avg.toFixed(1)}px</span>`;
                    else if (avg > 2.0) alignHtml = ` <span style="color:#fbbf24">○ 微調 ${avg.toFixed(1)}px</span>`;
                    else alignHtml = ` <span style="color:#86efac">✓ 對位精準</span>`;
                }
                hint.innerHTML = `<span style="font-size:0.72rem">${html}</span>${alignHtml}`;
                hint.style.color = '';
            }

            retakeFaceEdit() {
                document.getElementById('face-edit-area').classList.remove('active');
                ['scanner-view','stability-bar','scan-instruction-box','live-center-hint',
                 'scan-detected-banner','scan-face-chips','scanner-motion-guide'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = '';
                });
                document.getElementById('scanner-panel')
                    .querySelectorAll('.scanner-modes,.panel-actions').forEach(el => el.style.display = '');
                this.pendingFacePanel = null;
                this.faceEditState = null;
                const captureBtn = document.getElementById('scanner-capture-btn');
                if (captureBtn) captureBtn.disabled = false;
                this.updateScannerStatus();
                const video = document.getElementById('scanner-video');
                if (video) video.play().catch(() => {});
                this.drawScannerOverlayLoop(); // restart live preview
            }

            async confirmFaceEdit() {
                if (!this.faceEditState || !this.pendingFacePanel || this._confirmingFace) return;
                this._confirmingFace = true;
