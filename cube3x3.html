                // FREE-ORDER: slot comes from auto-detected face (set in showFaceEditReview / _changeFaceIdentity)
                const slot = this.pendingFacePanel.slot;
                if (!slot || !STATE_FACE_ORDER.includes(slot)) return;
                // Force center label to confirmed slot
                this.faceEditState[4] = slot;

                // Apply orientation correction AFTER user confirms colors (not at display time).
                // Rotates the entire face array so sticker positions match cube geometry.
                const orientRotIdx = this._detectFaceOrientation(this.faceEditState, slot);
                if (orientRotIdx > 0) {
                    const UNROTATE = RubiksGame._UNROTATE;
                    this.faceEditState = UNROTATE[orientRotIdx].map(i => this.faceEditState[i]);
                    this.faceEditUserEdits = UNROTATE[orientRotIdx].map(i => (this.faceEditUserEdits || [])[i] || false);
                    this.faceEditState[4] = slot;
                }

                // Persist into per-slot history maps so user can navigate back
                this.scanConfirmedFaces[slot] = [...this.faceEditState];
                this.scanFaceUserEdits[slot] = [...(this.faceEditUserEdits || new Array(9).fill(false))];
                if (this.pendingFacePanel) {
                    this._saveCalibEntries(this._collectFromFaceEdit(
                        this.pendingFacePanel.stickers, this.faceEditState, this.faceEditOriginal
                    ));
                    this.scanFacePanels[slot] = this.pendingFacePanel;
                    this.scanRawPanels.push(this.pendingFacePanel);
                    this._palCache = null; // 強制下一面重建 palette
                }
                if (!this.scanCaptureOrder) this.scanCaptureOrder = [];
                this.scanCaptureOrder.push(slot);
                document.getElementById('face-edit-area').classList.remove('active');

                this.scanIndex++;
                this.updateFaceProgressChips();

                if (this.scanIndex >= 6) {
                    const state = STATE_FACE_ORDER.map(f => (this.scanConfirmedFaces[f] || []).join('')).join('');
                    const v = StateValidator3.validate(state);
                    if (v.ok) {
                        this.closeScanner();
                        await this._finishScanAndSolve(state, 'six-face');
                    } else {
                        // 若只有 cubejs 奇偶校驗錯誤（各色數量正確），嘗試深度自動修復
                        // 包含：面旋轉 + 貼紙對調 + 顏色平衡
                        const onlyParity = v.errors.length > 0 &&
                            v.errors.every(e => e.includes('cubejs') || e.includes('忠實解析'));
                        if (onlyParity) {
                            const fixedState = this._tryDeepAutoFix();
                            if (fixedState) {
                                this.closeScanner();
                                await this._finishScanAndSolve(fixedState, 'six-face-deep-fix');
                                return;
                            }
                        }
                        // 驗證失敗：回滾此面的確認，保持最後一面的編輯區，顯示錯誤
                        // 不自動改色 — 讓使用者手動修正，或點「自動平衡」
                        delete this.scanConfirmedFaces[slot];
                        delete this.scanFacePanels[slot];
                        delete this.scanFaceUserEdits[slot];
                        this.scanRawPanels.pop();
                        this._palCache = null;
                        if (this.scanCaptureOrder) this.scanCaptureOrder.pop();
                        this.scanIndex--;
                        this.updateFaceProgressChips();
                        document.getElementById('face-edit-area').classList.add('active');
                        // Show error in title (not hint) so _updateFaceEditCounts() doesn't overwrite it
                        const NAMES_ZH = {U:'黃',R:'橙',F:'藍',D:'白',L:'紅',B:'綠'};
                        const errMsg = v.errors.map(e => {
                            const m = e.match(/^([URFDLB]) 貼紙數為 (\d+)/);
                            if (m) return `${NAMES_ZH[m[1]]||m[1]}色${m[2]}個`;
                            if (e.includes('中心格')) return '顏色面重複';
                            if (e.includes('cubejs')) return '奇偶校驗錯誤';
                            return e;
                        }).join('、');
                        const titleEl = document.getElementById('face-edit-title');
                        if (titleEl) { titleEl.textContent = `⚠ 修色後確認（${errMsg}）`; titleEl.style.color = '#fca5a5'; }
                        const balRow = document.getElementById('face-edit-balance-row');
                        if (balRow) balRow.style.display = 'flex';
                        this._renderFaceEditGrid(); // shows per-color counts in hint
                        this._confirmingFace = false; // allow re-confirm after user fixes errors
                    }
                } else {
                    // Clear capture lock so auto-capture can trigger for the next face
                    this.pendingFacePanel = null;
                    this.scannerStableFrames = 0;
                    this.scannerStabilityScore = 0;
                    this.scannerIsCapturing = false;
                    ['scanner-view','stability-bar','scan-instruction-box','live-center-hint',
                     'scan-detected-banner','scan-face-chips','scanner-motion-guide'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.style.display = '';
                    });
                    document.getElementById('scanner-panel')
                        .querySelectorAll('.scanner-modes,.panel-actions').forEach(el => el.style.display = '');
                    const captureBtn = document.getElementById('scanner-capture-btn');
                    if (captureBtn) captureBtn.disabled = false;
                    this.updateScannerStatus();
                    const video = document.getElementById('scanner-video');
                    if (video) video.play().catch(() => {});
                    this.drawScannerOverlayLoop();
                }
                this._confirmingFace = false;
            }

            // Go back to the previously-confirmed face in six-face mode.
            // Restores its original capture data + user edits so user can re-correct.
            goBackOneFace() {
                if (this.scanIndex === 0 || !this.scanCaptureOrder || this.scanCaptureOrder.length === 0) return;
                this.scanIndex--;
                const slot = this.scanCaptureOrder.pop();
                const panel = this.scanFacePanels[slot];
                const prevState = this.scanConfirmedFaces[slot];
                const prevEdits = this.scanFaceUserEdits[slot];
                // Detach from confirmed maps so re-confirm can re-store
                delete this.scanConfirmedFaces[slot];
                delete this.scanFacePanels[slot];
                delete this.scanFaceUserEdits[slot];
                // Pop from scanRawPanels (most recent corresponds to scanIndex+1)
                const idx = this.scanRawPanels.findIndex(p => p === panel);
                if (idx >= 0) this.scanRawPanels.splice(idx, 1);
                this.updateFaceProgressChips();
                // Re-show edit view with preserved state
                if (panel) {
                    this.showFaceEditReview(panel, prevState, prevEdits);
                }
            }

            // 六面掃描完成後若奇偶校驗失敗，暴力搜尋 4^6=4096 種面旋轉組合，
            // 找到通過 cubejs 驗證的版本後直接套用（不需使用者手動翻轉）。
            _tryAutoOrientFaces() {
                if (!window.Cube) return null;
                const ROT = [
                    [0,1,2,3,4,5,6,7,8],  // 0°
                    [6,3,0,7,4,1,8,5,2],  // 90° CW
                    [8,7,6,5,4,3,2,1,0],  // 180°
                    [2,5,8,1,4,7,0,3,6],  // 270° CW
                ];
                const faces = STATE_FACE_ORDER;
                for (let mask = 1; mask < 4096; mask++) {
                    let state = '';
                    let valid = true;
                    for (let fi = 0; fi < 6; fi++) {
                        const orig = this.scanConfirmedFaces[faces[fi]];
                        if (!orig || orig.length !== 9) { valid = false; break; }
                        const r = (mask >> (fi * 2)) & 3;
                        state += (r === 0 ? orig : ROT[r].map(i => orig[i])).join('');
                    }
                    if (!valid) return null;
                    try {
                        const cube = Cube.fromString(state);
                        if (cube.asString() === state) {
                            // 套用旋轉回 scanConfirmedFaces
                            for (let fi = 0; fi < 6; fi++) {
                                const r = (mask >> (fi * 2)) & 3;
                                if (r !== 0) {
                                    const f = faces[fi];
                                    this.scanConfirmedFaces[f] = ROT[r].map(i => this.scanConfirmedFaces[f][i]);
                                }
                            }
                            return state;
                        }
                    } catch (e) { /* 無效組合，繼續 */ }
                }
                return null;
            }

            // 整體方塊朝向搜尋：嘗試 48 種立方體朝向重新分配 + 每個再嘗試 4096 種面內旋轉
            // 適用情境：使用者拿方塊的方向不是標準 URFDLB（例如把橙色朝上而不是黃色朝上）
            //   結果是六個中心顏色都對但 cubejs 認為角塊組合不合法
            //   需要把整顆方塊「旋轉」到標準朝向才能通過驗證
            _tryCubeOrientations() {
                if (!window.Cube) return null;
                const FACES = ['U', 'R', 'F', 'D', 'L', 'B'];
                const opposites = {U:'D', R:'L', F:'B', D:'U', L:'R', B:'F'};

                // 生成 48 種「面標籤指派」（其中 24 種為合法立方體旋轉，另 24 種為鏡射；
                // 鏡射版會被 cubejs 自動拒絕，不影響正確性，只是多花一點時間）
                const orientations = [];
                for (const newU of FACES) {
                    const newD = opposites[newU];
                    const sides = FACES.filter(f => f !== newU && f !== newD);
                    for (const newF of sides) {
                        const newB = opposites[newF];
                        const rest = sides.filter(f => f !== newF && f !== newB);
                        for (const newR of rest) {
                            const newL = opposites[newR];
                            orientations.push({ U: newU, R: newR, F: newF, D: newD, L: newL, B: newB });
                        }
                    }
                }

                const savedFaces = {};
                FACES.forEach(f => savedFaces[f] = [...(this.scanConfirmedFaces[f] || [])]);

                // 記錄原始材質色（整體朝向調整後需同步更新材質顏色）
                const origMatColors = {};
                FACES.forEach(f => {
                    origMatColors[f] = this.materials[FACE_TO_MATERIAL_INDEX[f]].color.getHex();
                });

                // 跳過第一個（identity）— 如果 identity 能通過，前面 _tryAutoOrientFaces 已經試過了
                for (let oi = 0; oi < orientations.length; oi++) {
                    const orient = orientations[oi];
                    const isIdentity = FACES.every(f => orient[f] === f);
                    if (isIdentity) continue;

                    // 反查表：原本標籤 X 在新朝向下變成什麼
                    const inverseOrient = {};
                    FACES.forEach(f => { inverseOrient[orient[f]] = f; });

                    // 重組 scanConfirmedFaces：位置 f 現在裝的是原本位置 orient[f] 的資料
                    // 同時把 sticker 字母也重新標籤
                    const newFaces = {};
                    FACES.forEach(f => {
                        const original = savedFaces[orient[f]];
                        if (!original || original.length !== 9) {
                            newFaces[f] = null;
                            return;
                        }
                        newFaces[f] = original.map(letter => inverseOrient[letter] || letter);
                    });
                    if (FACES.some(f => !newFaces[f])) continue;

                    // 暫時套用此朝向，跑 4096 面內旋轉
                    this.scanConfirmedFaces = newFaces;
                    const fixed = this._tryAutoOrientFaces();
                    if (fixed) {
                        // 同步更新材質顏色：orient[newFace] = 原本哪個 slot 的資料移到 newFace
                        // 使 setState() 後 3D 模型顯示正確的實體顏色
                        FACES.forEach(newFace => {
                            const oldFace = orient[newFace];
                            this.materials[FACE_TO_MATERIAL_INDEX[newFace]].color.setHex(origMatColors[oldFace]);
                        });
                        return fixed;
                    }
                }

                // 全部失敗 — 還原
                this.scanConfirmedFaces = savedFaces;
                return null;
            }

            // 對調搜尋：嘗試所有「未鎖定貼紙」的兩兩交換，看是否能通過 cubejs 驗證
            // 適用於：使用者手動修色後造成兩個位置標記反了的情境
            //   例：F[0] 應為 L 結果填了 F；L[2] 應為 F 結果填了 L
            //   greedy 平衡無法處理，但對調搜尋可以
            _trySwapPairs() {
                if (!window.Cube) return null;
                const labels = STATE_FACE_ORDER.flatMap(f => this.scanConfirmedFaces[f] || Array(9).fill(f));
                if (labels.length !== 54) return null;
                const userEdited = new Array(54).fill(false);
                STATE_FACE_ORDER.forEach((f, fi) => {
                    const edits = (this.scanFaceUserEdits || {})[f] || [];
                    for (let i = 0; i < 9; i++) if (edits[i]) userEdited[fi * 9 + i] = true;
                });
                const CENTERS = new Set([4, 13, 22, 31, 40, 49]);
                const isLocked = pos => CENTERS.has(pos) || userEdited[pos];

                for (let i = 0; i < 54; i++) {
                    if (isLocked(i)) continue;
                    for (let j = i + 1; j < 54; j++) {
                        if (isLocked(j)) continue;
                        if (labels[i] === labels[j]) continue;
                        // 嘗試 swap
                        [labels[i], labels[j]] = [labels[j], labels[i]];
                        const candidate = labels.join('');
                        try {
                            const cube = Cube.fromString(candidate);
                            if (cube.asString() === candidate) {
                                STATE_FACE_ORDER.forEach((f, fi) => {
                                    this.scanConfirmedFaces[f] = labels.slice(fi * 9, fi * 9 + 9);
                                });
                                return candidate;
                            }
                        } catch (e) { /* 不合法，繼續 */ }
                        // 還原
                        [labels[i], labels[j]] = [labels[j], labels[i]];
                    }
                }
                return null;
            }

            // 深度自動修復：依序嘗試所有可程式化的修復策略
            // 1. 面方向旋轉（4096 種）— 處理單面旋轉錯誤
            // 2. 兩兩貼紙對調（~1400 對）— 處理使用者修色時手抖弄反兩格
            // 3. greedy 顏色數量平衡 — 處理多格輕微辨識錯誤
            // 4. 整體方塊朝向重新分配（48 × 4096）— 處理使用者持方塊方向非 URFDLB 標準
            // 找到就回傳，全部失敗才回 null
            _tryDeepAutoFix() {
                console.log('[FIX] 開始深度自動修復...');
                const t0 = performance.now();

                let fixed = this._tryAutoOrientFaces();
                if (fixed) {
                    console.log(`[FIX] ✓ 面旋轉成功 (${(performance.now() - t0).toFixed(0)}ms)`);
                    return fixed;
                }

                fixed = this._trySwapPairs();
                if (fixed) {
                    console.log(`[FIX] ✓ 貼紙對調成功 (${(performance.now() - t0).toFixed(0)}ms)`);
                    return fixed;
                }

                fixed = this._tryAutoBalance();
                if (fixed) {
                    console.log(`[FIX] ✓ 顏色平衡成功 (${(performance.now() - t0).toFixed(0)}ms)`);
                    return fixed;
                }

                // 最後手段：整體方塊朝向重分配（最慢，~3-6 秒）
                console.log('[FIX] 嘗試 48 種方塊朝向重分配...');
                fixed = this._tryCubeOrientations();
                if (fixed) {
                    console.log(`[FIX] ✓ 方塊朝向重分配成功 (${(performance.now() - t0).toFixed(0)}ms)`);
                    return fixed;
                }

                console.log(`[FIX] ✗ 全部策略失敗 (${(performance.now() - t0).toFixed(0)}ms)`);
                return null;
            }

            _tryAutoBalance() {
                // Greedy global color-count balancer.
                // CRITICAL: respects user-edited stickers (scanFaceUserEdits[face][i]).
                // User edits are INVIOLATE — never overwritten by auto-balance,
                // even if doing so would produce a valid state.
                const palette = this.buildProgressivePalette();
                const labels = [];        // 54 face-label chars
                const rawRgbs = [];       // 54 {r,g,b} objects
                const userEdited = [];    // 54 booleans — true means LOCKED
                const CENTERS = new Set([4, 13, 22, 31, 40, 49]);

                STATE_FACE_ORDER.forEach(face => {
                    const confirmed = this.scanConfirmedFaces[face] || [];
                    const edits = (this.scanFaceUserEdits && this.scanFaceUserEdits[face]) || [];
                    const panel = this.scanFacePanels && this.scanFacePanels[face]
                        || this.scanRawPanels.find(p => p.detectedFace === face || p.expectedFace === face);
                    for (let i = 0; i < 9; i++) {
                        labels.push(confirmed[i] || face);
                        rawRgbs.push(panel ? panel.stickers[i] : null);
                        userEdited.push(!!edits[i]);
                    }
                });

                const distToFace = (lab, face) => {
                    const refs = Array.isArray(palette[face]) ? palette[face] : [palette[face]];
                    return Math.min(...refs.map(r => this._labDist(lab, r, refs.length > 1)));
                };

                const isLocked = pos => CENTERS.has(pos) || userEdited[pos];

                for (let iter = 0; iter < 30; iter++) {
                    const counts = {};
                    STATE_FACE_ORDER.forEach(f => { counts[f] = 0; });
                    labels.forEach(f => { if (counts[f] !== undefined) counts[f]++; });

                    const over  = STATE_FACE_ORDER.filter(f => counts[f] > 9);
                    const under = STATE_FACE_ORDER.filter(f => counts[f] < 9);
                    if (over.length === 0) break;

                    let best = null, bestGain = -Infinity;
                    over.forEach(overFace => {
                        under.forEach(underFace => {
                            labels.forEach((label, pos) => {
                                if (label !== overFace || isLocked(pos) || !rawRgbs[pos]) return;
                                const lab = this.rgbToLab(rawRgbs[pos]);
                                const gain = distToFace(lab, overFace) - distToFace(lab, underFace);
                                if (gain > bestGain) { best = { pos, to: underFace }; bestGain = gain; }
                            });
                        });
                    });

                    if (best) {
                        labels[best.pos] = best.to;
                    } else {
                        // No legal swap — give up (don't force-swap user-edited stickers)
                        return null;
                    }
                }

                const newState = labels.join('');
                return StateValidator3.validate(newState).ok ? newState : null;
            }

            async flashCapture() {
                const flash = document.getElementById('scanner-flash');
                if (!flash) return;
                flash.classList.add('active');
                await new Promise(r => setTimeout(r, 100));
                flash.classList.remove('active');
            }

            // ── Calibration Learning ─────────────────────────────────────────────────
            _calibKey() { return 'rubiks_calib_v2'; }

            _getCalibAnchors() {
                // Merge in-session calib + localStorage, compute weighted Lab centroid per face.
                // User corrections get w=2.0, auto-confirmed get w=0.8.
                // Entries decay to half-weight every 14 days (same lighting rarely lasts longer).
                let all = [...(this.sessionCalib || [])];
                try {
                    const stored = JSON.parse(localStorage.getItem(this._calibKey()) || '[]');
                    if (Array.isArray(stored)) all = all.concat(stored);
                } catch {}
                if (all.length < 6) return null;
                const now = Date.now();
                const anchors = {};
                STATE_FACE_ORDER.forEach(face => {
                    const entries = all.filter(e => e.f === face);
                    if (entries.length === 0) return;
                    let totalW = 0, sl = 0, sa = 0, sb = 0;
                    entries.forEach(e => {
                        const ageDays = (now - (e.ts || now)) / 86400000;
                        const w = (e.w || 1.0) * Math.pow(0.5, ageDays / 14);
                        sl += e.l * w; sa += e.a * w; sb += e.b * w; totalW += w;
                    });
                    if (totalW > 0) anchors[face] = { l: sl / totalW, a: sa / totalW, b: sb / totalW };
                });
                return Object.keys(anchors).length >= 3 ? anchors : null;
            }

            _saveCalibEntries(entries) {
                if (!entries || entries.length === 0) return;
                this.sessionCalib = (this.sessionCalib || []).concat(entries);
                const key = this._calibKey();
                let stored = [];
                try { stored = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
                if (!Array.isArray(stored)) stored = [];
                stored = stored.concat(entries).slice(-400);
                try { localStorage.setItem(key, JSON.stringify(stored)); } catch {
                    // Quota exceeded: keep only newest entries
                    try { localStorage.setItem(key, JSON.stringify(entries.slice(-100))); } catch {}
                }
            }

            _collectFromShotPanels(panels) {
                const now = Date.now();
                const entries = [];
                (panels || []).forEach(panel => {
                    (panel.originalRgbs || []).forEach((rgb, i) => {
                        const face = panel.classifiedColors[i];
                        if (!face) return;
                        const lab = this.rgbToLab(rgb);
                        const wasEdited = panel.originalFaces && panel.originalFaces[i] !== face;
                        entries.push({ l: lab.l, a: lab.a, b: lab.b, f: face, ts: now, w: wasEdited ? 2.0 : 0.8 });
                    });
                });
                return entries;
            }

            _collectFromFaceEdit(rgbs, finalFaces, originalFaces) {
                const now = Date.now();
                const entries = [];
                (rgbs || []).forEach((rgb, i) => {
                    const face = finalFaces[i];
                    if (!face) return;
                    const lab = this.rgbToLab(rgb);
                    const wasEdited = originalFaces && originalFaces[i] !== face;
                    entries.push({ l: lab.l, a: lab.a, b: lab.b, f: face, ts: now, w: wasEdited ? 2.0 : 0.8 });
                });
                return entries;
            }

            clearCalibrationData() {
                this.sessionCalib = [];
                try { localStorage.removeItem(this._calibKey()); } catch {}
                const btn = document.getElementById('clear-calib-btn');
                if (btn) { btn.textContent = '✓ 已清除'; setTimeout(() => { btn.textContent = '清除校正記憶'; }, 1800); }
            }
            // ─────────────────────────────────────────────────────────────────────────

            _kMeans6Best(labValues, runs = 3) {
                // K-means++ uses random seeding — single run can land in a local optimum
                // that merges two real colors or splits one. Run 3 times, pick the result
                // with lowest total intra-cluster Lab distance (best clustering).
                let best = null, bestCost = Infinity;
                for (let i = 0; i < runs; i++) {
                    const r = this._kMeans6(labValues);
                    if (!r) continue;
                    let cost = 0;
                    for (let j = 0; j < labValues.length; j++) {
                        cost += this._labDist(labValues[j], r.centroids[r.assignments[j]], false);
                    }
                    if (cost < bestCost) { bestCost = cost; best = r; }
                }
                return best;
            }

            _kMeans6(labValues) {
                const k = 6, n = labValues.length;
                if (n < k) return null;
                // k-means++ initialisation
                const centroids = [{ ...labValues[0] }];
                while (centroids.length < k) {
                    const dists = labValues.map(v =>
                        Math.min(...centroids.map(c => this._labDist(v, c, false)))
                    );
                    const total = dists.reduce((s, d) => s + d, 0);
                    if (total === 0) { centroids.push({ ...labValues[centroids.length] }); continue; }
                    let r = Math.random() * total, picked = n - 1;
                    for (let i = 0; i < n; i++) { r -= dists[i]; if (r <= 0) { picked = i; break; } }
                    centroids.push({ ...labValues[picked] });
                }
                const assignments = new Array(n).fill(0);
                for (let iter = 0; iter < 30; iter++) {
                    let changed = false;
                    for (let i = 0; i < n; i++) {
                        let best = 0, bestD = Infinity;
                        for (let j = 0; j < k; j++) {
                            const d = this._labDist(labValues[i], centroids[j], false);
                            if (d < bestD) { best = j; bestD = d; }
                        }
                        if (assignments[i] !== best) { assignments[i] = best; changed = true; }
                    }
                    if (!changed) break;
                    for (let j = 0; j < k; j++) {
                        const pts = labValues.filter((_, i) => assignments[i] === j);
                        if (pts.length > 0) {
                            centroids[j] = {
                                l: pts.reduce((s, p) => s + p.l, 0) / pts.length,
                                a: pts.reduce((s, p) => s + p.a, 0) / pts.length,
                                b: pts.reduce((s, p) => s + p.b, 0) / pts.length,
                            };
                        }
                    }
                }
                return { assignments, centroids };
            }

            _kMeans6Guided(labValues, initCentroids) {
                const k = 6, n = labValues.length;
                if (n < k || initCentroids.length !== k) return null;
                const centroids = initCentroids.map(c => ({ ...c }));
                const assignments = new Array(n).fill(0);
                for (let iter = 0; iter < 30; iter++) {
                    let changed = false;
                    for (let i = 0; i < n; i++) {
                        let best = 0, bestD = Infinity;
                        for (let j = 0; j < k; j++) {
                            const d = this._labDist(labValues[i], centroids[j], false);
                            if (d < bestD) { best = j; bestD = d; }
                        }
                        if (assignments[i] !== best) { assignments[i] = best; changed = true; }
                    }
                    if (!changed) break;
                    for (let j = 0; j < k; j++) {
                        const pts = labValues.filter((_, i) => assignments[i] === j);
                        if (pts.length > 0) {
                            centroids[j] = {
                                l: pts.reduce((s, p) => s + p.l, 0) / pts.length,
                                a: pts.reduce((s, p) => s + p.a, 0) / pts.length,
                                b: pts.reduce((s, p) => s + p.b, 0) / pts.length,
                            };
                        }
                    }
                }
                return { assignments, centroids };
            }

            _buildKMeansPalette(rawPanels) {
                const allLab = [];
                for (const panel of rawPanels) {
                    if (!panel.stickers || panel.stickers.length !== 9) continue;
                    for (let i = 0; i < 9; i++) {
                        const rgb = panel.stickers[i];
                        if (!rgb) continue;
                        allLab.push(this.rgbToLab(rgb));
                    }
                }
                if (allLab.length < 18) return null;
                const initCentroids = STATE_FACE_ORDER.map(f => this.rgbToLab(RubiksGame._CANONICAL_RGB[f]));
                const result = this._kMeans6Guided(allLab, initCentroids);
                if (!result) return null;
                const faceLabels = this._matchClusters6(result.centroids, {}, this._getCalibAnchors());
                const palette = {};
                STATE_FACE_ORDER.forEach(face => {
                    const ci = faceLabels.indexOf(face);
                    if (ci >= 0) palette[face] = [result.centroids[ci]];
                });
                return Object.keys(palette).length === 6 ? palette : null;
            }

            _matchClusters6(centroids, anchorLabs, calibAnchors) {
                // Priority: current shot center → session/stored calib → canonical fallback
                const CANONICAL_RGB = RubiksGame._CANONICAL_RGB;
                const refs = {};
                STATE_FACE_ORDER.forEach(face => {
                    refs[face] = anchorLabs[face]
                              || (calibAnchors && calibAnchors[face])
                              || this.rgbToLab(CANONICAL_RGB[face]);
                });
                // Greedy assignment: sort all (cluster, face) pairs by cost
                const pairs = [];
                for (let ci = 0; ci < 6; ci++) {
                    STATE_FACE_ORDER.forEach(face => {
                        pairs.push({ ci, face, cost: this._labDist(centroids[ci], refs[face], false) });
                    });
                }
                pairs.sort((a, b) => a.cost - b.cost);
                const usedC = new Set(), usedF = new Set(), result = new Array(6);
                for (const { ci, face } of pairs) {
                    if (!usedC.has(ci) && !usedF.has(face)) {
                        result[ci] = face; usedC.add(ci); usedF.add(face);
                    }
                    if (usedC.size === 6) break;
                }
                return result;
            }

            buildProgressivePalette() {
                // Cache keyed on scanRawPanels.length — palette only changes when a face is captured.
                const cacheKey = this.scanRawPanels.length;
                if (this._palCache && this._palCacheKey === cacheKey) return this._palCache;

                const MULTI_REFS = {
                    U: [ // Yellow — camera shifts this toward lime/chartreuse under warm LED
                        { r: 200, g: 218, b: 15 },  // lime-shifted (most common under warm LED)
                        { r: 215, g: 205, b: 22 },  // standard yellow
                        { r: 235, g: 220, b: 25 },  // bright/overexposed yellow
                    ],
                    R: [ // Orange — warm orange-red, clearly distinct from red
                        { r: 228, g: 88,  b: 18 },  // standard orange
                        { r: 210, g: 72,  b: 10 },  // darker/shadow orange
                        { r: 245, g: 105, b: 25 },  // bright/glossy orange
                    ],
                    F: [ // Blue — cobalt blue, NOT pure #0000ff; lighter and more cyan-tinted
                        { r: 25,  g: 65,  b: 192 }, // cobalt blue (primary)
                        { r: 42,  g: 88,  b: 212 }, // lighter / glossy highlight
                        { r: 15,  g: 48,  b: 165 }, // darker / shadow
                        { r: 35,  g: 78,  b: 200 }, // medium cobalt
                    ],
                    D: [ // White — varies a lot: warm, cool, mint-tinted, overexposed
                        { r: 208, g: 215, b: 205 }, // neutral warm white
                        { r: 195, g: 205, b: 210 }, // cool white / mint
                        { r: 235, g: 238, b: 232 }, // bright / near-overexposed
                        { r: 218, g: 220, b: 215 }, // slightly warm bright
                    ],
                    L: [ // Red — saturated, darker than orange
                        { r: 198, g: 28,  b: 20 },  // standard red
                        { r: 225, g: 42,  b: 32 },  // brighter red
                        { r: 175, g: 22,  b: 18 },  // dark / shadow red
                    ],
                    B: [ // Green — vivid saturated green
                        { r: 18,  g: 162, b: 40 },  // standard vivid green
                        { r: 15,  g: 132, b: 32 },  // darker / shadow green
                        { r: 22,  g: 185, b: 48 },  // bright / glossy green
                    ],
                };
                // Method 2: per-image k-means when ≥2 panels captured
                // Single centroid per face → treated as calibrated (L not downweighted)
                let palette = this.scanRawPanels.length >= 2
                    ? (this._buildKMeansPalette(this.scanRawPanels) || {})
                    : {};

                // Fallback for faces not covered by k-means: center pixel + MULTI_REFS
                if (Object.keys(palette).length < 6) {
                    STATE_FACE_ORDER.forEach(face => {
                        if (palette[face]) return;
                        let panel = this.scanRawPanels.find(p => p.detectedFace === face);
                        if (!panel) panel = this.scanRawPanels.find(p => p.expectedFace === face);
                        if (panel && panel.stickers && panel.stickers[4]
                                && !this._looksLikeLogoOrSpecular(panel.stickers[4])) {
                            const panLab = this.rgbToLab(panel.stickers[4]);
                            palette[face] = [panLab, ...MULTI_REFS[face].map(rgb => this.rgbToLab(rgb))];
                        } else {
                            palette[face] = MULTI_REFS[face].map(rgb => this.rgbToLab(rgb));
                        }
                    });
                }
                // 納入使用者手動校正的 Lab 資料（weight >= 1.5 = 使用者明確改過的格子）
                // 前置到 palette 最前端，讓分類器優先參考這些「已知正確」的顏色
                const userEdited = (this.sessionCalib || []).filter(e => e.w >= 1.5);
                if (userEdited.length > 0) {
                    const byFace = {};
                    userEdited.forEach(e => {
                        if (!byFace[e.f]) byFace[e.f] = [];
                        byFace[e.f].push({ l: e.l, a: e.a, b: e.b });
                    });
                    STATE_FACE_ORDER.forEach(face => {
                        if (byFace[face] && byFace[face].length > 0) {
                            palette[face] = [...byFace[face], ...palette[face]];
                        }
                    });
                }

                this._palCache = palette;
                this._palCacheKey = cacheKey;
                return palette;
            }

            setAutoCapture(enabled) {
                this.scannerAutoCapture = !!enabled;
                this.scannerStableFrames = 0;
                this.scannerStabilityScore = 0;
            }

            // ── 方向自動偵測與旋轉 ──────────────────────────────────────────────
            // UNROTATE[r] maps: corrected_sticker_pos = captured_sticker_pos
            // r=0: no change; r=1: user held 90°CW → CCW correction;
            // r=2: 180°; r=3: user held 90°CCW → CW correction
            static get _UNROTATE() {
                return [
                    [0,1,2,3,4,5,6,7,8],
                    [2,5,8,1,4,7,0,3,6],
                    [8,7,6,5,4,3,2,1,0],
                    [6,3,0,7,4,1,8,5,2],
                ];
            }
            static get _CUBE_CORNERS() {
                return [
                    ['U',0,'B',2,'L',0], ['U',2,'B',0,'R',2],
                    ['U',6,'F',0,'L',2], ['U',8,'F',2,'R',0],
                    ['D',0,'F',6,'L',8], ['D',2,'F',8,'R',6],
                    ['D',6,'B',8,'L',6], ['D',8,'B',6,'R',8],
                ];
            }
            static get _CUBE_EDGES() {
                return [
                    ['U',1,'B',1], ['U',3,'L',1], ['U',5,'R',1], ['U',7,'F',1],
                    ['F',3,'L',5], ['F',5,'R',3], ['F',7,'D',1],
                    ['B',3,'R',5], ['B',5,'L',3], ['B',7,'D',7],
                    ['D',3,'L',7], ['D',5,'R',7],
                ];
            }
            static get _VALID_CORNER_SETS() {
                return [
                    ['U','B','L'],['U','B','R'],['U','F','L'],['U','F','R'],
                    ['D','F','L'],['D','F','R'],['D','B','L'],['D','B','R'],
                ];
            }
            // Single authoritative canonical RGB per face — used by both _matchClusters6 and _getCanonicalLab.
            static get _CANONICAL_RGB() {
                return {
                    U: { r: 215, g: 205, b: 22 }, R: { r: 228, g: 88,  b: 18 },
                    F: { r: 25,  g: 65,  b: 192 }, D: { r: 215, g: 215, b: 210 },
                    L: { r: 200, g: 28,  b: 20  }, B: { r: 18,  g: 162, b: 40  },
                };
            }

            // Returns the best rotation index (0-3) to correct face sticker orientation.
            // Uses corner/edge compatibility with already-confirmed adjacent faces.
            // Returns 0 (no rotation) when no adjacent faces are available to score against.
            _detectFaceOrientation(stickers9, slot) {
                const UNROTATE = RubiksGame._UNROTATE;
                const CORNERS = RubiksGame._CUBE_CORNERS;
                const EDGES = RubiksGame._CUBE_EDGES;
                const VALID_CS = RubiksGame._VALID_CORNER_SETS;
                const OPP = {U:'D',D:'U',R:'L',L:'R',F:'B',B:'F'};
                const confirmed = this.scanConfirmedFaces || {};

                const scores = [0,0,0,0];
                let hasData = false;

                for (let r = 0; r < 4; r++) {
                    const rot = UNROTATE[r].map(i => stickers9[i]);
                    let score = 0;
                    const getColor = (f,p) => f === slot ? rot[p] : (confirmed[f] && confirmed[f][p]);

                    for (const [f1,p1,f2,p2,f3,p3] of CORNERS) {
                        if (f1!==slot && f2!==slot && f3!==slot) continue;
                        const c1=getColor(f1,p1), c2=getColor(f2,p2), c3=getColor(f3,p3);
                        const known = [c1,c2,c3].filter(Boolean);
                        if (known.length < 2) continue;
                        hasData = true;
                        const valid = VALID_CS.some(([a,b,c]) => known.every(col => [a,b,c].includes(col)));
                        score += valid ? 2 : -2;
                    }
                    for (const [f1,p1,f2,p2] of EDGES) {
                        if (f1!==slot && f2!==slot) continue;
                        const c1=getColor(f1,p1), c2=getColor(f2,p2);
                        if (!c1||!c2) continue;
                        hasData = true;
                        score += (c1!==c2 && OPP[c1]!==c2) ? 1 : -1;
                    }
                    scores[r] = score;
                }

                if (!hasData) return 0;
                const maxS = Math.max(...scores);
                if (maxS <= 0) return 0;
                return scores.indexOf(maxS);
            }

            // Returns the best single rotation (0-3) to apply to ALL panels of a two-shot.
            _detectTwoShotRotation(classifiedPanels) {
                const UNROTATE = RubiksGame._UNROTATE;
                const CORNERS = RubiksGame._CUBE_CORNERS;
                const EDGES = RubiksGame._CUBE_EDGES;
                const VALID_CS = RubiksGame._VALID_CORNER_SETS;
                const OPP = {U:'D',D:'U',R:'L',L:'R',F:'B',B:'F'};

                // Build a face→colors lookup from classified panels (keyed by face letter, not position slot)
                const panelMap = {};
                (classifiedPanels || []).forEach(p => {
                    const faceKey = p.expectedFace || p.key;
                    if (faceKey) panelMap[faceKey] = p.classifiedColors;
                });
                if (Object.keys(panelMap).length === 0) return 0;

                const scores = [0,0,0,0];
                let hasData = false;

                for (let r = 0; r < 4; r++) {
                    const getColor = (f,p) => {
                        const arr = panelMap[f]; if (!arr) return null;
                        return arr[UNROTATE[r][p]];
                    };
                    let score = 0;
                    for (const [f1,p1,f2,p2,f3,p3] of CORNERS) {
                        const c1=getColor(f1,p1), c2=getColor(f2,p2), c3=getColor(f3,p3);
                        const known=[c1,c2,c3].filter(Boolean);
                        if (known.length < 2) continue;
                        hasData = true;
                        const valid = VALID_CS.some(([a,b,c]) => known.every(col => [a,b,c].includes(col)));
                        score += valid ? 2 : -2;
                    }
                    for (const [f1,p1,f2,p2] of EDGES) {
                        const c1=getColor(f1,p1), c2=getColor(f2,p2);
                        if (!c1||!c2) continue;
                        // Only score edges where BOTH panels are captured
                        if (!panelMap[f1]||!panelMap[f2]) continue;
                        hasData = true;
                        score += (c1!==c2 && OPP[c1]!==c2) ? 1 : -1;
                    }
                    scores[r] = score;
                }

                if (!hasData) return 0;
                const maxS = Math.max(...scores);
                if (maxS <= 0) return 0;
                return scores.indexOf(maxS);
            }

            // Apply a rotation correction to all panels in shotReviewCurrentPanels.
            _applyTwoShotRotation(rotIdx) {
                const map = RubiksGame._UNROTATE[rotIdx];
                const remap = arr => arr ? map.map(i => arr[i]) : null;
                (this.shotReviewCurrentPanels || []).forEach(panel => {
                    panel.classifiedColors = remap(panel.classifiedColors);
                    if (panel.originalFaces) panel.originalFaces = remap(panel.originalFaces);
                    if (panel.confidence)    panel.confidence    = remap(panel.confidence);
                    if (panel.userEdits)     panel.userEdits     = remap(panel.userEdits);
                    // Re-lock center to face label (expectedFace, not slot position key)
                    panel.classifiedColors[4] = panel.expectedFace || panel.key;
                });
            }

            // Manual rotate: 90° CW each click, for both six-face and two-shot modes.
            rotateFaceEdit() {
                if (!this.faceEditState) return;
                const CW = [6,3,0,7,4,1,8,5,2]; // 90° CW mapping
                const rotArr = arr => arr ? CW.map(i => arr[i]) : null;
                this.faceEditState        = rotArr(this.faceEditState);
                this.faceEditUserEdits    = rotArr(this.faceEditUserEdits);
                this.faceEditUncertain    = rotArr(this.faceEditUncertain);
                // Center (pos 4) stays slot — CW[4]=4 so it's already preserved
                this._renderFaceEditGrid();
                this._updateFaceEditCounts();
            }

            // Manual rotate for two-shot review — cycles all panels together 90° CW.
            rotateShotReview() {
                if (!this.shotReviewCurrentPanels) return;
                const CW = [6,3,0,7,4,1,8,5,2];
                const rotArr = arr => arr ? CW.map(i => arr[i]) : null;
                this.shotReviewCurrentPanels.forEach(panel => {
                    panel.classifiedColors = rotArr(panel.classifiedColors);
                    if (panel.originalFaces) panel.originalFaces = rotArr(panel.originalFaces);
                    if (panel.confidence)    panel.confidence    = rotArr(panel.confidence);
                    if (panel.userEdits)     panel.userEdits     = rotArr(panel.userEdits);
                    panel.classifiedColors[4] = panel.expectedFace || panel.key;
                });
                this.renderShotReview();
            }

            // User-triggered auto-balance (not called automatically).
            async tryManualBalance() {
                // 深度修復：面旋轉 + 貼紙對調 + 顏色平衡，三招都試
                const fixed = this._tryDeepAutoFix();
                if (fixed) {
                    const v = StateValidator3.validate(fixed);
                    if (v.ok) {
                        const balRow = document.getElementById('face-edit-balance-row');
                        if (balRow) balRow.style.display = 'none';
                        this.closeScanner();
                        await this._finishScanAndSolve(fixed, 'deep-auto-fix');
                        return;
                    }
                }
                const hint = document.getElementById('face-edit-hint');
                if (hint) {
                    hint.innerHTML = '⚠ 自動修復失敗。<b>提示</b>：可能是相鄰兩面交界處的貼紙顏色弄反了，或某個角塊三色搭配不對。<br>建議檢查中心格鄰近的貼紙是否符合實體方塊。';
                    hint.style.color = '#fca5a5';
                }
            }

            // Returns true if the pixel looks like a logo sticker, specular highlight, or white sticker
            // — anything that cannot reliably identify a face color.
            // Threshold: very bright (lightness > 200) AND low saturation (< 0.20 in HSL space).
            _looksLikeLogoOrSpecular(rgb) {
                const { r, g, b } = rgb;
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                const lightness = (max + min) / 2;
                const range = max - min;
                const sat = range === 0 ? 0
                    : range / (lightness > 127.5 ? (510 - max - min) : (max + min));
                return lightness > 200 && sat < 0.20;
            }

            _getCanonicalLab(face) {
                return this.rgbToLab(RubiksGame._CANONICAL_RGB[face] || { r: 128, g: 128, b: 128 });
            }

            guessUnusedFaceFromCenter(rgb) {
                // If center looks like a logo sticker or specular, we can't reliably identify the face.
                if (this._looksLikeLogoOrSpecular(rgb)) return null;
                const usedFaces = new Set(this.scanRawPanels.map(p => p.detectedFace).filter(Boolean));
                const palette = this.buildProgressivePalette();
                const lab = this.rgbToLab(rgb);
                let bestFace = null, bestDist = Infinity;
                STATE_FACE_ORDER.forEach(face => {
                    if (usedFaces.has(face)) return;
                    const refs = Array.isArray(palette[face]) ? palette[face] : [palette[face]];
                    const dist = Math.min(...refs.map(r => this._labDist(lab, r, refs.length > 1)));
                    if (dist < bestDist) { bestDist = dist; bestFace = face; }
                });
                return bestFace;
            }


            // ── 開發用模擬掃描（瀏覽器 console 呼叫） ────────────────────────
            devSimulateScan(mode = 'six-face') {
                // 每個面的典型 RGB（在正常室內光下真實測量值的近似）
                const FACE_RGBS = {
                    U: [210, 195, 25],   // 黃
                    R: [218, 98,  12],   // 橙
                    F: [18,  52, 205],   // 藍
                    D: [215, 215, 210],  // 白
                    L: [192, 22,  22],   // 紅
                    B: [18, 148,  28],   // 綠
                };
                // 模擬真實相機噪音：每個格子加隨機偏移，中心格偏移較小
                // ★ stickers 必須是 {r,g,b} 物件，與 readStickerRgb() 格式一致
                const makeFaceStickers = (face, centerJitter = 4, edgeJitter = 18) => {
                    const [br, bg, bb] = FACE_RGBS[face];
                    return Array.from({length: 9}, (_, i) => {
                        const j = i === 4 ? centerJitter : edgeJitter;
                        const jitter = c => Math.min(255, Math.max(0, c + Math.round((Math.random() * 2 - 1) * j)));
                        return { r: jitter(br), g: jitter(bg), b: jitter(bb) };
                    });
                };

                // 把 captureScannerFrame 替換成合成版本
                this._devOrigCapture = this.captureScannerFrame;
                this.captureScannerFrame = async () => {
                    const captureBtn = document.getElementById('scanner-capture-btn');
                    if (captureBtn) captureBtn.disabled = true;
                    if (this.scannerMode === 'six-face') {
                        const slot = this.scanFaces[this.scanIndex];
                        if (!slot) return;
                        const stickers = makeFaceStickers(slot);
                        const center = stickers[4];
                        const detectedFace = this.guessUnusedFaceFromCenter(center);
                        await this.flashCapture();
                        this.showFaceEditReview({ slot, expectedFace: slot, detectedFace, stickers });
                    } else if (this.scannerMode === 'two-shot') {
                        // two-shot: 合成三面 raw panels
                        const scan = TWO_SHOT_SCANS[this.scanIndex];
                        if (!scan) return;
                        const rawPanels = Object.entries(scan.panels).map(([slot, face]) => ({
                            slot, expectedFace: face,
                            stickers: makeFaceStickers(face),
                        }));
                        await this.flashCapture();
                        this.showShotReview(rawPanels, this.scanIndex,
                            this.scanIndex >= TWO_SHOT_SCANS.length - 1);
                    }
                };

                // 開啟掃描器（不啟動相機） — 完整重置，與 openScanner() 保持一致
                this._closeAllPanels();
                this.scannerMode = mode;
                this.scanIndex = 0;
                this.scanRawPanels = [];
                this._palCache = null;
                this.scanConfirmedFaces = {};
                this.scanFacePanels = {};
                this.scanFaceUserEdits = {};
                this.scanCaptureOrder = [];
                this.faceEditState = null;
                this.faceEditOriginal = null;
                this.faceEditSelectedColor = 'U';
                this.shotReviewActive = false;
                this.shotReviewAllEdited = [];
                this.shotReviewCurrentPanels = null;
                this.shotReviewHistory = [];
                this.sessionCalib = [];
                this.scannerIsCapturing = false;
                this.pendingFacePanel = null;
                ['scanner-view','stability-bar','scan-instruction-box','live-center-hint',
                 'scan-detected-banner','scan-face-chips','scanner-motion-guide'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = '';
                });
                document.getElementById('scanner-panel').querySelectorAll('.scanner-modes,.panel-actions').forEach(el => el.style.display = '');
                document.getElementById('face-edit-area').classList.remove('active');
                const _balRow = document.getElementById('face-edit-balance-row');
                if (_balRow) _balRow.style.display = 'none';
                document.getElementById('scanner-panel').classList.remove('hidden');
                this.syncScannerModeUI();
                this.updateScannerStatus();
                const status = document.getElementById('scanner-status');
                if (status) status.textContent = '[DEV] 合成模式 — 按擷取注入合成數據';
                console.log(
                    `%c[DEV] devSimulateScan("${mode}") 啟動`, 'color:#86efac;font-weight:bold',
                    '\n每次按「擷取」按鈕將注入合成 RGB 數據（含真實感噪音）。',
                    '\n結束後呼叫 game.devStopSimulate() 還原。'
                );
            }

            devStopSimulate() {
                if (this._devOrigCapture) {
                    this.captureScannerFrame = this._devOrigCapture;
                    this._devOrigCapture = null;
                    console.log('[DEV] 模擬模式已關閉，已還原真實擷取函式。');
                }
            }

            // ── 端對端全流程測試 ────────────────────────────────────────────────
            // 不需要真實相機。用已知狀態字串合成正確 RGB，跑完完整掃描→解題流程。
            // 在瀏覽器 console 執行: game.runE2ETest()
            // 或開頁面加 ?test=e2e
            async runE2ETest(options = {}) {
                const log = [];
                const PASS = '✅', FAIL = '❌';
                let passed = 0, failed = 0;

                const assert = (cond, msg) => {
                    if (cond) { log.push(`  ${PASS} ${msg}`); passed++; }
                    else       { log.push(`  ${FAIL} ${msg}`); failed++; }
                    return cond;
                };

                // 從狀態字串取得各面 stickers（{r,g,b} 物件，加少量噪音）
                const CRGB = {
                    U:{r:255,g:215,b:0},  R:{r:230,g:80,b:0},
                    F:{r:0,g:55,b:220},   D:{r:240,g:240,b:240},
                    L:{r:190,g:0,b:0},    B:{r:0,g:150,b:0},
                };
                const stickersFromState = (stateStr, faceIdx) => {
                    return stateStr.slice(faceIdx*9, faceIdx*9+9).split('').map(label => {
                        const c = CRGB[label] || {r:128,g:128,b:128};
                        const j = v => Math.min(255, Math.max(0, v + Math.round((Math.random()*2-1)*6)));
                        return { r:j(c.r), g:j(c.g), b:j(c.b) };
                    });
                };

                const FACE_IDX = {U:0,R:1,F:2,D:3,L:4,B:5};

                // ─── 測試 1：六面掃描 → 解題（已解狀態） ───────────────────────
                log.push('\n=== T-E2E-1：六面掃描 → 解題（已解狀態） ===');
                {
                    let autoSolveState = null;
                    const origAS = this.autoSolve;
                    this.autoSolve = async () => { autoSolveState = this.readCurrentState(); };

                    this.devSimulateScan('six-face');
                    const testState = SOLVED_STATE;
                    let ok = true;
                    for (let i = 0; i < 6; i++) {
                        const face = this.scanFaces[i];
                        const stickers = stickersFromState(testState, FACE_IDX[face]);
                        this.showFaceEditReview({ slot: face, expectedFace: face, detectedFace: face, stickers });
                        // 模擬使用者不改色，直接確認（強制覆寫為已知正確值以繞過分類器）
                        this.faceEditState = testState.slice(FACE_IDX[face]*9, FACE_IDX[face]*9+9).split('');
                        await this.confirmFaceEdit();
                        const msg = `face ${face} confirmed, scanIndex=${this.scanIndex}`;
                        log.push(`    ${i+1}/6 ${msg}`);
                    }
                    assert(autoSolveState !== null, 'autoSolve 被呼叫');
                    if (autoSolveState) {
                        assert(autoSolveState === SOLVED_STATE, `state 正確（${autoSolveState === SOLVED_STATE ? '完全一致' : '不符'}`);
                    }
                    this.autoSolve = origAS;
                    this._closeAllPanels();
                    this.devStopSimulate();
                }

                // ─── 測試 2：六面掃描 → 解題（打亂狀態） ───────────────────────
                log.push('\n=== T-E2E-2：六面掃描 → 解題（打亂狀態） ===');
                {
                    let autoSolveState = null;
                    const origAS = this.autoSolve;
                    this.autoSolve = async () => { autoSolveState = this.readCurrentState(); };

                    // 已知合法打亂狀態（T6-4 用過的解題測試基礎）
                    const scrambled = 'DRLUUBFBRBLURRLRUBLRBLRDLLDBFLBBLFRRBUUDDFULRLUDDFBDBUU';
                    this.devSimulateScan('six-face');
                    for (let i = 0; i < 6; i++) {
                        const face = this.scanFaces[i];
                        const stickers = stickersFromState(scrambled, FACE_IDX[face]);
                        this.showFaceEditReview({ slot: face, expectedFace: face, detectedFace: face, stickers });
                        // 強制覆寫 faceEditState 以排除分類器誤差
                        this.faceEditState = scrambled.slice(FACE_IDX[face]*9, FACE_IDX[face]*9+9).split('');
                        await this.confirmFaceEdit();
                        log.push(`    ${i+1}/6 face ${face}: ${this.faceEditState ? 'confirmed' : 'FAILED'}`);
                    }
                    assert(autoSolveState !== null, 'autoSolve 被呼叫');
                    if (autoSolveState) {
                        const v = StateValidator3.validate(autoSolveState);
                        assert(v.ok, `state 合法 (${v.ok ? 'ok' : v.errors[0]})`);
                        assert(autoSolveState === scrambled, `state 與預期一致（${autoSolveState === scrambled ? 'match' : 'MISMATCH'})`);
                    }
                    this.autoSolve = origAS;
                    this._closeAllPanels();
                    this.devStopSimulate();
                }

                // ─── 測試 3：分類器 RGB → face label（正確 {r,g,b} 格式） ─────
                log.push('\n=== T-E2E-3：分類器對 {r,g,b} 物件正確分類 ===');
                {
                    const palette = this.buildProgressivePalette();
                    let classifyOk = 0;
                    Object.entries(CRGB).forEach(([expectedFace, rgb]) => {
                        const classified = this.classifyRgbWithCalibration(rgb, palette);
                        const ok2 = classified === expectedFace;
                        if (ok2) classifyOk++;
                        log.push(`    RGB(${rgb.r},${rgb.g},${rgb.b}) → ${classified} (expected ${expectedFace}) ${ok2 ? PASS : FAIL}`);
                    });
                    assert(classifyOk === 6, `全部 6 色分類正確（${classifyOk}/6）`);
                }

                // ─── 測試 4：StateValidator3 對打亂狀態回傳合法 ──────────────
                log.push('\n=== T-E2E-4：StateValidator3 驗證合法打亂狀態 ===');
                {
                    const scrambled = 'DRLUUBFBRBLURRLRUBLRBLRDLLDBFLBBLFRRBUUDDFULRLUDDFBDBUU';
                    const v = StateValidator3.validate(scrambled);
                    assert(v.ok, `scrambled state 通過驗證（${v.ok ? 'ok' : v.errors.join(', ')})`);
                    const vi = StateValidator3.validate(SOLVED_STATE);
                    assert(vi.ok, `solved state 通過驗證`);
                    const bad = 'UUUUUUUUURRRRRRRRR' + 'FFFFFFFFF' + 'DDDDDDDDD' + 'LLLLLLLLL' + 'BBBBBBBBB';
                    const vb = StateValidator3.validate(bad);
                    assert(!vb.ok, `非法 state（長度錯誤）被正確拒絕`);
                }

                // ─── 測試 5：兩張快速掃描（two-shot）流程 ────────────────────
                log.push('\n=== T-E2E-5：兩張快速掃描 → 解題 ===');
                {
                    let autoSolveState = null;
                    const origAS = this.autoSolve;
                    this.autoSolve = async () => { autoSolveState = this.readCurrentState(); };

                    this.devSimulateScan('two-shot');
                    // Shot 1
                    const shot0 = TWO_SHOT_SCANS[0];
                    const panels0 = Object.entries(shot0.panels).map(([slot, face]) => ({
                        slot, expectedFace: face,
                        stickers: Array.from({length:9}, () => ({...CRGB[face]})),
                    }));
                    this.showShotReview(panels0, 0, false);
                    // 強制分類結果為正確值（用 expectedFace，非 slot 位置鍵）
                    this.shotReviewCurrentPanels.forEach(p => {
                        p.classifiedColors = Array(9).fill(p.expectedFace);
                    });
                    await this.nextShotReview();
                    log.push('    Shot 1 confirmed');

                    // Shot 2
                    const shot1 = TWO_SHOT_SCANS[1];
                    const panels1 = Object.entries(shot1.panels).map(([slot, face]) => ({
                        slot, expectedFace: face,
                        stickers: Array.from({length:9}, () => ({...CRGB[face]})),
                    }));
                    this.showShotReview(panels1, 1, true);
                    this.shotReviewCurrentPanels.forEach(p => {
                        p.classifiedColors = Array(9).fill(p.expectedFace);
                    });
                    await this.confirmShotReview();
                    log.push('    Shot 2 confirmed');

                    assert(autoSolveState !== null, 'autoSolve 被呼叫');
                    if (autoSolveState) {
                        const v = StateValidator3.validate(autoSolveState);
                        assert(v.ok, `two-shot state 合法 (${v.ok ? 'ok' : v.errors.join(', ')})`);
                    }
                    this.autoSolve = origAS;
                    this._closeAllPanels();
                    this.devStopSimulate();
                }

                // ─── 結果 ───────────────────────────────────────────────────
                const summary = `\nE2E 結果: ${passed} 通過, ${failed} 失敗 / ${passed+failed} 項`;
                log.push(summary);
                console.log('%c[E2E TEST]', 'color:#86efac;font-weight:bold;font-size:1.1em', log.join('\n'));
                this.updateTestStatus(failed === 0 ? 'passed' : 'failed',
                    `E2E: ${passed}/${passed+failed} 通過${failed ? ' ← 有失敗，見 console' : ''}`);
                if (!options.silent) {
                    const alertMsg = log.join('\n');
                    alert(alertMsg.slice(0, 2000) + (alertMsg.length > 2000 ? '\n...(see console)' : ''));
                }
                return { ok: failed === 0, passed, failed, log };
            }

            async runPhase6Tests(options = {}) {
                const started = performance.now();
                const results = [];
                const run = async (name, fn) => {
                    const t0 = performance.now();
                    await fn();
                    results.push({ name, ms: Math.round((performance.now() - t0) * 100) / 100 });
                };

                const savedState = this.readCurrentState();

                // 合成 RGB 值（近似真實室內光測量）
                const RGBS = {
                    U: [210, 195, 25], R: [218, 98, 12], F: [18, 52, 205],
                    D: [215, 215, 210], L: [192, 22, 22], B: [18, 148, 28],
                };
                const solid = (face) => Array.from({length: 9}, () => [...RGBS[face]]);

                const cleanup = () => {
                    this.devStopSimulate();
                    this._closeAllPanels();
                    this.scanConfirmedFaces = {};
                    this.faceEditState = null;
                    this.scanRawPanels = [];
                    this.scanIndex = 0;
                    document.getElementById('face-edit-area').classList.remove('active');
                };

                try {
                    // ── T6-1 showFaceEditReview 渲染正確 DOM ───────────────────────
                    await run('T6-1 showFaceEditReview 渲染 DOM', async () => {
                        this.devSimulateScan('six-face');
                        this.scanIndex = 0;
                        this.showFaceEditReview({ slot: 'U', expectedFace: 'U', detectedFace: 'U', stickers: solid('U') });

                        const area = document.getElementById('face-edit-area');
                        this.assertTest(area.classList.contains('active'), '#face-edit-area 應有 active class');
                        const title = document.getElementById('face-edit-title');
                        this.assertTest(title.textContent.includes('1 / 6'), '標題應包含 "1 / 6"');
                        // 新版標題格式：「偵測為：黃色面（1 / 6）」— 改為驗證有顏色名稱
                        this.assertTest(/[黃橙藍白紅綠]/.test(title.textContent), `標題應含顏色名稱（實際: ${title.textContent}）`);
                        const grid = document.getElementById('face-edit-grid');
                        this.assertTest(grid.children.length === 9, '格子應有 9 個 cell');
                        this.assertTest(grid.children[4].classList.contains('center'), '第 5 格應有 .center class');
                        const palette = document.getElementById('face-edit-palette');
                        this.assertTest(palette.children.length === 6, '調色盤應有 6 個色塊');
                        const activeSwatches = palette.querySelectorAll('.active');
                        this.assertTest(activeSwatches.length === 1, '調色盤應有 1 個選中色塊');

                        this.retakeFaceEdit();
                        cleanup();
                    });

                    // ── T6-2 confirmFaceEdit 存面、推進 scanIndex ──────────────────
                    await run('T6-2 confirmFaceEdit 存面推進 scanIndex', async () => {
                        this.devSimulateScan('six-face');
                        this.scanIndex = 0;
                        this.showFaceEditReview({ slot: 'U', expectedFace: 'U', detectedFace: 'U', stickers: solid('U') });
                        await this.confirmFaceEdit();

                        this.assertTest(Array.isArray(this.scanConfirmedFaces['U']), 'U 面應存入 scanConfirmedFaces');
                        this.assertTest(this.scanConfirmedFaces['U'].length === 9, 'U 面應有 9 個色值');
                        this.assertTest(this.scanIndex === 1, 'scanIndex 應推進到 1');
                        this.assertTest(this.scanRawPanels.length === 1, 'scanRawPanels 應有 1 項（供漸進校準）');
