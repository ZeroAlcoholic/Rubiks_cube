<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3×3 魔術方塊掃描解題系統</title>
    <meta name="theme-color" content="#03110d">

    <!-- Parallel-download critical vendor JS while HTML is still parsing.
         3×3 currently runs LBL on main thread (no Worker), so we only preload classics. -->
    <link rel="preload" as="script" href="vendor/three-r128.min.js">
    <link rel="preload" as="script" href="vendor/orbitcontrols-r128.js">
    <link rel="preload" as="script" href="vendor/cubejs-1.3.2.js">

    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background-color: #020806 !important;
        }
        body {
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 38%, rgba(18, 83, 58, 0.52), rgba(4, 18, 14, 0.88) 42%, #020806 78%),
                linear-gradient(145deg, #03110d 0%, #071f17 48%, #010403 100%) !important;
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 42%, rgba(14, 78, 52, 0.48), rgba(3, 21, 15, 0.78) 45%, #020806 82%),
                linear-gradient(145deg, #03110d 0%, #071f17 48%, #010403 100%);
        }
        .ui-layer { position: absolute; z-index: 10; pointer-events: none; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-white { color: #fff; }
        .font-bold { font-weight: 700; }
        .tracking-widest { letter-spacing: 0.1em; }
        .drop-shadow-md { filter: drop-shadow(0 4px 3px rgba(0,0,0,0.07)) drop-shadow(0 2px 2px rgba(0,0,0,0.06)); }
        .mt-2 { margin-top: 0.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        
        .btn { 
            pointer-events: auto; 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.3); 
            color: white; 
            padding: 10px 16px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.2s ease-out; 
            font-weight: 700; 
            font-size: 0.85rem;
            text-transform: uppercase; 
            letter-spacing: 1px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn.active-lock {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .btn.active-cube-lock {
            background: rgba(255, 80, 80, 0.25);
            border-color: #ff5050;
            color: #ff5050;
            box-shadow: 0 0 15px rgba(255, 80, 80, 0.4);
        }
        .btn.solve-btn {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.22), rgba(20, 83, 45, 0.42));
            border-color: #22c55e;
        }

        #win-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffd700; font-size: 3rem; font-weight: 900; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            opacity: 0; pointer-events: none; transition: opacity 0.5s; text-align: center; width: 100%; z-index: 20;
        }
        .instruction { color: rgba(255,255,255,0.7); font-size: 0.9rem; text-align: center; margin-top: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .top-bar { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
        .controls-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; width: 100%; max-width: 600px; }
        #test-status { color: #86efac; font-size: 0.8rem; text-align: center; min-height: 1.2rem; }
        .hidden { display: none !important; }
        .panel {
            position: absolute;
            z-index: 30;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(760px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            overflow: auto;
            padding: 18px;
            border: 1px solid rgba(134, 239, 172, 0.28);
            border-radius: 8px;
            background: rgba(2, 10, 7, 0.92);
            color: #f8fafc;
            box-shadow: 0 24px 80px rgba(0,0,0,0.55);
            backdrop-filter: blur(14px);
        }
        .panel-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
        .panel h2 { margin: 0 0 4px; font-size: 1.25rem; }
        .panel p { margin: 0; color: #bbf7d0; font-size: 0.9rem; }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
        }
        .palette { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .swatch {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.22);
            cursor: pointer;
        }
        .swatch.active { border-color: #86efac; box-shadow: 0 0 0 3px rgba(134,239,172,0.2); }
        .unfold {
            display: grid;
            grid-template-columns: repeat(12, minmax(22px, 42px));
            grid-template-rows: repeat(9, minmax(22px, 42px));
            gap: 4px;
            justify-content: center;
            margin: 10px auto 16px;
        }
        .sticker {
            border: 1px solid rgba(0,0,0,0.72);
            border-radius: 4px;
            cursor: pointer;
            min-width: 22px;
            min-height: 22px;
        }
        .sticker:hover { outline: 2px solid #86efac; outline-offset: 1px; }
        .sticker.center { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.34); }
        .sticker.invalid { outline: 2px solid #f87171; outline-offset: 1px; }
        .panel-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
        .solve-guide {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 25;
            width: min(760px, calc(100vw - 24px));
            padding: 12px;
            border: 1px solid rgba(134,239,172,0.24);
            border-radius: 8px;
            background: rgba(2, 10, 7, 0.86);
            backdrop-filter: blur(14px);
            color: white;
            pointer-events: auto;
        }
        .guide-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .notation-badge {
            min-width: 72px;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            color: #86efac;
        }
        .guide-progress { flex: 1; color: #d1fae5; font-size: 0.95rem; }
        .guide-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .guide-footer { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .guide-speed-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); white-space: nowrap; }
        .guide-speed-btn { font-size: 0.75rem !important; padding: 3px 11px !important; opacity: 0.45; transition: opacity 0.15s; }
        .guide-speed-btn.active { opacity: 1; border-color: rgba(134,239,172,0.55) !important; color: #86efac !important; }
        .guide-close-btn { margin-left: auto; font-size: 0.78rem; opacity: 0.55; }
        .scanner-view {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #020806;
            border-radius: 8px;
            overflow: hidden;
            margin: 12px 0;
        }
        #scanner-video, #scanner-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            touch-action: none;
        }
        .scanner-modes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .scanner-mode-btn.active {
            border-color: rgba(134, 239, 172, 0.7);
            background: rgba(22, 101, 52, 0.62);
            color: #dcfce7;
        }
        .scanner-motion-guide {
            display: none;
            align-items: center;
            gap: 14px;
            margin-top: 12px;
            color: #dcfce7;
        }
        .scanner-motion-guide.active { display: flex; }
        .scan-mini-cube {
            width: 64px;
            height: 64px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-24deg) rotateY(38deg);
            animation: scanCubeSettle 1.8s ease-in-out infinite;
            flex: 0 0 auto;
        }
        .scan-mini-cube.flip {
            animation: scanCubeFlip 1.8s ease-in-out infinite;
        }
        .scan-mini-face {
            position: absolute;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(134, 239, 172, 0.76);
            background: rgba(2, 10, 7, 0.72);
            color: #dcfce7;
            font-weight: 900;
            border-radius: 4px;
            box-shadow: inset 0 0 12px rgba(134,239,172,0.12);
        }
        .scan-mini-face.top { transform: rotateX(90deg) translateZ(22px); }
        .scan-mini-face.front { transform: translateZ(22px); }
        .scan-mini-face.right { transform: rotateY(90deg) translateZ(22px); }
        .scan-motion-arrow {
            width: 72px;
            height: 40px;
            position: relative;
            flex: 0 0 auto;
        }
        .scan-motion-arrow::before {
            content: "";
            position: absolute;
            left: 5px;
            top: 14px;
            width: 54px;
            height: 22px;
            border-top: 3px solid #86efac;
            border-radius: 50%;
            transform: rotate(-18deg);
            animation: scanArrowPulse 1.1s ease-in-out infinite;
        }
        .scan-motion-arrow::after {
            content: "";
            position: absolute;
            right: 4px;
            top: 8px;
            width: 13px;
            height: 13px;
            border-top: 3px solid #86efac;
            border-right: 3px solid #86efac;
            transform: rotate(45deg);
            animation: scanArrowPulse 1.1s ease-in-out infinite;
        }
        .scan-motion-target {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            letter-spacing: 0;
        }
        .scan-face-chip {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: 1px solid rgba(134, 239, 172, 0.55);
            background: rgba(22, 101, 52, 0.42);
            color: #dcfce7;
        }
        @keyframes scanCubeSettle {
            0%, 100% { transform: rotateX(-24deg) rotateY(38deg); }
            50% { transform: rotateX(-18deg) rotateY(32deg); }
        }
        @keyframes scanCubeFlip {
            0%, 100% { transform: rotateX(-24deg) rotateY(38deg); }
            50% { transform: rotateX(-154deg) rotateY(218deg); }
        }
        @keyframes scanArrowPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }
        /* ── 斜角掃描 in-place 修色 ─────────────────────────── */
        @media (max-width: 640px) {
            #scanner-panel:not(.hidden) {
                position: fixed !important;
                inset: 0 !important;
                width: 100vw !important;
                max-width: 100vw !important;
                height: 100dvh !important;
                max-height: 100dvh !important;
                transform: none !important;
                border-radius: 0 !important;
                border: none !important;
                padding: 10px !important;
                display: flex !important;
                flex-direction: column;
                overflow-y: auto;
                z-index: 50 !important;
            }
            #scanner-panel:not(.hidden) .scanner-view {
                flex: 1 1 0 !important;
                aspect-ratio: unset !important;
                min-height: 0;
            }
            #scanner-panel:not(.hidden) #face-edit-area.active {
                flex: 1 1 0;
                overflow-y: auto;
                min-height: 0;
            }
        }
        #shot-review-palette { display: none; gap: 8px; justify-content: center; padding: 6px 0 2px; flex-wrap: wrap; }
        #shot-review-palette.active { display: flex; }
        .shot-review-swatch {
            width: 40px; height: 40px;
            border-radius: 8px;
            border: 3px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: border-color 0.12s, transform 0.12s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 800;
            text-shadow: 0 0 3px rgba(0,0,0,0.85), 0 0 1px rgba(0,0,0,0.85);
        }
        .shot-review-swatch.active {
            border-color: white;
            transform: scale(1.18);
            box-shadow: 0 0 10px rgba(255,255,255,0.35);
        }
        #shot-review-hint {
            display: none;
            color: rgba(255,255,255,0.45);
            font-size: 0.73rem;
            text-align: center;
            padding: 2px 0;
        }
        #shot-review-hint.active { display: block; }
        #shot-review-actions { display: none; gap: 8px; justify-content: center; padding: 4px 0; }
        #shot-review-actions.active { display: flex; }
        /* ── 六面逐面編輯區 ── */
        #face-edit-area { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0; }
        #face-edit-area.active { display: flex; }
        #face-edit-title { font-size: 0.9rem; color: #86efac; font-weight: 600; text-align: center; }
        .face-edit-palette { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .face-edit-swatch {
            width: 38px; height: 38px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.15); cursor: pointer;
            transition: border-color 0.12s, transform 0.12s; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 0.78rem; font-weight: 800;
            text-shadow: 0 0 3px rgba(0,0,0,0.85), 0 0 1px rgba(0,0,0,0.85);
        }
        .face-edit-swatch.active { border-color: #fff; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        #face-edit-grid {
            display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
            gap: 5px;
        }
        .face-edit-cell {
            border-radius: 6px; border: 2px solid rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.1s;
        }
        .face-edit-cell:not(.center):hover { transform: scale(1.08); z-index: 1; }
        .face-edit-cell.center { border-color: rgba(255,255,255,0.4); cursor: default; }
        .face-edit-cell.uncertain {
            box-shadow: inset 0 0 0 2px #f97316, 0 0 0 1px rgba(249,115,22,0.4);
            animation: faceEditUncertainPulse 1.4s ease-in-out infinite;
        }
        .face-edit-cell.user-edited {
            box-shadow: inset 0 0 0 2px #06b6d4;
        }
        .face-edit-cell.user-edited.uncertain {
            box-shadow: inset 0 0 0 2px #06b6d4; /* user override wins over uncertain */
            animation: none;
        }
        @keyframes faceEditUncertainPulse {
            0%, 100% { box-shadow: inset 0 0 0 2px #f97316, 0 0 0 1px rgba(249,115,22,0.4); }
            50%      { box-shadow: inset 0 0 0 2px #fb923c, 0 0 0 4px rgba(249,115,22,0.55); }
        }
        #face-edit-hint { font-size: 0.78rem; color: rgba(255,255,255,0.5); text-align: center; }
        #face-edit-identity-row { display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap; padding:2px 0; }
        .face-id-dot { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; color:rgba(0,0,0,0.75); transition:transform 0.12s, box-shadow 0.12s; cursor:pointer; border:2px solid transparent; }
        .face-id-dot.active { transform:scale(1.18); box-shadow:0 0 10px rgba(255,255,255,0.45); border-color:#fff; }
        .face-id-dot.done { opacity:0.35; cursor:not-allowed; }
        #face-edit-actions { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
        /* ── 翻面提示覆層 ──────────────────────────────────────── */
        #rotation-prompt {
            position: absolute; inset: 0; z-index: 20;
            background: rgba(2, 10, 7, 0.96);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 14px; padding: 20px; border-radius: 8px;
        }
        #rotation-prompt.hidden { display: none; }
        .rot-title { color: #86efac; font-size: 1.05rem; font-weight: 700; text-align: center; }
        .rot-diagram { display: flex; align-items: center; gap: 18px; }
        .rot-step { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .rot-step-label { font-size: 0.72rem; color: rgba(255,255,255,0.55); }
        .rot-flip-arrow {
            font-size: 2.6rem; color: #86efac; line-height: 1;
            animation: rotArrowPulse 1.1s ease-in-out infinite;
        }
        @keyframes rotArrowPulse {
            0%, 100% { opacity: 0.4; transform: scaleY(1); }
            50%       { opacity: 1;   transform: scaleY(1.18); }
        }
        .rot-steps { color: rgba(255,255,255,0.7); font-size: 0.8rem; text-align: center; line-height: 1.65; }
        /* ── 掃描 UX 改進樣式 ─────────────────────────────────── */
        .scan-face-progress {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin: 8px 0 6px;
            flex-wrap: wrap;
        }
        .scan-face-chip-item {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            position: relative;
            gap: 2px;
        }
        .scan-face-chip-item .chip-dot {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            opacity: 0.25;
            transition: opacity 0.3s;
        }
        .scan-face-chip-item.done {
            border-color: #86efac;
            color: #f0fdf4;
        }
        .scan-face-chip-item.done .chip-dot {
            opacity: 1;
        }
        .scan-face-chip-item.done::after {
            content: '✓';
            position: absolute;
            top: -7px;
            right: -7px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #22c55e;
            color: white;
            font-size: 9px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 16px;
            text-align: center;
        }
        #scanner-flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            border-radius: 8px;
            transition: opacity 0.06s;
        }
        #scanner-flash.active { opacity: 0.6; }
        .scan-instruction-box {
            background: rgba(22, 101, 52, 0.22);
            border: 1px solid rgba(134,239,172,0.25);
            border-radius: 6px;
            padding: 9px 13px;
            margin: 6px 0;
            color: #dcfce7;
            font-size: 0.88rem;
            line-height: 1.55;
            min-height: 48px;
        }
        .scan-instruction-box strong { color: #86efac; }
        .scan-instruction-box .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #22c55e;
            color: white;
            font-size: 0.72rem;
            font-weight: 900;
            margin-right: 6px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        #scan-detected-banner {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(22, 101, 52, 0.38);
            border: 1px solid #22c55e;
            border-radius: 6px;
            padding: 8px 13px;
            margin: 6px 0;
            color: #dcfce7;
            font-size: 0.9rem;
            font-weight: 700;
            animation: bannerIn 0.2s ease;
        }
        #scan-detected-banner.show { display: flex; }
        @keyframes bannerIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #scan-detected-swatch {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            border: 2px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        /* ── 自動擷取 & 穩定度指示 ──────────────────────────────── */
        .auto-capture-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #86efac;
            font-size: 0.82rem;
            user-select: none;
            cursor: pointer;
            margin: 4px 0 0;
        }
        .auto-capture-row input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #22c55e;
            cursor: pointer;
            flex-shrink: 0;
        }
        #live-center-hint {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(15,60,30,0.55);
            border: 1px solid rgba(134,239,172,0.3);
            border-radius: 6px;
            padding: 6px 12px;
            margin: 4px 0 2px;
            color: #dcfce7;
            font-size: 0.85rem;
            font-weight: 700;
        }

        const TWO_SHOT_SCANS = [

        class StateValidator3 {
            static validate(stateStr) {
                const errors = [];
                if (typeof stateStr !== 'string' || stateStr.length !== 54) {
                    return { ok: false, errors: ['狀態必須是 54 字元 URFDLB 字串。'] };
                }
                if (!/^[URFDLB]{54}$/.test(stateStr)) {
                    return { ok: false, errors: ['狀態只能包含 U/R/F/D/L/B。'] };
                }

                const counts = {};
                for (const face of STATE_FACE_ORDER) counts[face] = 0;
                for (const ch of stateStr) counts[ch]++;
                for (const face of STATE_FACE_ORDER) {
                    if (counts[face] !== 9) errors.push(`${face} 貼紙數為 ${counts[face]}，必須是 9。`);
                }

                const centers = STATE_FACE_ORDER.map((_, i) => stateStr[i * 9 + 4]);
                if (new Set(centers).size !== 6) errors.push('六個中心格顏色必須互不相同。');

                if (window.Cube && errors.length === 0) {
                    try {
                        const cube = Cube.fromString(stateStr);
                        if (cube.asString() !== stateStr) errors.push('cubejs 無法忠實解析此 facelet 狀態。');
                    } catch (error) {
                        errors.push(`cubejs 狀態解析失敗：${error.message}`);
                    }
                }

                return { ok: errors.length === 0, errors };
            }
        }

        class HSVClassifier {
            static rgbToHsv(r, g, b) {
                r /= 255; g /= 255; b /= 255;
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const d = max - min;
                let h = 0;
                if (d !== 0) {
                    if (max === r) h = ((g - b) / d) % 6;
                    else if (max === g) h = (b - r) / d + 2;
                    else h = (r - g) / d + 4;
                    h *= 60;
                    if (h < 0) h += 360;
                }
                const s = max === 0 ? 0 : d / max;
                return { h, s, v: max };
            }

            static classify(r, g, b) {
                const { h, s, v } = HSVClassifier.rgbToHsv(r, g, b);
                // 白色（D）：低飽和度 + 高亮度；必須先判，避免淺黃被誤判
                if (s < 0.20 && v > 0.65) return 'D';
                // 黃色（U）：從 40° 起，避免橘色 #ffa500（H=38.8°）被誤判為黃
                if (h >= 40 && h <= 72 && s >= 0.42 && v >= 0.50) return 'U';
                // 紅色（L）：跨越 0° 需雙邊判斷
                if ((h <= 12 || h >= 348) && s >= 0.48 && v >= 0.25) return 'L';
                // 橙色（R）：12–40°，含 #ffa500 的真實 H=38.8°
                if (h > 12 && h < 40 && s >= 0.48 && v >= 0.25) return 'R';
                // 綠色（B）
                if (h >= 85 && h <= 165 && s >= 0.30 && v >= 0.20) return 'B';
                // 藍色（F）
                if (h >= 175 && h <= 270 && s >= 0.30 && v >= 0.20) return 'F';
                // fallback：最近鄰（加權考量飽和度與亮度）
                const distances = {
                    U: Math.abs(h - 55) + (s < 0.42 ? 80 : 0),
                    R: Math.abs(h - 30) + (s < 0.48 ? 80 : 0),
                    L: Math.min(Math.abs(h), Math.abs(360 - h)) + (s < 0.48 ? 80 : 0),
                    B: Math.abs(h - 125) + (s < 0.30 ? 80 : 0),
                    F: Math.abs(h - 222) + (s < 0.30 ? 80 : 0),
                    D: s * 300 + (1 - v) * 180
                };
                return Object.entries(distances).sort((a, b) => a[1] - b[1])[0][0];
            }
        }

        class CubeJSSolverAdapter {
            constructor() {
                this.initialized = false;
            }

            ensureAvailable() {
                if (!window.Cube || typeof Cube.fromString !== 'function' || typeof Cube.initSolver !== 'function') {
                    throw new Error('cubejs solver 尚未載入 — 請確認 vendor/cubejs-1.3.2.js 可被瀏覽器讀取。');
                }
            }

            async ensureInitialized(onStatus) {
                this.ensureAvailable();
                if (this.initialized) return;
                if (onStatus) onStatus('初始化 Kociemba two-phase solver...');
                await new Promise(resolve => setTimeout(resolve, 30));
                const started = performance.now();
                Cube.initSolver();
                this.initialized = true;
                if (onStatus) onStatus(`solver 初始化完成 (${Math.round(performance.now() - started)}ms)`);
            }

            async solve(stateStr, onStatus) {
                const validation = StateValidator3.validate(stateStr);
                if (!validation.ok) throw new Error(validation.errors.join('\n'));
                await this.ensureInitialized(onStatus);
                const started = performance.now();
                const cube = Cube.fromString(stateStr);
                if (cube.isSolved()) {
                    return { algorithm: '', moves: [], elapsed: Math.round((performance.now() - started) * 100) / 100 };
                }
                const algorithm = cube.solve(22).trim();
                const elapsed = Math.round((performance.now() - started) * 100) / 100;
                const moves = algorithm ? algorithm.split(/\s+/).map(notation => ({ notation, stage: 'Kociemba' })) : [];
                return { algorithm, moves, elapsed };
            }
        }

                this.editorState = SOLVED_STATE;

                this.guideMoves = [];

                this.executedGuideMoves = [];
                this.isGuideAutoPlaying = false;
                this.guideDelayMs = 600;
                this.guideAnimMs = 180;
                this.scannerMode = 'two-shot';

                this.pendingFacePanel = null;
                this.shotReviewActive = false;
                this.shotReviewAllEdited = [];
                this.shotReviewCurrentPanels = null;
                this.shotReviewSelectedColor = 'U';
                this.scanIndex = 0;
                this.scanState = SOLVED_STATE.split('');
                this.scanRawPanels = [];
                this.scannerStream = null;
                this.scannerAnimation = null;
                // 即時預覽狀態
                this.scannerFrameCount = 0;
                this.scannerSmoothedRgbs = null;
                this.scannerPreviewCanvas = null;
                this.scannerPreviewCtx = null;
                this.scannerStableFrames = 0;
                this.scannerStabilityScore = 0;
                this.scannerPrevRgbs = null;
                this.scannerAutoCapture = true;
                this.scannerIsCapturing = false;
                this.pendingFacePanel = null;
                this.faceEditState = null;
                this.faceEditOriginal = null;
                this.faceEditSelectedColor = 'U';
                this.scanConfirmedFaces = {};
                // Per-slot history maps for back-navigation in six-face mode.
                // scanConfirmedFaces[slot] = final color labels [9]
                // scanFacePanels[slot]    = original captured panel { stickers, ... }
                // scanFaceUserEdits[slot] = boolean array marking user-edited stickers [9]
                this.scanFacePanels = {};
                this.scanFaceUserEdits = {};
                // Two-shot history snapshot (for back-navigation between shots)
                this.shotReviewHistory = [];
                this.sessionCalib = [];

                this.init();
            }

            init() {
                const container = document.getElementById('canvas-container');
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.set(6, 5, 8);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.domElement.style.touchAction = 'none'; // prevent 300ms tap delay on iOS
                container.appendChild(this.renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);
                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(10, 20, 10);
                this.scene.add(dirLight);
                const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
                backLight.position.set(-10, -5, -10);
                this.scene.add(backLight);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.enablePan = false;
                this.controls.minDistance = 4;
                this.controls.maxDistance = 15;
                // Render-on-demand: only redraw when something visibly changes (saves mobile battery).
                this._needsRender = true;
                this.controls.addEventListener('change', () => { this._needsRender = true; });

                this.createRubiksCube();
                this.scene.add(this.pivot);
                this._needsRender = true;

                window.addEventListener('resize', () => this.onWindowResize(), false);
                const canvas = this.renderer.domElement;
                canvas.addEventListener('mousedown', (e) => this.onPointerDown(e), false);
                canvas.addEventListener('mousemove', (e) => this.onPointerMove(e), false);
                window.addEventListener('mouseup', (e) => this.onPointerUp(e), false);
                canvas.addEventListener('touchstart', (e) => this.onPointerDown(e.touches[0]), { passive: false });
                canvas.addEventListener('touchmove', (e) => { e.preventDefault(); this.onPointerMove(e.touches[0]); }, { passive: false });
                window.addEventListener('touchend', () => this.onPointerUp(), false);

                this._scannerPanelEl = document.getElementById('scanner-panel');
                this.animate();
            }

            toggleCameraLock() {
                this.isCameraLocked = !this.isCameraLocked;
                this.controls.enableRotate = !this.isCameraLocked;
                this.updateUI();
            }

            toggleCubeLock() {
                this.isCubeLocked = !this.isCubeLocked;
                this.updateUI();
            }

            updateUI() {
                const camBtn = document.getElementById('cam-lock-btn');
                const camIcon = document.getElementById('cam-lock-icon');
                const camText = document.getElementById('cam-lock-text');
                if (this.isCameraLocked) {
                    camBtn.classList.add('active-lock');
                    camIcon.innerText = '🔒';
                    camText.innerText = '視角已鎖定';
                } else {
                    camBtn.classList.remove('active-lock');
                    camIcon.innerText = '🔓';
                    camText.innerText = '視角自由';
                }

                const cubeBtn = document.getElementById('cube-lock-btn');
                const cubeIcon = document.getElementById('cube-lock-icon');
                const cubeText = document.getElementById('cube-lock-text');
                if (this.isCubeLocked) {
                    cubeBtn.classList.add('active-cube-lock');
                    cubeIcon.innerText = '🔒';
                    cubeText.innerText = '方塊已固定';
                } else {
                    cubeBtn.classList.remove('active-cube-lock');
                    cubeIcon.innerText = '🔓';
                    cubeText.innerText = '方塊可轉';
                }
            }

            createRubiksCube() {
                if (this._cubeGeometry) { this._cubeGeometry.dispose(); this._cubeGeometry = null; }
                this.cubes.forEach(c => this.scene.remove(c));
                this.cubes = [];
                this.moveStack = [];
                const geometry = new THREE.BoxGeometry(0.96, 0.96, 0.96);
                this._cubeGeometry = geometry;
                const positions = this.getSlicePositions();
                const outer = Math.max(...positions.map(v => Math.abs(v)));

                positions.forEach(x => {
                    positions.forEach(y => {
                        positions.forEach(z => {
                            const mats = [];
                            mats.push(x === outer ? this.materials[0] : this.blackMat); 
                            mats.push(x === -outer ? this.materials[1] : this.blackMat); 
                            mats.push(y === outer ? this.materials[2] : this.blackMat); 
                            mats.push(y === -outer ? this.materials[3] : this.blackMat); 
                            mats.push(z === outer ? this.materials[4] : this.blackMat); 
                            mats.push(z === -outer ? this.materials[5] : this.blackMat); 

                            const cube = new THREE.Mesh(geometry, mats);
                            cube.position.set(x, y, z);
                            cube.userData = { originalPos: new THREE.Vector3(x, y, z) };
                            this.scene.add(cube);
                            this.cubes.push(cube);
                        });
                    });
                });
            }

            getSlicePositions() {
                const offset = (this.N - 1) / 2;
                return Array.from({ length: this.N }, (_, i) => i - offset);
            }

            coordKey(x, y, z) {
                return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
            }

            getCubeAt(x, y, z) {
                const target = this.coordKey(x, y, z);
                return this.cubes.find(cube => {
                    const pos = cube.position.clone().round();
                    return this.coordKey(pos.x, pos.y, pos.z) === target;
                });
            }

            normalizeMaterialArray(cube) {
                if (!Array.isArray(cube.material)) cube.material = [cube.material];
                cube.material = cube.material.slice();
                while (cube.material.length < 6) cube.material.push(this.blackMat);
            }

            getMaterialIndexForWorldFace(cube, face) {
                const worldNormal = FACE_NORMALS[face];
                for (const [name, localNormal] of Object.entries(FACE_NORMALS)) {
                    const rotatedNormal = localNormal.clone().applyQuaternion(cube.quaternion).round();
                    if (rotatedNormal.distanceTo(worldNormal) < 0.1) {
                        return FACE_TO_MATERIAL_INDEX[name];
                    }
                }
                throw new Error(`Cannot resolve material index for face ${face}.`);
            }

            getStickerFaceAt(face, index) {
                const [x, y, z] = FACE_COORDS[face][index];
                const cube = this.getCubeAt(x, y, z);
                if (!cube) throw new Error(`Missing cubie at ${x},${y},${z}.`);
                const materialIndex = this.getMaterialIndexForWorldFace(cube, face);
                const material = cube.material[materialIndex];
                const faceName = this.materialToFace(material);
                if (!faceName) throw new Error(`Sticker at ${face}${index} has no color material.`);
                return faceName;
            }

            setStickerFaceAt(face, index, value) {
                const [x, y, z] = FACE_COORDS[face][index];
                const cube = this.getCubeAt(x, y, z);
                if (!cube) throw new Error(`Missing cubie at ${x},${y},${z}.`);
                this.normalizeMaterialArray(cube);
                const materialIndex = this.getMaterialIndexForWorldFace(cube, face);
                cube.material[materialIndex] = this.materials[FACE_TO_MATERIAL_INDEX[value]];
            }

            materialToFace(material) {
                const index = this.materials.indexOf(material);
                return MATERIAL_INDEX_TO_FACE[index] || null;
            }

            validateStateString(stateStr) {
                if (typeof stateStr !== 'string' || stateStr.length !== 54) {
                    throw new Error('State must be a 54-character URFDLB string.');
                }
                if (!/^[URFDLB]{54}$/.test(stateStr)) {
                    throw new Error('State contains characters outside URFDLB.');
                }
            }

            setState(stateStr) {
                this.validateStateString(stateStr);
                this.createRubiksCube();
                STATE_FACE_ORDER.forEach((face, faceOffset) => {
                    for (let i = 0; i < 9; i++) {
                        this.setStickerFaceAt(face, i, stateStr[faceOffset * 9 + i]);
                    }
                });
                this.moveStack = [];
                document.getElementById('win-msg').style.opacity = '0';
                this._needsRender = true;
            }

            readCurrentState() {
                let state = '';
                STATE_FACE_ORDER.forEach(face => {
                    for (let i = 0; i < 9; i++) {
                        state += this.getStickerFaceAt(face, i);
                    }
                });
                return state;
            }

            stateIndex(face, stickerIndex) {
                return STATE_FACE_ORDER.indexOf(face) * 9 + stickerIndex;
            }

            _closeAllPanels() {
                document.getElementById('state-editor').classList.add('hidden');
                document.getElementById('scanner-panel').classList.add('hidden');
                this.pauseGuideAutoPlay();
                document.getElementById('solve-guide').classList.add('hidden');
                if (this.scannerAnimation) {
                    cancelAnimationFrame(this.scannerAnimation);
                    this.scannerAnimation = null;
                }
                if (this.scannerStream) {
                    this.scannerStream.getTracks().forEach(t => t.stop());
                    this.scannerStream = null;
                }
            }

            openStateEditor(options = {}) {
                this._closeAllPanels();
                const { loadFrom3D = true } = options;
                if (loadFrom3D) {
                    this.loadCurrentStateToEditor();
                } else {
                    this.renderStateEditor();
                }
                document.getElementById('state-editor').classList.remove('hidden');
            }

            openScannedStateEditor(stateStr) {
                this.validateStateString(stateStr);
                this.editorState = stateStr;
                this.openStateEditor({ loadFrom3D: false });
            }

            closeStateEditor() {
                document.getElementById('state-editor').classList.add('hidden');
            }

            loadCurrentStateToEditor() {
                this.editorState = this.readCurrentState();
                this.renderStateEditor();
            }

            resetEditorToSolved() {
                this.editorState = SOLVED_STATE;
                this.renderStateEditor();
            }

            setEditorSticker(stateIndex, faceValue) {
                const chars = this.editorState.split('');
                chars[stateIndex] = faceValue;
                this.editorState = chars.join('');
                this.renderStateEditor();
            }

            renderStateEditor() {
                this.renderPalette();
                this.renderUnfoldMap();
                this.updateEditorValidation();
            }

            renderPalette() {
                const palette = document.getElementById('color-palette');
                if (!palette) return;
                palette.innerHTML = '';
                STATE_FACE_ORDER.forEach(face => {
                    const swatch = document.createElement('button');
                    swatch.className = `swatch${this.selectedEditorFace === face ? ' active' : ''}`;
                    swatch.style.background = FACE_COLORS[face];
                    swatch.title = face;
                    swatch.setAttribute('aria-label', `選擇 ${face}`);
                    swatch.onclick = () => {
                        this.selectedEditorFace = face;
                        this.renderPalette();
                    };
                    palette.appendChild(swatch);
                });
            }

            renderUnfoldMap() {
                const map = document.getElementById('unfold-map');
                if (!map) return;
                map.innerHTML = '';
                const validation = StateValidator3.validate(this.editorState);
                const allInvalid = validation.ok ? new Set() : new Set(Array.from({ length: 54 }, (_, i) => i));

                STATE_FACE_ORDER.forEach(face => {
                    const layout = UNFOLD_LAYOUT[face];
                    for (let i = 0; i < 9; i++) {
                        const row = Math.floor(i / 3);
                        const col = i % 3;
                        const idx = this.stateIndex(face, i);
                        const sticker = document.createElement('button');
                        sticker.className = `sticker${i === 4 ? ' center' : ''}${allInvalid.has(idx) ? ' invalid' : ''}`;
                        sticker.style.gridRow = String(layout.row + row + 1);
                        sticker.style.gridColumn = String(layout.col + col + 1);
                        sticker.style.background = FACE_COLORS[this.editorState[idx]];
                        sticker.title = `${face}${i + 1}: ${this.editorState[idx]}`;
                        sticker.setAttribute('aria-label', `${face}${i + 1}`);
                        sticker.onclick = () => this.setEditorSticker(idx, this.selectedEditorFace);
                        map.appendChild(sticker);
                    }
                });
            }

            updateEditorValidation() {
                const el = document.getElementById('editor-validation');
                if (!el) return StateValidator3.validate(this.editorState);
                const validation = StateValidator3.validate(this.editorState);
                if (validation.ok) {
                    el.innerText = '狀態合法，可以套用或解題';
                    el.style.color = '#86efac';
                } else {
                    el.innerText = validation.errors[0];
                    el.style.color = '#fca5a5';
                }
                return validation;
            }

            applyEditorState() {
                const validation = this.updateEditorValidation();
                if (!validation.ok) {
                    alert(`狀態不合法：${validation.errors.join('\n')}`);
                    return false;
                }
                this.setState(this.editorState);
                return true;
            }

            async solveEditorState() {
                if (!this.applyEditorState()) return;
                this.closeStateEditor();
                await this.autoSolve();
            }

            isCameraContextAllowed() {
                return window.isSecureContext || location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
            }

            async openScanner() {
                if (this._scannerOpening) return; // prevent concurrent getUserMedia calls
                this._scannerOpening = true;
                // Close other panels without killing camera (we'll start it fresh below)
                document.getElementById('state-editor').classList.add('hidden');
                this.pauseGuideAutoPlay();
                document.getElementById('solve-guide').classList.add('hidden');
                const panel = document.getElementById('scanner-panel');
                const status = document.getElementById('scanner-status');
                panel.classList.remove('hidden');

                // ── 清除上次 face-edit / shot-review 遺留的 inline display 覆蓋 ──
                ['scanner-view','stability-bar','scan-instruction-box','live-center-hint',
                 'scan-detected-banner','scan-face-chips','scanner-motion-guide'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = '';
                });
                panel.querySelectorAll('.scanner-modes,.panel-actions').forEach(el => el.style.display = '');
                document.getElementById('face-edit-area').classList.remove('active');
                const rotPr = document.getElementById('rotation-prompt');
                if (rotPr) rotPr.classList.add('hidden');
                const shotPal = document.getElementById('shot-review-palette');
                const shotHint = document.getElementById('shot-review-hint');
                const shotAct = document.getElementById('shot-review-actions');
                if (shotPal) { shotPal.innerHTML = ''; shotPal.style.display = ''; }
                if (shotHint) { shotHint.classList.remove('active'); shotHint.style.display = ''; shotHint.style.color = ''; }
                if (shotAct) { shotAct.innerHTML = ''; shotAct.classList.remove('active'); }

                this.scanIndex = 0;
                this.scanCaptureOrder = [];
                this.scanState = this.readCurrentState().split('');
                this.scanRawPanels = [];
                this._palCache = null;
                this.scanConfirmedFaces = {};
                this.scanFacePanels = {};
                this.scanFaceUserEdits = {};
                this.faceEditState = null;
                this.faceEditOriginal = null;
                this.faceEditSelectedColor = 'U';
                this.shotReviewActive = false;
                this.shotReviewAllEdited = [];
                this.shotReviewCurrentPanels = null;
                this.shotReviewHistory = [];
                this.sessionCalib = [];
                this.scannerFrameCount = 0;
                this.scannerSmoothedRgbs = null;
                this.scannerPreviewCanvas = null;
                this.scannerPreviewCtx = null;
                this.scannerStableFrames = 0;
                this.scannerStabilityScore = 0;
                this.scannerPrevRgbs = null;
                this.scannerIsCapturing = false;
                // 隱藏偵測結果 banner 與 center hint
                const banner = document.getElementById('scan-detected-banner');
                if (banner) banner.classList.remove('show');
                const hint = document.getElementById('live-center-hint');
                if (hint) hint.classList.remove('visible');
                const fillEl = document.getElementById('stability-bar-fill');
                if (fillEl) fillEl.style.width = '0%';
                this.syncScannerModeUI();
                this.updateScannerStatus();

                if (!this.isCameraContextAllowed()) {
                    status.innerText = '鏡頭需要 HTTPS、localhost 或 file:// 安全環境';
                    return;
                }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    status.innerText = '此瀏覽器不支援 getUserMedia';
                    return;
                }

                try {
                    // Stop any existing stream/loop before opening a new one
                    if (this.scannerAnimation) { cancelAnimationFrame(this.scannerAnimation); this.scannerAnimation = null; }
                    if (this.scannerStream) { this.scannerStream.getTracks().forEach(t => t.stop()); this.scannerStream = null; }
                    this.scannerStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                    const video = document.getElementById('scanner-video');
                    video.srcObject = this.scannerStream;
                    await video.play();
                    this._scannerOpening = false;
                    this.drawScannerOverlayLoop();
                } catch (error) {
                    this._scannerOpening = false;
                    if (this.scannerStream) {
                        this.scannerStream.getTracks().forEach(t => t.stop());
                        this.scannerStream = null;
                    }
                    status.innerText = `鏡頭開啟失敗：${error.message}`;
                }
            }

            setScannerMode(mode) {
                if (!['two-shot', 'six-face'].includes(mode)) return;
                this.scannerMode = mode;
                this.scanIndex = 0;
                this.scanState = this.readCurrentState().split('');
                this.scanRawPanels = [];
                this.scannerSmoothedRgbs = null;
                this.scannerFrameCount = 0;
                this.scannerStableFrames = 0;
                this.scannerStabilityScore = 0;
                this.scannerPrevRgbs = null;
                this.scannerIsCapturing = false;
                const banner = document.getElementById('scan-detected-banner');
                if (banner) banner.classList.remove('show');
                const hint = document.getElementById('live-center-hint');
                if (hint) hint.classList.remove('visible');
                const fillEl2 = document.getElementById('stability-bar-fill');
                if (fillEl2) fillEl2.style.width = '0%';
                // only show center hint for six-face mode
                if (hint) hint.style.display = mode === 'six-face' ? '' : 'none';
                this.syncScannerModeUI();
                this.updateScannerStatus();
            }

            syncScannerModeUI() {
                const twoBtn = document.getElementById('two-shot-mode-btn');
                const sixBtn = document.getElementById('six-face-mode-btn');
                const title = document.getElementById('scanner-title');
                if (twoBtn) twoBtn.classList.toggle('active', this.scannerMode === 'two-shot');
                if (sixBtn) sixBtn.classList.toggle('active', this.scannerMode === 'six-face');
                if (title) title.innerText = this.scannerMode === 'two-shot' ? '斜角 2 張掃描' : '逐面 6 面掃描';
                this.updateScannerMotionGuide();
            }

            updateScannerMotionGuide() {
                const guide = document.getElementById('scanner-motion-guide');
                if (!guide) return;
                const active = this.scannerMode === 'two-shot';
                guide.classList.toggle('active', active);
                if (!active) return;
                const shot = TWO_SHOT_SCANS[Math.min(this.scanIndex, TWO_SHOT_SCANS.length - 1)];
                const miniCube = document.getElementById('scan-mini-cube');
                if (miniCube) miniCube.classList.toggle('flip', this.scanIndex === 1);
                const labels = {
                    'scan-mini-top': shot.panels.top,
                    'scan-mini-front': shot.panels.left,
                    'scan-mini-right': shot.panels.right,
                    'scan-target-top': shot.panels.top,
                    'scan-target-front': shot.panels.left,
                    'scan-target-right': shot.panels.right
                };
                Object.entries(labels).forEach(([id, value]) => {
                    const el = document.getElementById(id);
                    if (el) el.innerText = value;
                });
            }

            closeScanner() {
                this._scannerOpening = false;
                document.getElementById('scanner-panel').classList.add('hidden');
                this._needsRender = true; // wake Three.js back up after scanner covered it
                if (this.scannerAnimation) cancelAnimationFrame(this.scannerAnimation);
                this.scannerAnimation = null;
                if (this.scannerStream) {
                    this.scannerStream.getTracks().forEach(track => track.stop());
                    this.scannerStream = null;
                }
                this.scannerSmoothedRgbs = null;
                if (this.scannerPreviewCanvas) {
                    this.scannerPreviewCanvas.width = 0;
                    this.scannerPreviewCanvas.height = 0;
                }
                this.scannerPreviewCanvas = null;
                this.scannerPreviewCtx = null;
                this.scannerStableFrames = 0;
                this.scannerStabilityScore = 0;
                this.scannerPrevRgbs = null;
                this.scannerIsCapturing = false;
                this.pendingFacePanel = null;
                this.exitShotReview(false);
                // Clean up review/edit panels and shot history (they reset on next openScanner anyway,
                // but explicit cleanup avoids stale state if user opens a new scan mid-flow)
                const faceEditArea = document.getElementById('face-edit-area');
                if (faceEditArea) faceEditArea.classList.remove('active');
                const rotPr = document.getElementById('rotation-prompt');
                if (rotPr) rotPr.classList.add('hidden');
                this.faceEditState = null;
                this.faceEditUserEdits = null;
                this.shotReviewHistory = [];
                const banner = document.getElementById('scan-detected-banner');
                if (banner) banner.classList.remove('show');
                const hintEl = document.getElementById('live-center-hint');
                if (hintEl) hintEl.classList.remove('visible');
                const stFill = document.getElementById('stability-bar-fill');
                if (stFill) stFill.style.width = '0%';
            }

            updateScannerStatus() {
                const status = document.getElementById('scanner-status');
                const captureBtn = document.getElementById('scanner-capture-btn');
                const instructionBox = document.getElementById('scan-instruction-box');
                if (this.scannerMode === 'two-shot') {
                    const shot = TWO_SHOT_SCANS[this.scanIndex];
                    if (shot) {
                        status.innerText = `步驟 ${this.scanIndex + 1} / 2`;
                        if (instructionBox) instructionBox.innerHTML =
                            `<span class="step-badge">${this.scanIndex + 1}</span>${shot.instruction}`;
                        if (captureBtn) { captureBtn.innerText = `拍攝第 ${this.scanIndex + 1} 張`; captureBtn.disabled = false; }
                    } else {
                        status.innerText = '兩張已擷取';
                        if (instructionBox) instructionBox.innerHTML = '✓ 兩張已擷取，正在辨識顏色...';
                        if (captureBtn) { captureBtn.innerText = '處理中...'; captureBtn.disabled = true; }
                    }
                    this.updateScannerMotionGuide();
                    this.updateFaceProgressChips();
                    return;
                }
                const confirmedCount = Object.keys(this.scanConfirmedFaces).length;
                const remaining = 6 - confirmedCount;
                if (remaining > 0) {
                    status.innerText = `已確認 ${confirmedCount} / 6 面`;
                    if (instructionBox) instructionBox.innerHTML =
                        `<span class="step-badge">${confirmedCount + 1}</span>` +
                        `隨意翻面，對準鏡頭，<strong>9 格全進框</strong>後拍攝。` +
                        `<br><span style="font-size:0.8em;opacity:0.55">系統會自動辨識是哪個顏色面，方向也會自動校正</span>`;
                    if (captureBtn) { captureBtn.innerText = `拍攝第 ${confirmedCount + 1} 面`; captureBtn.disabled = false; }
                } else {
                    status.innerText = '六面已擷取';
                    if (instructionBox) instructionBox.innerHTML = '✓ 六面擷取完成，正在辨識顏色...';
                    if (captureBtn) { captureBtn.innerText = '處理中...'; captureBtn.disabled = true; }
                }
                this.updateScannerMotionGuide();
                this.updateFaceProgressChips();
            }

            updateFaceProgressChips() {
                const container = document.getElementById('scan-face-chips');
                if (!container) return;
                if (this.scannerMode === 'two-shot') {
                    container.innerHTML = TWO_SHOT_SCANS.map((shot, i) => {
                        const done = i < this.scanIndex;
                        return `<div class="scan-face-chip-item${done ? ' done' : ''}">
                            <span class="chip-dot" style="background:#22c55e"></span>
                            <span>張${i + 1}</span>
                        </div>`;
                    }).join('');
                    return;
                }
                // FREE-ORDER: chips show all 6 color faces; confirmed = filled + ✓, pending = outlined
                const COLOR_ZH = { U:'黃', R:'橙', F:'藍', D:'白', L:'紅', B:'綠' };
                container.innerHTML = STATE_FACE_ORDER.map(face => {
                    const done = !!this.scanConfirmedFaces[face];
                    const color = FACE_COLORS[face];
                    const cls = 'scan-face-chip-item' + (done ? ' done' : '');
                    const style = done
                        ? `border-color:${color};background:${color}44`
                        : `border-color:${color}55;background:transparent`;
                    return `<div class="${cls}" style="${style}">
                        <span class="chip-dot" style="background:${done ? color : 'transparent'};border:2px solid ${color};box-sizing:border-box"></span>
                        <span>${COLOR_ZH[face]}${done ? ' ✓' : ''}</span>
                    </div>`;
                }).join('');
            }

            drawScannerOverlayLoop() {
                const canvas = document.getElementById('scanner-overlay');
                const rect = canvas.getBoundingClientRect();
                const needW = Math.max(1, Math.round(rect.width));
                const needH = Math.max(1, Math.round(rect.height));
                if (canvas.width !== needW || canvas.height !== needH) {
                    canvas.width = needW;
                    canvas.height = needH;
                }
                const ctx = canvas.getContext('2d');
                if (!ctx) { this.scannerAnimation = requestAnimationFrame(() => this.drawScannerOverlayLoop()); return; }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // 節流：約每 6 幀才做像素採樣（~10fps at 60fps）
                this.scannerFrameCount = (this.scannerFrameCount || 0) + 1;
                if (this.scannerFrameCount % 6 === 0) {
                    this.updateScannerPreviewRgbs(canvas.width, canvas.height);
                }
                if (this.scannerMode === 'two-shot') {
                    this.drawTwoShotOverlay(ctx, canvas.width, canvas.height);
                } else {
                    this.drawSingleFaceOverlay(ctx, canvas.width, canvas.height);
                }
                this.scannerAnimation = requestAnimationFrame(() => this.drawScannerOverlayLoop());
            }

            updateScannerPreviewRgbs(width, height) {
                const video = document.getElementById('scanner-video');
                if (!video || !video.videoWidth || !video.videoHeight) return;
                if (!this.scannerPreviewCanvas) {
                    this.scannerPreviewCanvas = document.createElement('canvas');
                    this.scannerPreviewCtx = this.scannerPreviewCanvas.getContext('2d', { willReadFrequently: true });
                }
                if (this.scannerPreviewCanvas.width !== video.videoWidth ||
                        this.scannerPreviewCanvas.height !== video.videoHeight) {
                    this.scannerPreviewCanvas.width = video.videoWidth;
                    this.scannerPreviewCanvas.height = video.videoHeight;
                }
                this.scannerPreviewCtx.drawImage(video, 0, 0);
                const mapPoint = this.getVideoCoverMapper(video, width, height);
                const ALPHA = 0.35;
                const STABLE_THRESH = 10;
                const STABLE_NEEDED = 20;

                let cells;
                if (this.scannerMode === 'six-face') {
                    const size = Math.min(width, height) * 0.62;
                    const x0 = (width - size) / 2, y0 = (height - size) / 2;
                    cells = [];
                    for (let row = 0; row < 3; row++) {
                        for (let col = 0; col < 3; col++) {
                            const op = { x: x0 + (col + 0.5) * size / 3, y: y0 + (row + 0.5) * size / 3 };
                            cells.push(this.readStickerRgb(this.scannerPreviewCtx, mapPoint(op)));
                        }
                    }
                    if (!this.scannerSmoothedRgbs || this.scannerSmoothedRgbs.length !== 9) {
                        this.scannerSmoothedRgbs = cells.map(c => ({ ...c }));
                    } else {
                        cells.forEach((c, i) => {
                            const s = this.scannerSmoothedRgbs[i];
                            s.r = s.r * (1 - ALPHA) + c.r * ALPHA;
                            s.g = s.g * (1 - ALPHA) + c.g * ALPHA;
                            s.b = s.b * (1 - ALPHA) + c.b * ALPHA;
                        });
                    }
                } else {
                    const panels = this.getTwoShotPanels(width, height);
                    cells = [];
                    ['top', 'left', 'right'].forEach(key => {
                        const corners = panels[key].corners;
                        for (let row = 0; row < 3; row++) {
                            for (let col = 0; col < 3; col++) {
                                const op = this.bilinearPoint(corners, (col + 0.5) / 3, (row + 0.5) / 3);
                                cells.push(this.readStickerRgb(this.scannerPreviewCtx, mapPoint(op)));
                            }
                        }
                    });
                    if (!this.scannerSmoothedRgbs || this.scannerSmoothedRgbs.length !== 27) {
                        this.scannerSmoothedRgbs = cells.map(c => ({ ...c }));
                    } else {
                        cells.forEach((c, i) => {
                            const s = this.scannerSmoothedRgbs[i];
                            s.r = s.r * (1 - ALPHA) + c.r * ALPHA;
                            s.g = s.g * (1 - ALPHA) + c.g * ALPHA;
                            s.b = s.b * (1 - ALPHA) + c.b * ALPHA;
                        });
                    }
                }

                // ── stability detection ──────────────────────────────────────
                if (this.scannerPrevRgbs && this.scannerPrevRgbs.length === cells.length) {
                    let totalDelta = 0;
                    cells.forEach((c, i) => {
                        const p = this.scannerPrevRgbs[i];
                        totalDelta += Math.abs(c.r - p.r) + Math.abs(c.g - p.g) + Math.abs(c.b - p.b);
                    });
                    const avgDelta = totalDelta / (cells.length * 3);
                    if (avgDelta < STABLE_THRESH) {
                        this.scannerStableFrames = Math.min(this.scannerStableFrames + 1, STABLE_NEEDED);
                    } else {
                        this.scannerStableFrames = Math.max(0, this.scannerStableFrames - 2);
                    }
                } else {
                    this.scannerStableFrames = 0;
                }
                this.scannerStabilityScore = this.scannerStableFrames / STABLE_NEEDED;
                this.scannerPrevRgbs = cells.map(c => ({ ...c }));

                const fillEl = document.getElementById('stability-bar-fill');
                if (fillEl) fillEl.style.width = Math.round(this.scannerStabilityScore * 100) + '%';

                // ── auto-capture trigger ─────────────────────────────────────
                if (this.scannerAutoCapture && this.scannerStabilityScore >= 1.0 && !this.scannerIsCapturing && !this.pendingFacePanel) {
                    this.scannerIsCapturing = true;
                    this.scannerStableFrames = 0;
                    this.scannerStabilityScore = 0;
                    if (fillEl) fillEl.style.width = '0%';
                    setTimeout(() => {
                        this.captureScannerFrame();
                        setTimeout(() => { this.scannerIsCapturing = false; }, 2500);
                    }, 0);
                }
            }

            drawSingleFaceOverlay(ctx, width, height) {
                const size = Math.min(width, height) * 0.62;
                const x0 = (width - size) / 2;
                const y0 = (height - size) / 2;
                const cellSize = size / 3;
                const palette = this.buildProgressivePalette();

                // 即時色彩格子（Lab + 漸進式調色板）
                if (this.scannerSmoothedRgbs && this.scannerSmoothedRgbs.length === 9) {
                    this.scannerSmoothedRgbs.forEach((rgb, idx) => {
                        const row = Math.floor(idx / 3), col = idx % 3;
                        const face = this.classifyRgbWithCalibration(rgb, palette);
                        const color = FACE_COLORS[face] || '#888888';
                        const cx = x0 + col * cellSize, cy = y0 + row * cellSize;
                        const pad = 4;
                        ctx.fillStyle = color + 'b0';
                        ctx.beginPath();
                        ctx.roundRect(cx + pad, cy + pad, cellSize - pad * 2, cellSize - pad * 2, 4);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(0,0,0,0.72)';
                        ctx.font = `700 ${Math.round(cellSize * 0.26)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(face, x0 + (col + 0.5) * cellSize, y0 + (row + 0.5) * cellSize);
                    });

                    // ── stability arc on center cell ─────────────────────────
                    const score = this.scannerStabilityScore || 0;
                    if (score > 0.04) {
                        const arcCx = x0 + 1.5 * cellSize;
                        const arcCy = y0 + 1.5 * cellSize;
                        const arcR = cellSize * 0.36;
                        const arcColor = score < 0.6 ? '#facc15' : score < 0.95 ? '#86efac' : '#22c55e';
                        ctx.save();
                        ctx.strokeStyle = arcColor;
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.globalAlpha = 0.85;
                        ctx.beginPath();
                        ctx.arc(arcCx, arcCy, arcR, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * score);
                        ctx.stroke();
                        ctx.restore();
                    }

                    // ── live center hint DOM update ──────────────────────────
                    const centerRgb = this.scannerSmoothedRgbs[4];
                    if (centerRgb) {
                        const detectedFace = this.classifyRgbWithCalibration(centerRgb, palette);
                        const hintEl = document.getElementById('live-center-hint');
                        const swatchEl = document.getElementById('live-center-hint-swatch');
                        const textEl = document.getElementById('live-center-hint-text');
                        if (hintEl && swatchEl && textEl) {
                            hintEl.classList.add('visible');
                            swatchEl.style.background = FACE_COLORS[detectedFace] || '#888';
                            textEl.textContent = '正在看：' + (FACE_NAMES_ZH[detectedFace] || detectedFace + ' 面');
                        }
                    }
                }

                // 網格線
                ctx.strokeStyle = 'rgba(134, 239, 172, 0.95)';
                ctx.lineWidth = 2;
                ctx.lineCap = 'butt';
                for (let i = 0; i <= 3; i++) {
                    const p = i * cellSize;
                    ctx.beginPath();
                    ctx.moveTo(x0 + p, y0);
                    ctx.lineTo(x0 + p, y0 + size);
                    ctx.moveTo(x0, y0 + p);
                    ctx.lineTo(x0 + size, y0 + p);
                    ctx.stroke();
                }
            }

            getTwoShotPanels(width, height) {
                const size = Math.min(width, height) * 0.44;
                const cx = width / 2;
                const cy = height * 0.46;
                const halfWidth = size * 0.79;
                const top        = { x: cx,             y: cy - size * 0.86 };
                const right      = { x: cx + halfWidth, y: cy - size * 0.43 };
                const center     = { x: cx,             y: cy + size * 0.02 };
                const left       = { x: cx - halfWidth, y: cy - size * 0.43 };
                const bottomRight = { x: cx + halfWidth, y: cy + size * 0.68 };
                const bottom     = { x: cx,             y: cy + size * 1.10 };
                const bottomLeft  = { x: cx - halfWidth, y: cy + size * 0.68 };
                return {
                    top: { corners: [top, right, center, left] },
                    left: { corners: [left, center, bottom, bottomLeft] },
                    right: { corners: [center, right, bottomRight, bottom] }
                };
            }

            drawTwoShotOverlay(ctx, width, height) {
                const shot = TWO_SHOT_SCANS[this.scanIndex] || TWO_SHOT_SCANS[0];
                const panels = this.getTwoShotPanels(width, height);
                const palette = this.buildProgressivePalette();
                ctx.lineWidth = 2;
                ctx.font = '700 18px system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 效能：快取每格的分類結果，避免每幀對同一個 smoothed RGB 重算 6 次（10fps 採樣 / 60fps RAF）
                if (!this._classifyCache || this._classifyCache.length !== 27) this._classifyCache = new Array(27);
                Object.entries(panels).forEach(([key, panel], panelIdx) => {
                    const face = shot.panels[key];
                    // 即時色彩格子（Lab 漸進式調色板）
                    if (this.scannerSmoothedRgbs && this.scannerSmoothedRgbs.length === 27) {
                        const base = panelIdx * 9;
                        for (let row = 0; row < 3; row++) {
                            for (let col = 0; col < 3; col++) {
                                const idx = base + row * 3 + col;
                                const rgb = this.scannerSmoothedRgbs[idx];
                                let cached = this._classifyCache[idx];
                                if (!cached || cached.r !== rgb.r || cached.g !== rgb.g || cached.b !== rgb.b
                                        || cached.paletteVer !== this._palCacheKey) {
                                    cached = {
                                        r: rgb.r, g: rgb.g, b: rgb.b,
                                        paletteVer: this._palCacheKey,
                                        face: this.classifyRgbWithCalibration(rgb, palette),
                                    };
                                    this._classifyCache[idx] = cached;
                                }
                                const detectedFace = cached.face;
                                const color = FACE_COLORS[detectedFace] || '#888888';
                                const tl = this.bilinearPoint(panel.corners, col / 3, row / 3);
                                const tr = this.bilinearPoint(panel.corners, (col + 1) / 3, row / 3);
                                const bl = this.bilinearPoint(panel.corners, col / 3, (row + 1) / 3);
                                const br = this.bilinearPoint(panel.corners, (col + 1) / 3, (row + 1) / 3);
                                ctx.fillStyle = color + 'a8';
                                ctx.beginPath();
                                ctx.moveTo(tl.x, tl.y);
                                ctx.lineTo(tr.x, tr.y);
                                ctx.lineTo(br.x, br.y);
                                ctx.lineTo(bl.x, bl.y);
                                ctx.closePath();
                                ctx.fill();
                            }
                        }
                    }
                    this.drawScannerPanelGrid(ctx, panel.corners);
                    const center = this.bilinearPoint(panel.corners, 0.5, 0.5);
                    ctx.fillStyle = 'rgba(2, 10, 7, 0.75)';
                    ctx.beginPath();
                    ctx.arc(center.x, center.y, 17, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#dcfce7';
                    ctx.fillText(face, center.x, center.y);
                });

                // stability arc on center-of-screen (two-shot overall)
                const score = this.scannerStabilityScore || 0;
                if (score > 0.04) {
                    const arcCx = width / 2;
                    const arcCy = height * 0.51;
                    const arcR = Math.min(width, height) * 0.34 * 0.15;
                    const arcColor = score < 0.6 ? '#facc15' : score < 0.95 ? '#86efac' : '#22c55e';
                    ctx.save();
                    ctx.strokeStyle = arcColor;
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    ctx.globalAlpha = 0.85;
                    ctx.beginPath();
                    ctx.arc(arcCx, arcCy, arcR, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * score);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            drawScannerPanelGrid(ctx, corners) {
                ctx.strokeStyle = 'rgba(134, 239, 172, 0.95)';
                for (let i = 0; i <= 3; i++) {
                    const t = i / 3;
                    const top = this.lerpPoint(corners[0], corners[1], t);
                    const bottom = this.lerpPoint(corners[3], corners[2], t);
                    const left = this.lerpPoint(corners[0], corners[3], t);
                    const right = this.lerpPoint(corners[1], corners[2], t);
                    ctx.beginPath();
                    ctx.moveTo(top.x, top.y);
                    ctx.lineTo(bottom.x, bottom.y);
                    ctx.moveTo(left.x, left.y);
                    ctx.lineTo(right.x, right.y);
                    ctx.stroke();
                }
            }

            lerpPoint(a, b, t) {
                return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
            }

            bilinearPoint(corners, u, v) {
                const top = this.lerpPoint(corners[0], corners[1], u);
                const bottom = this.lerpPoint(corners[3], corners[2], u);
                return this.lerpPoint(top, bottom, v);
            }

            getVideoCoverMapper(video, displayWidth, displayHeight) {
                const scale = Math.max(displayWidth / video.videoWidth, displayHeight / video.videoHeight);
                const drawnWidth = video.videoWidth * scale;
                const drawnHeight = video.videoHeight * scale;
                const offsetX = (displayWidth - drawnWidth) / 2;
                const offsetY = (displayHeight - drawnHeight) / 2;
                return point => ({
                    x: (point.x - offsetX) / scale,
                    y: (point.y - offsetY) / scale
                });
            }

            getScannerDisplaySize() {
                const overlay = document.getElementById('scanner-overlay');
