            getIntersects(event, object) {
                const rect = this.renderer.domElement.getBoundingClientRect();
                this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                this.raycaster.setFromCamera(this.mouse, this.camera);
                return this.raycaster.intersectObjects(object);
            }

            onPointerDown(event) {
                if (this.isAnimating || this.isSolving) return;

                const intersects = this.getIntersects(event, this.cubes);
                
                if (intersects.length > 0 && !this.isCubeLocked) {
                    this.controls.enabled = false; 
                    this.isDragging = true;
                    this.intersectedCube = intersects[0].object;
                    this.intersectedFaceNormal = intersects[0].face.normal.clone();
                    this.intersectedFaceNormal.transformDirection(this.intersectedCube.matrixWorld).round();
                    this.startPos.set(event.clientX, event.clientY);
                } else {
                    this.controls.enabled = true;
                }
            }

            onPointerMove(event) {
                if (!this.isDragging || !this.intersectedCube) return;
                const dx = event.clientX - this.startPos.x;
                const dy = event.clientY - this.startPos.y;
                if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
                    this.handleMove(dx, dy);
                    this.isDragging = false; 
                    this.controls.enabled = true; 
                }
            }

            onPointerUp() {
                this.isDragging = false;
                this.controls.enabled = true; 
            }

            handleMove(dx, dy) {
                let moveAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
                let direction = moveAxis === 'x' ? Math.sign(dx) : Math.sign(dy);

                const pos = this.intersectedCube.position.clone().round();
                const normal = this.intersectedFaceNormal;

                let rotateAxis = 'y';
                let sliceVal = 0;
                let angleDir = 1;

                if (Math.abs(normal.x) > 0.5) {
                    rotateAxis = moveAxis === 'y' ? 'z' : 'y';
                    sliceVal = moveAxis === 'y' ? pos.z : pos.y;
                    angleDir = normal.x * (moveAxis === 'y' ? -direction : direction);
                }
                else if (Math.abs(normal.y) > 0.5) {
                    rotateAxis = moveAxis === 'y' ? 'x' : 'z';
                    sliceVal = moveAxis === 'y' ? pos.x : pos.z;
                    angleDir = normal.y * (moveAxis === 'y' ? direction : -direction);
                }
                else if (Math.abs(normal.z) > 0.5) {
                    rotateAxis = moveAxis === 'y' ? 'x' : 'y';
                    sliceVal = moveAxis === 'y' ? pos.x : pos.y;
                    angleDir = normal.z * (moveAxis === 'y' ? direction : -direction);
                }

                // 使用者操作，記錄到堆疊
                this.rotateSlice(rotateAxis, sliceVal, angleDir * Math.PI / 2, true, true);
            }

            // --- 核心動作執行 ---

            rotateSlice(axis, val, angle, animate = true, record = true) {
                if (this.isAnimating && animate) return;
                this.isAnimating = true;

                // 數值校正
                const safeVal = Math.round(val);
                // 將角度標準化為 90 度的倍數 (-1, 0, 1, 2)
                const steps = Math.round(angle / (Math.PI/2));
                const safeAngle = steps * (Math.PI/2);

                if (steps === 0) {
                    this.isAnimating = false;
                    return;
                }

                if (record) {
                    // 記錄動作：{ 軸, 層, 轉幾下 }
                    this.moveStack.push({ axis, val: safeVal, dir: steps });
                }

                const activeCubes = [];
                this.cubes.forEach(cube => {
                    const localPos = cube.position.clone().round();
                    if (Math.abs(localPos[axis] - safeVal) < 0.1) {
                        activeCubes.push(cube);
                    }
                });

                this.pivot.rotation.set(0, 0, 0);
                this.pivot.position.set(0, 0, 0);
                this.scene.add(this.pivot);

                activeCubes.forEach(cube => this.pivot.attach(cube));

                if (animate) {
                    const duration = this.isSolving ? (this.guideAnimMs || 150) : 250;
                    const startAuth = performance.now();
                    
                    const animateRotation = (time) => {
                        const elapsed = time - startAuth;
                        const progress = Math.min(elapsed / duration, 1);
                        const ease = 1 - Math.pow(1 - progress, 3);

                        this.pivot.rotation[axis] = safeAngle * ease;

                        if (progress < 1) {
                            requestAnimationFrame(animateRotation);
                        } else {
                            this.finalizeRotation(activeCubes, axis, safeAngle);
                            // 自動解題過程不檢查 Win，直到最後
                            if (!this.isSolving) this.checkWin(); 
                        }
                    };
                    requestAnimationFrame(animateRotation);
                } else {
                    this.pivot.rotation[axis] = safeAngle;
                    this.finalizeRotation(activeCubes, axis, safeAngle);
                    this.isAnimating = false;
                    if (!this.isSolving) this.checkWin();
                }
            }

            finalizeRotation(activeCubes, axis, angle) {
                this.pivot.updateMatrixWorld();
                activeCubes.forEach(cube => {
                    this.scene.attach(cube);
                    cube.position.round();
                    // 確保旋轉矩陣是乾淨的 90度倍數
                    // 直接重置旋轉，因為我們知道是 90 度整數倍，防止浮點誤差累積
                    const euler = new THREE.Euler().setFromQuaternion(cube.quaternion);
                    cube.rotation.x = Math.round(euler.x / (Math.PI/2)) * (Math.PI/2);
                    cube.rotation.y = Math.round(euler.y / (Math.PI/2)) * (Math.PI/2);
                    cube.rotation.z = Math.round(euler.z / (Math.PI/2)) * (Math.PI/2);
                    cube.updateMatrixWorld();
                });
                this.isAnimating = false;
                this._needsRender = true;
            }

            // --- 核心重構：打亂與自動解題 ---

            shuffle() {
                if(this.isAnimating || this.isSolving) return;
                document.getElementById('win-msg').style.opacity = '0';
                
                // 如果已經解完了，先清空歷史，從乾淨狀態開始
                if (this.checkIsSolved(false)) {
                    this.moveStack = [];
                }

                const axes = ['x', 'y', 'z'];
                const indices = [-1, 0, 1];
                const dirs = [1, -1];
                const totalMoves = 25; 

                for(let i=0; i<totalMoves; i++) {
                     const axis = axes[Math.floor(Math.random() * axes.length)];
                     const idx = indices[Math.floor(Math.random() * indices.length)];
                     const dir = dirs[Math.floor(Math.random() * dirs.length)];
                     // 重要：Shuffle 必須記錄到 stack，這樣我們才能逆推
                     this.rotateSlice(axis, idx, dir * Math.PI / 2, false, true);
                }
            }

            // 深度優化算法：消除冗餘與穿透合併
            optimizeMoveStack(rawMoves) {
                // 1. 轉換為反向操作 (還原路徑)
                let moves = rawMoves.map(m => ({
                    axis: m.axis,
                    val: m.val,
                    dir: -m.dir // 反轉方向
                })).reverse();

                // 2. 多次掃描合併
                let hasChanged = true;
                let iterations = 0;
                
                while (hasChanged && iterations < 10) {
                    hasChanged = false;
                    const nextMoves = [];
                    const skipIdx = new Set();

                    for (let i = 0; i < moves.length; i++) {
                        if (skipIdx.has(i)) continue;

                        let current = moves[i];
                        let merged = false;

                        for (let j = i + 1; j < moves.length; j++) {
                            if (skipIdx.has(j)) continue;
                            const next = moves[j];

                            // 相同軸
                            if (current.axis === next.axis) {
                                // 相同層：可以合併
                                if (current.val === next.val) {
                                    current.dir += next.dir;
                                    // 標記 j 被合併了
                                    skipIdx.add(j);
                                    // 檢查 current 是否歸零
                                    if (current.dir % 4 === 0) {
                                        merged = true; // current 也消失了
                                        hasChanged = true;
                                        break; // 停止這個 current 的搜尋
                                    }
                                    hasChanged = true;
                                    // 繼續用更新後的 current 往後找
                                } 
                                // 不同層 (例如 左層 vs 右層)：互不影響 (Commutative)，可以穿透
                                else {
                                    continue; // 跳過這個 next，繼續往後看
                                }
                            } else {
                                // 不同軸：互相卡住，無法穿透
                                break; 
                            }
                        }

                        if (!merged && (current.dir % 4 !== 0)) {
                            // 規範化方向 (-3 -> 1, 3 -> -1)
                            let d = current.dir % 4;
                            if (d === 3) d = -1;
                            if (d === -3) d = 1;
                            current.dir = d;
                            nextMoves.push(current);
                        }
                    }
                    moves = nextMoves;
                    iterations++;
                }
                return moves;
            }

            notationToRotation(notation) {
                const match = notation.match(/^([URFDLB])([2']?)$/);
                if (!match) throw new Error(`不支援的 3×3 notation：${notation}`);
                const base = MOVE_TO_ROTATION[match[1]];
                let turns = 1;
                if (match[2] === "'") turns = -1;
                if (match[2] === '2') turns = 2;
                return {
                    axis: base.axis,
                    val: base.val,
                    angle: base.dir * turns * Math.PI / 2
                };
            }

            waitForAnimationEnd() {
                return new Promise(resolve => {
                    const check = () => {
                        if (!this.isAnimating) resolve();
                        else requestAnimationFrame(check);
                    };
                    check();
                });
            }

            async applyNotationMove(notation, animate = true) {
                const match = notation.match(/^([URFDLB])([2']?)$/);
                if (animate && match && match[2] === '2') {
                    // 雙格轉：分兩段 90° 動畫，中間加停頓讓使用者看清楚是轉兩下
                    const base = MOVE_TO_ROTATION[match[1]];
                    const halfAngle = base.dir * Math.PI / 2;
                    this.rotateSlice(base.axis, base.val, halfAngle, true, false);
                    await this.waitForAnimationEnd();
                    await new Promise(r => setTimeout(r, Math.round((this.guideAnimMs || 180) * 0.8)));
                    this.rotateSlice(base.axis, base.val, halfAngle, true, false);
                    await this.waitForAnimationEnd();
                } else {
                    const move = this.notationToRotation(notation);
                    this.rotateSlice(move.axis, move.val, move.angle, animate, false);
                    if (animate) await this.waitForAnimationEnd();
                }
            }

            async buildSolutionForCurrentState(onStatus = () => {}) {
                const state = this.readCurrentState();
                const validation = StateValidator3.validate(state);
                if (!validation.ok) throw new Error(validation.errors.join('\n'));
                return await this.solver.solve(state, onStatus);
            }

            startSolveGuide(moves) {
                this._closeAllPanels();
                this.guideMoves = moves.slice();
                this.guideIndex = 0;
                this.executedGuideMoves = [];
                this.isGuideAutoPlaying = false;
                document.getElementById('solve-guide').classList.remove('hidden');
                this.updateSolveGuide();
            }

            closeSolveGuide() {
                this.pauseGuideAutoPlay();
                document.getElementById('solve-guide').classList.add('hidden');
            }

            updateSolveGuide() {
                const notation = document.getElementById('guide-notation');
                const progress = document.getElementById('guide-progress');
                const playBtn = document.getElementById('guide-play-btn');
                if (!notation || !progress || !playBtn) return;

                const done = this.guideIndex >= this.guideMoves.length && this.guideMoves.length > 0;
                const notStarted = this.guideIndex === 0 && (this.executedGuideMoves || []).length === 0;

                if (this.guideMoves.length === 0) {
                    notation.innerText = '-';
                    progress.innerText = '尚未載入解法';
                } else if (done) {
                    notation.innerText = '✓';
                    progress.innerText = '解題完成！';
                } else {
                    const current = this.guideMoves[this.guideIndex];
                    notation.innerText = current ? current.notation : '?';
                    progress.innerText = notStarted
                        ? `共 ${this.guideMoves.length} 步，按開始播放`
                        : `第 ${this.guideIndex + 1} / ${this.guideMoves.length} 步`;
                }

                if (this.isGuideAutoPlaying) {
                    playBtn.innerText = '⏸ 暫停';
                } else if (done) {
                    playBtn.innerText = '✓ 已完成';
                } else if (notStarted) {
                    playBtn.innerText = '▶ 開始解題';
                } else {
                    playBtn.innerText = '▶ 繼續';
                }
            }

            async nextGuideStep(animate = true) {
                if (this.isAnimating || this.guideIndex >= this.guideMoves.length) {
                    if (this.guideIndex >= this.guideMoves.length) this.pauseGuideAutoPlay();
                    return false;
                }
                const move = this.guideMoves[this.guideIndex];
                // 動畫開始前先顯示當前步號，避免顯示跑快一步
                const notationEl = document.getElementById('guide-notation');
                const progressEl = document.getElementById('guide-progress');
                if (notationEl) notationEl.innerText = move.notation;
                if (progressEl) progressEl.innerText = `第 ${this.guideIndex + 1} / ${this.guideMoves.length} 步`;
                await this.applyNotationMove(move.notation, animate);
                this.executedGuideMoves.push(move.notation);
                this.guideIndex++;
                this.updateSolveGuide();
                if (this.guideIndex >= this.guideMoves.length) {
                    this.pauseGuideAutoPlay();
                    this.checkWin();
                }
                return true;
            }

            async previousGuideStep(animate = true) {
                if (this.isAnimating || this.executedGuideMoves.length === 0) return false;
                this.pauseGuideAutoPlay();
                const last = this.executedGuideMoves.pop();
                await this.applyNotationMove(this.inverseNotation(last), animate);
                this.guideIndex = Math.max(0, this.guideIndex - 1);
                this.updateSolveGuide();
                return true;
            }

            pauseGuideAutoPlay() {
                this.isGuideAutoPlaying = false;
                this.updateSolveGuide();
            }

            setGuideSpeed(speed) {
                if (speed === 'slow')      { this.guideAnimMs = 350; this.guideDelayMs = 1200; }
                else if (speed === 'fast') { this.guideAnimMs = 80;  this.guideDelayMs = 80; }
                else                       { this.guideAnimMs = 180; this.guideDelayMs = 600; }
                document.querySelectorAll('.guide-speed-btn').forEach(b => b.classList.remove('active'));
                const active = document.getElementById('guide-speed-' + speed);
                if (active) active.classList.add('active');
            }

            async toggleGuideAutoPlay() {
                if (this.isGuideAutoPlaying) {
                    this.pauseGuideAutoPlay();
                    return;
                }
                if (this.guideIndex >= this.guideMoves.length) return; // already done
                this.isGuideAutoPlaying = true;
                this.isSolving = true; // block drag + enable fast animation during playback
                this.updateSolveGuide();
                try {
                    while (this.isGuideAutoPlaying && this.guideIndex < this.guideMoves.length) {
                        const moved = await this.nextGuideStep(true);
                        if (!moved) break;
                        if (this.isGuideAutoPlaying && this.guideIndex < this.guideMoves.length) {
                            await new Promise(resolve => setTimeout(resolve, this.guideDelayMs));
                        }
                    }
                } finally {
                    this.isSolving = false; // always restore — even if nextGuideStep throws
                    this.pauseGuideAutoPlay();
                }
            }

            // 集中所有「掃描完成 → 設狀態 → 自動解題」的入口，提供：
            // 1. 診斷 log（可在 console 過濾 [SCAN]）
            // 2. localStorage 持久化，掃描結果不會因為解題失敗而消失
            // 3. autoSolve 失敗時把實際錯誤顯示給使用者（之前是 unhandled promise rejection 悄悄吃掉）
            async _finishScanAndSolve(state, source) {
                console.log(`[SCAN][${source}] state = ${state}`);
                console.log(`[SCAN][${source}] facets = U:${state.slice(0,9)} R:${state.slice(9,18)} F:${state.slice(18,27)} D:${state.slice(27,36)} L:${state.slice(36,45)} B:${state.slice(45,54)}`);
                try {
                    localStorage.setItem('rubiks_last_scan', JSON.stringify({
                        state, source, timestamp: Date.now()
                    }));
                } catch (e) { console.warn('[SCAN] localStorage 寫入失敗', e); }

                try {
                    this.setState(state);
                    console.log(`[SOLVE][${source}] setState 完成，準備呼叫 autoSolve...`);
                    await this.autoSolve();
                    console.log(`[SOLVE][${source}] autoSolve 完成`);
                } catch (error) {
                    console.error(`[SOLVE][${source}] 失敗:`, error);
                    alert(`解題失敗：${error.message}\n\n你的掃描結果已保留在 localStorage（rubiks_last_scan），可隨時回讀。`);
                }
            }

            // 讀回最後一次掃描的狀態（給診斷/重試用）
            loadLastScannedState() {
                try {
                    const raw = localStorage.getItem('rubiks_last_scan');
                    if (!raw) { alert('沒有上次掃描紀錄'); return; }
                    const data = JSON.parse(raw);
                    const ago = Math.round((Date.now() - data.timestamp) / 1000);
                    const minutes = Math.floor(ago / 60);
                    const ageStr = minutes > 0 ? `${minutes} 分${ago % 60} 秒前` : `${ago} 秒前`;
                    const ok = confirm(
                        `上次掃描狀態（${data.source}，${ageStr}）：\n\n` +
                        `${data.state.match(/.{9}/g).map((f, i) => STATE_FACE_ORDER[i] + ': ' + f).join('\n')}\n\n` +
                        `要套用到 3D 模型並開始解題嗎？`
                    );
                    if (ok) {
                        console.log(`[SCAN][reload] state = ${data.state}`);
                        this._finishScanAndSolve(data.state, 'reload');
                    }
                } catch (e) {
                    alert('讀取失敗：' + e.message);
                }
            }

            async autoSolve() {
                const solveBtnText = document.getElementById('solve-text');
                if (this.isAnimating || this.isSolving) return;

                this.isSolving = true;
                solveBtnText.innerText = "讀取狀態...";
                document.getElementById('win-msg').style.opacity = '0';

                try {
                    console.log('[SOLVE] 當前狀態:', this.readCurrentState());
                    const solution = await this.buildSolutionForCurrentState(message => {
                        console.log('[SOLVE] 進度:', message);
                        solveBtnText.innerText = message;
                    });
                    console.log(`[SOLVE] 解法產生：${solution.moves.length} 步`,
                        solution.moves.slice(0, 20).map(m => m.notation || m).join(' ') + (solution.moves.length > 20 ? '...' : ''));

                    if (solution.moves.length === 0) {
                        solveBtnText.innerText = "已完成";
                        this.checkWin();
                        return;
                    }

                    this.startSolveGuide(solution.moves);
                    console.log('[SOLVE] 解題方案已載入，等待使用者按下開始');
                } catch (error) {
                    console.error('[SOLVE] 失敗:', error);
                    solveBtnText.innerText = "解題失敗";
                    alert(`解題失敗：${error.message}\n\n（按 F12 開 console 看詳細訊息）`);
                } finally {
                    this.isSolving = false;
                    if (solveBtnText.innerText !== '已完成') solveBtnText.innerText = '自動解題';
                }
            }

            reset() {
                 this.createRubiksCube();
                 document.getElementById('win-msg').style.opacity = '0';
            }

            checkIsSolved(triggerEffect = true) {
                try {
                    const expectedByFace = {};
                    STATE_FACE_ORDER.forEach(face => {
                        expectedByFace[face] = this.getStickerFaceAt(face, 4);
                    });

                    for (const face of STATE_FACE_ORDER) {
                        for (let i = 0; i < 9; i++) {
                            if (this.getStickerFaceAt(face, i) !== expectedByFace[face]) {
                                return false;
                            }
                        }
                    }
                    return true;
                } catch (error) {
                    console.error('Solved-state check failed:', error);
                    return false;
                }
            }

            checkWin() {
                if (this.checkIsSolved(true)) {
                    this.triggerWin();
                    // 勝利後清空歷史，防止再點自動解題出錯
                    this.moveStack = []; 
                }
            }

            // Phase 7：迴歸測試（針對近期修正：wireframe / _tryAutoOrientFaces / center click）
            async runPhase7Tests(options = {}) {
                const started = performance.now();
                const results = [];
                const run = (name, fn) => {
                    const t0 = performance.now();
                    fn();
                    results.push({ name, ms: Math.round((performance.now() - t0) * 100) / 100 });
                };

                try {
                    // ── T7-1：wireframe 幾何（6 種螢幕尺寸全部界內 + 比例符合照片）
                    // getTwoShotPanels 回傳 {top:{corners:[t,r,c,l]}, left:{corners:[l,c,b,bl]}, right:{corners:[c,r,br,b]}}
                    run('T7-1 wireframe 幾何 6 種螢幕', () => {
                        const SCREENS = [
                            { name: 'Pixel 7',     W: 412, H: 637 },
                            { name: 'iPhone 13',   W: 390, H: 664 },
                            { name: 'Android S21', W: 360, H: 680 },
                            { name: 'iPad',        W: 768, H: 1024 },
                            { name: 'Desktop',     W: 760, H: 570 },
                            { name: 'Pixel 8a',    W: 411, H: 599 },
                        ];
                        SCREENS.forEach(s => {
                            const p = this.getTwoShotPanels(s.W, s.H);
                            // 收集所有獨特角點
                            const allPts = [
                                ...p.top.corners,
                                p.left.corners[2], p.left.corners[3], // bottom, bottomLeft
                                p.right.corners[2],                    // bottomRight
                            ];
                            allPts.forEach((pt, idx) => {
                                this.assertTest(pt && typeof pt.x === 'number' && typeof pt.y === 'number',
                                    `${s.name} 點${idx} 結構錯誤`);
                                this.assertTest(pt.x >= 0 && pt.x <= s.W && pt.y >= 0 && pt.y <= s.H,
                                    `${s.name} 點${idx} (${pt.x.toFixed(0)},${pt.y.toFixed(0)}) 超出 ${s.W}×${s.H}`);
                            });
                        });
                        // 手機豎拍比例驗證（iPhone 13 標準）
                        const phone = this.getTwoShotPanels(390, 664);
                        const topPt = phone.top.corners[0];      // top vertex
                        const rightPt = phone.top.corners[1];    // right outer
                        const leftPt = phone.top.corners[3];     // left outer
                        const bottomPt = phone.left.corners[2];  // bottom vertex
                        const topPct = topPt.y / 664 * 100;
                        const botPct = bottomPt.y / 664 * 100;
                        const spanPct = (rightPt.x - leftPt.x) / 390 * 100;
                        this.assertTest(topPct >= 20 && topPct <= 27, `iPhone13 top=${topPct.toFixed(1)}% 不在 20-27%`);
                        this.assertTest(botPct >= 70 && botPct <= 80, `iPhone13 bot=${botPct.toFixed(1)}% 不在 70-80%`);
                        this.assertTest(spanPct >= 65 && spanPct <= 71, `iPhone13 span=${spanPct.toFixed(1)}% 不在 65-71%`);
                    });

                    // ── T7-2：_tryAutoOrientFaces（單面旋轉 90°/180°/270° 全部能還原）
                    run('T7-2 _tryAutoOrientFaces 單面旋轉', () => {
                        if (!window.Cube) throw new Error('cubejs 未載入');
                        const ROT = [
                            [0,1,2,3,4,5,6,7,8],
                            [6,3,0,7,4,1,8,5,2],
                            [8,7,6,5,4,3,2,1,0],
                            [2,5,8,1,4,7,0,3,6],
                        ];
                        const SOLVED = STATE_FACE_ORDER.map(f => f.repeat(9)).join('');
                        const savedConfirmed = this.scanConfirmedFaces;
                        try {
                            for (let fi = 0; fi < 6; fi++) {
                                for (let r = 1; r < 4; r++) {
                                    const f = STATE_FACE_ORDER[fi];
                                    const scrambled = {};
                                    STATE_FACE_ORDER.forEach((ff, i) => {
                                        scrambled[ff] = SOLVED.slice(i*9, i*9+9).split('');
                                    });
                                    scrambled[f] = ROT[r].map(i => scrambled[f][i]);
                                    this.scanConfirmedFaces = scrambled;
                                    const fixed = this._tryAutoOrientFaces();
                                    this.assertTest(fixed !== null, `${f}面旋轉${r*90}° 應能找到合法狀態`);
                                    const cube = window.Cube.fromString(fixed);
                                    this.assertTest(cube.asString() === fixed, `${f}面旋轉${r*90}° 修正後 cubejs 驗證通過`);
                                }
                            }
                        } finally {
                            this.scanConfirmedFaces = savedConfirmed;
                        }
                    });

                    // ── T7-3：_tryAutoOrientFaces（兩面同時旋轉）
                    run('T7-3 _tryAutoOrientFaces 兩面旋轉', () => {
                        if (!window.Cube) throw new Error('cubejs 未載入');
                        const ROT = [
                            [0,1,2,3,4,5,6,7,8],
                            [6,3,0,7,4,1,8,5,2],
                            [8,7,6,5,4,3,2,1,0],
                            [2,5,8,1,4,7,0,3,6],
                        ];
                        const SOLVED = STATE_FACE_ORDER.map(f => f.repeat(9)).join('');
                        const savedConfirmed = this.scanConfirmedFaces;
                        try {
                            // 5 次隨機兩面旋轉
                            for (let trial = 0; trial < 5; trial++) {
                                const scrambled = {};
                                STATE_FACE_ORDER.forEach((ff, i) => {
                                    scrambled[ff] = SOLVED.slice(i*9, i*9+9).split('');
                                });
                                const f1 = Math.floor(Math.random() * 6);
                                let f2; do { f2 = Math.floor(Math.random() * 6); } while (f2 === f1);
                                const r1 = 1 + Math.floor(Math.random() * 3);
                                const r2 = 1 + Math.floor(Math.random() * 3);
                                scrambled[STATE_FACE_ORDER[f1]] = ROT[r1].map(i => scrambled[STATE_FACE_ORDER[f1]][i]);
                                scrambled[STATE_FACE_ORDER[f2]] = ROT[r2].map(i => scrambled[STATE_FACE_ORDER[f2]][i]);
                                this.scanConfirmedFaces = scrambled;
                                const fixed = this._tryAutoOrientFaces();
                                this.assertTest(fixed !== null,
                                    `兩面旋轉(${STATE_FACE_ORDER[f1]}${r1*90}°,${STATE_FACE_ORDER[f2]}${r2*90}°) 應能還原`);
                            }
                        } finally {
                            this.scanConfirmedFaces = savedConfirmed;
                        }
                    });

                    // ── T7-4：StateValidator3（cubejs 整合）
                    run('T7-4 StateValidator3 整合驗證', () => {
                        const SOLVED = STATE_FACE_ORDER.map(f => f.repeat(9)).join('');
                        let v = StateValidator3.validate(SOLVED);
                        this.assertTest(v.ok, `SOLVED 應通過: ${v.errors.join(',')}`);

                        v = StateValidator3.validate('U'.repeat(54));
                        this.assertTest(!v.ok, '全 U 應失敗');

                        v = StateValidator3.validate(SOLVED.slice(0, 53));
                        this.assertTest(!v.ok, '53 字元應失敗');

                        // 中心格重複（U 中心改 R）
                        v = StateValidator3.validate(SOLVED.slice(0,4) + 'R' + SOLVED.slice(5));
                        this.assertTest(!v.ok, '中心格重複 + 數量錯誤應失敗');
                    });

                    // ── T7-5：center sticker 點擊處理（兩拍模式重新分類）
                    run('T7-5 兩拍中心格點擊邏輯', () => {
                        // 確認 _reclassifyPanelFromCenter 存在且可呼叫（由 handleShotReviewCanvasClick 使用）
                        this.assertTest(typeof this._reclassifyPanelFromCenter === 'function',
                            '_reclassifyPanelFromCenter 方法應存在');
                        // 構造一個假 panel
                        const fakePanel = {
                            slot: 'top', expectedFace: 'U',
                            originalRgbs: Array(9).fill(null).map((_, i) => ({ r: 215, g: 205, b: 22 })),
                            classifiedColors: Array(9).fill('U'),
                            userEdits: Array(9).fill(false),
                            confidence: Array(9).fill(50),
                        };
                        this._reclassifyPanelFromCenter(fakePanel, 'U');
                        this.assertTest(fakePanel.classifiedColors.length === 9, '分類後仍應有 9 格');
                    });

                    // ── T7-5b：_trySwapPairs（兩拍貼紙位置弄反）
                    run('T7-5b _trySwapPairs 對調修復', () => {
                        if (!window.Cube) throw new Error('cubejs 未載入');
                        const SOLVED = STATE_FACE_ORDER.map(f => f.repeat(9)).join('');
                        const savedConfirmed = this.scanConfirmedFaces;
                        const savedEdits = this.scanFaceUserEdits;
                        try {
                            // 模擬：使用者把 F[0] 跟 L[2] 寫反
                            // 注意：必須是兩個未鎖定貼紙之間的 swap，且 swap 後必須是合法狀態
                            const scrambled = {};
                            STATE_FACE_ORDER.forEach((f, i) => {
                                scrambled[f] = SOLVED.slice(i*9, i*9+9).split('');
                            });
                            // F[0]='L', L[2]='F'（人為對調）
                            scrambled.F[0] = 'L';
                            scrambled.L[2] = 'F';
                            this.scanConfirmedFaces = scrambled;
                            this.scanFaceUserEdits = {};
                            const fixed = this._trySwapPairs();
                            this.assertTest(fixed !== null, '_trySwapPairs 應能修復簡單對調 (F[0] ↔ L[2])');
                            // 驗證修復後 cubejs 通過
                            const cube = window.Cube.fromString(fixed);
                            this.assertTest(cube.asString() === fixed, '修復後狀態應通過 cubejs 驗證');
                        } finally {
                            this.scanConfirmedFaces = savedConfirmed;
                            this.scanFaceUserEdits = savedEdits;
                        }
                    });

                    // ── T7-5c：_tryDeepAutoFix 整合（面旋轉 + 對調 + 平衡）
                    run('T7-5c _tryDeepAutoFix 整合修復', () => {
                        if (!window.Cube) throw new Error('cubejs 未載入');
                        const ROT = [[0,1,2,3,4,5,6,7,8],[6,3,0,7,4,1,8,5,2],[8,7,6,5,4,3,2,1,0],[2,5,8,1,4,7,0,3,6]];
                        const SOLVED = STATE_FACE_ORDER.map(f => f.repeat(9)).join('');
                        const savedConfirmed = this.scanConfirmedFaces;
                        const savedEdits = this.scanFaceUserEdits;
                        try {
                            // 案例 1：純面旋轉錯誤（U 面旋轉了 90°）
                            const c1 = {};
                            STATE_FACE_ORDER.forEach((f, i) => { c1[f] = SOLVED.slice(i*9, i*9+9).split(''); });
                            c1.U = ROT[1].map(i => c1.U[i]);
                            this.scanConfirmedFaces = c1;
                            this.scanFaceUserEdits = {};
                            this.assertTest(this._tryDeepAutoFix() !== null, '案例1：U面旋轉90° 應修復');

                            // 案例 2：兩格貼紙位置弄反
                            const c2 = {};
                            STATE_FACE_ORDER.forEach((f, i) => { c2[f] = SOLVED.slice(i*9, i*9+9).split(''); });
                            c2.F[0] = 'L'; c2.L[2] = 'F';
                            this.scanConfirmedFaces = c2;
                            this.scanFaceUserEdits = {};
                            this.assertTest(this._tryDeepAutoFix() !== null, '案例2：兩格對調 應修復');
                        } finally {
                            this.scanConfirmedFaces = savedConfirmed;
                            this.scanFaceUserEdits = savedEdits;
                        }
                    });

                    // ── T7-5d：_tryCubeOrientations（整體朝向重分配）
                    run('T7-5d 整體方塊朝向重分配', () => {
                        if (!window.Cube) throw new Error('cubejs 未載入');
                        const SOLVED = STATE_FACE_ORDER.map(f => f.repeat(9)).join('');
                        const savedConfirmed = this.scanConfirmedFaces;
                        const savedEdits = this.scanFaceUserEdits;
                        try {
                            // 模擬「使用者把方塊轉了 90° 拍」：原本 U 的資料被當成 R，等等
                            // 構造方式：取已解狀態，把 U/R/F/D/L/B 重新排列成 F/U/R/B/D/L
                            // （這是 cube y' 旋轉後的狀態）
                            // 然後也把貼紙字母對應地改寫

                            // y' rotation: F is now where R was. Mapping: oldR→newF, oldF→newL, oldL→newB, oldB→newR
                            const rotMap = {U:'U', R:'F', F:'L', D:'D', L:'B', B:'R'};  // newPos → oldPos
                            const inverse = {};
                            FACES.forEach(f => inverse[rotMap[f]] = f);
                            const newFaces = {};
                            FACES.forEach(f => {
                                const orig = SOLVED.slice(FACES.indexOf(rotMap[f])*9, FACES.indexOf(rotMap[f])*9+9).split('');
                                newFaces[f] = orig.map(c => inverse[c]);
                            });
                            this.scanConfirmedFaces = newFaces;
                            this.scanFaceUserEdits = {};
                            // 直接 _tryAutoOrientFaces 應該不夠（因為標籤錯誤）
                            // _tryCubeOrientations 才能修

                            await this.nextGuideStep(false);
                            await this.nextGuideStep(false);
                            await this.nextGuideStep(false);
                            await this.previousGuideStep(false);
                            await this.previousGuideStep(false);
                            await this.previousGuideStep(false);
                            this.assertTest(this.readCurrentState() === SOLVED_STATE, 'Guide previous-step playback should return to the start state.');
                        });
                    });

                    await run('T5-3 自動播放完成', async () => {
                        await this.withSuppressedWinChecksAsync(async () => {
                            this.setState(SOLVED_STATE);
                            for (const move of "F R U R' U' F'".split(/\s+/)) await this.applyNotationMove(move, false);
                            const solution = await this.buildSolutionForCurrentState(() => {});
                            this.startSolveGuide(solution.moves);
                            const oldDelay = this.guideDelayMs, oldAnim = this.guideAnimMs;
                            this.guideDelayMs = 1; this.guideAnimMs = 1;
                            await this.toggleGuideAutoPlay();
                            this.guideDelayMs = oldDelay; this.guideAnimMs = oldAnim;
                            this.assertTest(this.checkIsSolved(false), 'Guide autoplay should solve the cube.');
                        });
                    });

                    this.closeSolveGuide();
                    this.setState(SOLVED_STATE);
                    const elapsed = Math.round((performance.now() - started) * 100) / 100;
                    this.updateTestStatus('passed', `Phase 5 T5 測試全數通過 (${elapsed}ms)`);
                    console.table(results);
                    if (!options.silent) alert(`Phase 5 T5 測試全數通過 (${elapsed}ms)。詳細結果已輸出到 console.table。`);
                    return { ok: true, elapsed, results };
                } catch (error) {
                    this.updateTestStatus('failed', `Phase 5 T5 測試失敗：${error.message}`);
                    console.error('Phase 5 T5 test failed:', error);
                    if (!options.silent) alert(`Phase 5 T5 測試失敗：${error.message}`);
                    return { ok: false, error: String(error.message || error) };
                }
            }

            triggerWin() {
                const msg = document.getElementById('win-msg');
                msg.style.opacity = '1';
                msg.style.transform = 'translate(-50%, -50%) scale(1.2)';
                this.createExplosion();
                setTimeout(() => {
                    msg.style.opacity = '0';
                    msg.style.transform = 'translate(-50%, -50%)';
                }, 2200);
            }

            createExplosion() {
                this.cubes.forEach(c => { c.visible = false; });
                const count = 2000;
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const velocities = [];
                for (let i = 0; i < count; i++) {
                    const r = 3.5 * Math.cbrt(Math.random());
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
                    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i*3+2] = r * Math.cos(phi);
                    const hue = Math.random();
                    const c = new THREE.Color().setHSL(hue, 1.0, 0.6);
                    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
                    velocities.push({
                        x: (Math.random() - 0.5) * 0.9,
                        y: (Math.random() - 0.5) * 0.9,
                        z: (Math.random() - 0.5) * 0.9,
                    });
                }
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
                const mat = new THREE.PointsMaterial({
                    size: 0.11, vertexColors: true, transparent: true,
                    opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false,
                });
                const ps = new THREE.Points(geo, mat);
                ps.userData.velocities = velocities;
                this.scene.add(ps);
                this.particles.push(ps);
                this._needsRender = true;
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                // scanner 開著時跳過所有 3D 工作，省電
                if (this._scannerPanelEl && !this._scannerPanelEl.classList.contains('hidden')) return;
                this.controls.update();

                // 粒子動畫（勝利爆炸效果）
                if (this.particles.length > 0) {
                    this._needsRender = true;
                    for (let pi = this.particles.length - 1; pi >= 0; pi--) {
                        const ps = this.particles[pi];
                        const pos = ps.geometry.attributes.position.array;
                        const vels = ps.userData.velocities;
                        for (let i = 0; i < vels.length; i++) {
                            pos[i*3]   += vels[i].x;
                            pos[i*3+1] += vels[i].y;
                            pos[i*3+2] += vels[i].z;
                            vels[i].y  -= 0.008; // 重力
                        }
                        ps.geometry.attributes.position.needsUpdate = true;
                        ps.material.opacity -= 0.011;
                        if (ps.material.opacity <= 0) {
                            this.scene.remove(ps);
                            ps.geometry.dispose();
                            ps.material.dispose();
                            this.particles.splice(pi, 1);
                            if (this.particles.length === 0) {
                                this.cubes.forEach(c => { c.visible = true; });
                            }
                        }
                    }
                }

                if (this.isAnimating || this._needsRender) {
                    this.renderer.render(this.scene, this.camera);
                    this._needsRender = false;
                }
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this._needsRender = true;
            }
        }

        window.onload = () => {
            window.game = new RubiksGame();
            const params = new URLSearchParams(window.location.search);
            if (params.get('test') === '1') {
                setTimeout(() => window.game.runPhase1Tests({ silent: params.get('silent') === '1' }), 0);
            } else if (params.get('test') === '2') {
                setTimeout(() => window.game.runPhase2Tests({ silent: params.get('silent') === '1' }), 0);
            } else if (params.get('test') === '3') {
                setTimeout(() => window.game.runPhase3Tests({ silent: params.get('silent') === '1' }), 0);
            } else if (params.get('test') === '4') {
                setTimeout(() => window.game.runPhase4Tests({ silent: params.get('silent') === '1' }), 0);
            } else if (params.get('test') === '5') {
                setTimeout(() => window.game.runPhase5Tests({ silent: params.get('silent') === '1' }), 0);
            } else if (params.get('test') === '6') {
                setTimeout(() => window.game.runPhase6Tests({ silent: params.get('silent') === '1' }), 0);
            } else if (params.get('test') === '7') {
                setTimeout(() => window.game.runPhase7Tests({ silent: params.get('silent') === '1' }), 0);
            } else if (params.get('test') === 'all') {
                setTimeout(async () => {
                    const silent = { silent: true };
                    const phases = [
                        ['Phase 1', () => window.game.runPhase1Tests(silent)],
                        ['Phase 2', () => window.game.runPhase2Tests(silent)],
                        ['Phase 3', () => window.game.runPhase3Tests(silent)],
                        ['Phase 4', () => window.game.runPhase4Tests(silent)],
                        ['Phase 5', () => window.game.runPhase5Tests(silent)],
                        ['Phase 6', () => window.game.runPhase6Tests(silent)],
                        ['Phase 7', () => window.game.runPhase7Tests(silent)],
                    ];
                    const summary = [];
                    for (const [name, fn] of phases) {
                        try {
                            const r = await fn();
                            summary.push({ phase: name, ok: r && r.ok !== false, error: r && r.error ? r.error.message : '' });
                        } catch (e) {
                            summary.push({ phase: name, ok: false, error: e.message });
                        }
                    }
                    console.table(summary);
                    const failed = summary.filter(s => !s.ok);
                    if (failed.length === 0) {
                        window.game.updateTestStatus('passed', `全部 ${phases.length} 個 Phase 通過`);
                        if (params.get('silent') !== '1') alert(`全部 ${phases.length} 個 Phase 通過 ✓`);
                    } else {
                        window.game.updateTestStatus('failed', `${failed.length} 個 Phase 失敗`);
                        if (params.get('silent') !== '1') alert(`失敗：${failed.map(f => f.phase).join(', ')}`);
                    }
                }, 100);
            } else if (params.get('test') === 'e2e') {
                setTimeout(() => window.game.runE2ETest({ silent: params.get('silent') === '1' }), 500);
            } else if (params.get('diag') === 'cubejs') {
                setTimeout(() => {
                    try {
                        window.game.solver.ensureAvailable();
                        Cube.initSolver();
                        const identity = new Cube();
                        const identityString = identity.asString();
                        const solvedCube = Cube.fromString(SOLVED_STATE);
                        window.game.updateTestStatus('diag', `identity=${identityString} solvedIsSolved=${solvedCube.isSolved()} solve=${solvedCube.solve(22)}`);
                    } catch (error) {
                        window.game.updateTestStatus('failed', `cubejs diag failed: ${error.message}`);
                    }
                }, 0);
            } else if (params.get('diag') === 'moves') {
                setTimeout(() => {
                    try {
                        window.game.solver.ensureAvailable();
                        const moves = ['U', "U'", 'U2', 'R', "R'", 'R2', 'F', "F'", 'F2', 'D', "D'", 'D2', 'L', "L'", 'L2', 'B', "B'", 'B2'];
                        const mismatches = [];
                        for (const move of moves) {
                            const expected = new Cube().move(move).asString();
                            window.game.setState(SOLVED_STATE);
                            window.game.applyNotationMove(move, false);
                            const actual = window.game.readCurrentState();
                            if (actual !== expected) mismatches.push(`${move}:${actual}/${expected}`);
                        }
                        window.game.setState(SOLVED_STATE);
                        window.game.updateTestStatus(mismatches.length ? 'failed' : 'diag', mismatches.length ? mismatches.join(' | ') : 'all moves match cubejs');
                    } catch (error) {
                        window.game.updateTestStatus('failed', `move diag failed: ${error.message}`);
                    }
                }, 0);
            } else if (params.get('diag') === 'scanner-ui') {
                setTimeout(() => {
                    window.game.scannerMode = 'two-shot';
                    window.game.scanIndex = params.get('shot') === '2' ? 1 : 0;
                    window.game.scanState = SOLVED_STATE.split('');
                    document.getElementById('scanner-panel').classList.remove('hidden');
                    window.game.syncScannerModeUI();
                    window.game.updateScannerStatus();
                    window.game.drawScannerOverlayLoop();
                    window.game.updateTestStatus('diag', 'scanner ui preview');
                }, 0);
            } else {
                // Cube.initSolver() 同步建構約 12M 條目的 BFS pruning tables
                // （桌機 3-5s，手機 5-15s）。趁使用者掃描的閒置時間先把表建好，
                // 避免解題時主執行緒卡死、按鈕停在「初始化 Kociemba」訊息。
                // (與 cube4x4.html 同模式：commit fd5edc1 引入)
                //
                // Scanner gate: Safari/iOS 沒 requestIdleCallback，會退化成 2s setTimeout。
                // 如果使用者那時已經開了 scanner，5-15s 的同步 initSolver() 會卡死
                // camera preview。先檢查 scanner-panel 是否可見，若可見就 reschedule。
                const tryPreloadKociemba = () => {
                    if (!window.Cube || typeof Cube.initSolver !== 'function') return;
                    const solver = window.game && window.game.solver;
                    if (!solver || solver.initialized) return;
                    const scannerEl = document.getElementById('scanner-panel');
                    if (scannerEl && !scannerEl.classList.contains('hidden')) {
                        setTimeout(tryPreloadKociemba, 2000);
                        return;
                    }
                    try {
                        const t0 = performance.now();
                        console.log('[KOCIEMBA] 背景預熱 Cube.initSolver() — 開始');
                        Cube.initSolver();
                        solver.initialized = true;
                        console.log(`[KOCIEMBA] 背景預熱完成 (${Math.round(performance.now() - t0)}ms)`);
                    } catch (e) {
                        console.warn('[KOCIEMBA] 預熱失敗（首次解題時會自動重試）:', e);
                    }
                };
                if (typeof requestIdleCallback === 'function') {
                    requestIdleCallback(tryPreloadKociemba, { timeout: 5000 });
                } else {
                    setTimeout(tryPreloadKociemba, 2000);
                }
            }
        };

    </script>

    <!-- Service Worker: pure cache, not a PWA install gateway. See service-worker.js. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(() => {});
            });
        }
    </script>
